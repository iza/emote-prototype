:root{--bg:#f8f7f5;--line:#e7e5e2;--line2:#d6d3d0;--ink:#262626;--ink2:#404040;--mute:#6b6b6b;--soft:#f3f2f0;
  --lime:#bfd961;--slot:#eef1fa;--slotbar:#c5cff0;--blue:#3b5fbb;--peach:#ffb48a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:P,Poppins,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;background:transparent;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ---- browser frame (embed) ---- */
#wrap{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center}
#browser{position:relative;width:1024px;flex:none;transform-origin:0 0;border-radius:12px;overflow:hidden;background:#fff;
  box-shadow:0 0 0 1px rgba(0,0,0,.08),0 18px 50px rgba(0,0,0,.10)}
.chrome{height:40px;background:#f1efec;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 14px}
.dots{display:flex;gap:7px}.dots i{width:11px;height:11px;border-radius:50%;background:#dcd8d3}
.url{flex:1;max-width:460px;margin:0 auto;height:26px;border-radius:7px;background:#fff;border:1px solid var(--line);font-size:12px;color:var(--mute);display:flex;align-items:center;justify-content:center;gap:6px}
.fs{font-size:12px;font-weight:500;height:26px;padding:0 10px;border-radius:7px;display:flex;align-items:center;gap:6px;color:var(--ink2)}
.fs:hover{background:#e7e4df}
html.full #wrap{position:fixed}
html.full #browser{width:100%;height:100%;border-radius:0;box-shadow:none;transform:none!important}
html.full .chrome{display:none}

/* ---- app ---- */
#app{position:relative;height:720px;display:flex;background:var(--bg);overflow:hidden}
html.full #app{height:100%}
.side{width:224px;flex:none;background:#fff;border-right:1px solid var(--line);padding:22px 12px}
.me{padding:0 10px 18px}.me img{width:72px;height:72px;border-radius:12px;display:block;object-fit:cover}
.me b{display:block;font-size:13px;font-weight:500;margin-top:10px}
.nav button{width:100%;display:flex;align-items:center;gap:10px;height:42px;padding:0 12px;border-radius:8px;font-size:13.5px;color:var(--ink2);text-align:left}
.nav button:hover{background:#faf9f7}.nav button.on{background:var(--soft);color:var(--ink)}
.nav svg{width:18px;height:18px;flex:none}
.nav .dot{width:7px;height:7px;border-radius:50%;background:#e2735f;margin-left:auto}
main{flex:1;min-width:0;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:30px 36px 40px;opacity:0;pointer-events:none;transition:opacity .25s ease}
.view.on{opacity:1;pointer-events:auto}
.view::-webkit-scrollbar{width:0}
h1{font-size:22px;font-weight:600;letter-spacing:-.2px}
.sub{font-size:14px;color:var(--ink2);margin-top:8px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px}
.btn{height:32px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);font-size:13px;display:inline-flex;align-items:center;gap:8px;background:#fff;transition:background .15s}
.btn:hover{background:#faf9f7}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}.btn.dark:hover{background:#000}
.btn.lg{height:40px;padding:0 22px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:default}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid #cfcac4;border-top-color:var(--ink);animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* checklist */
.ck-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
.ck{margin-top:22px;max-width:720px}
.ck-row{display:flex;gap:16px;padding:22px 22px 22px 22px;border-top:1px solid var(--line)}
.ck-row:first-child{border-top:0}
.ck-main{flex:1}
.ck-group{font-size:15px;font-weight:500;margin-bottom:12px}
.ck-item{display:flex;gap:12px;align-items:flex-start}
.ck-item+.ck-item{margin-top:14px}
.tick{width:22px;height:22px;border-radius:50%;border:1.5px solid #bdb8b2;flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .25s}

/* ---------- nav ---------- */
const NAV=[['dash','home','Dashboard'],['prof','user','My profile'],['rates','tag','My rates'],['avail','cal','My availability'],['msg','mail','Messages']];
function drawNav(){
  const cur={check:'dash',dash:'dash',rates:'rates',avail:'avail',msg:'msg'}[S.view];
  $('#nav').innerHTML=NAV.map(([k,ic,l])=>`<button data-nav="${k}" class="${k===cur?'on':''}">${ico(ic,1.6)}${l}${k==='msg'&&MS.unread()?'<span class="dot"></span>':''}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{const k=b.dataset.nav;
    if(k==='dash')go(S.live?'dash':'check');else if(k==='rates')go('rates');else if(k==='avail')go('avail');
    else if(k==='msg')go('msg');else if(k==='prof'){if(S.live)toast('Your profile is live and visible to clients');else go('check')}});
}
function go(v){S.view=v;document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));
  ({check:drawCheck,rates:drawRates,avail:drawAvail,dash:drawDash,msg:drawMsgs})[v]();drawNav();$('#v-'+v).scrollTop=0}

/* ---------- toast ---------- */
let tH;function toast(msg,act,fn){const t=$('#toast');t.innerHTML=`<span>${msg}</span>${act?`<button type="button">${act}</button>`:''}`;
  if(act)t.querySelector('button').onclick=()=>{t.classList.remove('on');fn()};
  t.classList.add('on');clearTimeout(tH);tH=setTimeout(()=>t.classList.remove('on'),act?4200:2400)}

/* ---------- checklist ---------- */
const TASKS=[
 {g:'Get verified',ill:'rosette',items:[
   {k:'id',t:'ID verification',b:'Verify ID',ok:'ID verified'},
   {k:'mem',t:'Membership verification',d:'We’ll check your qualifications so clients know you’re the real deal',b:'Verify membership',ok:'Membership verified'}]},
 {ill:'profile',items:[{k:'prof',t:'Help clients get to know you',d:'Share what makes you unique as a therapist so clients feel confident choosing you.',b:'Complete your profile',e:'Edit your profile',ok:'Profile completed'}]},
 {ill:'rates',items:[{k:'rates',t:'Set your rates',d:'Attract clients with competitive rates and clear cancellation policies that reflect your expertise and value.',b:'Set your rates',e:'Edit your rates',to:'rates'}]},
 {ill:'wallet',items:[{k:'bank',t:'Add your bank details',d:'After each session, your payment (minus the platform fee) will be transferred directly to your bank account.',b:'Add your bank details',e:'Edit your bank details',ok:'Bank details added'}]},
 {ill:'calendar',items:[{k:'avail',t:'Set your availability',d:'Add the times you’re free, so clients can book sessions that suit you both.',b:'Set your availability',e:'Edit your availability',to:'avail'}]}];
const allDone=()=>Object.values(S.done).every(Boolean);
function drawCheck(){
  const all=allDone();
  $('#v-check').innerHTML=`<div class="ck" style="max-width:720px">
    <div class="ck-head"><div><h1>Hi, Christopher</h1><p class="sub">${all?'All tasks are complete. Your profile is now fully set up and ready.':'Please complete these tasks for your profile to be listed.'}</p></div>
    ${all?'<button class="btn dark lg" id="start" type="button">Get started</button>':''}</div>
    <div class="card" style="margin-top:22px">${TASKS.map(g=>`<div class="ck-row"><div class="ck-main">${g.g?`<div class="ck-group">${g.g}</div>`:''}
      ${g.items.map(it=>{const d=S.done[it.k];const hideBtn=d&&!it.e;
        return `<div class="ck-item ${d?'done':''}"><span class="tick">${ico('check',3)}</span><div><h3>${it.t}</h3>${it.d?`<p>${it.d}</p>`:''}
        ${hideBtn?'':`<button class="btn" type="button" data-k="${it.k}">${d?it.e:it.b}</button>`}</div></div>`}).join('')}
      </div><div class="ill"><img src="${IMG[g.ill]}" alt=""></div></div>`).join('')}</div></div>`;
  $('#v-check').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{
    const it=TASKS.flatMap(g=>g.items).find(x=>x.k===b.dataset.k);
    if(it.to){go(it.to);return}
    if(S.done[it.k]){toast(`${it.t}: all set`);return}
    b.disabled=true;b.innerHTML='<span class="spin"></span>'+(it.k==='id'||it.k==='mem'?'Verifying…':'Saving…');
    setTimeout(()=>{S.done[it.k]=true;toast(it.ok);drawCheck()},950)});
  const st=$('#start');if(st)st.onclick=()=>{S.live=true;go('dash');setTimeout(newBookings,2600)};
}

function drawGrid(){

  body.innerHTML=`<div class="grid-h" style="grid-template-columns:${tpl}"><div style="padding-top:22px">GMT+1</div>${cols.map(d=>{const dt=dayDate(S.week,d);return `<div class="${S.week===0&&d===3?'today':''}">${DAYS[d]}<b>${dt.getDate()}</b></div>`}).join('')}</div>
   <div class="gscroll" id="gs"><div class="grid" style="grid-template-columns:${tpl}">${HOURS.map(h=>`<div class="hr">${fmtH(h)}</div>${cols.map(d=>{const s=S.slots[key(S.week,d,h)];
     return `<div class="cell ${s?'busy':''}" data-d="${d}" data-h="${h}">${s?slotHTML(s,h):''}</div>`}).join('')}`).join('')}</div>
   ${any?'':`<div class="empty-hint" id="hint"><b>Your calendar is empty</b>Click any time to add a 50-min slot,<br>or use “Add availability” to set your week.</div>`}</div>`;

function drawMonth(){
  const body=$('#calBody');const d0=dayDate(S.week,0);const first=new Date(d0.getFullYear(),d0.getMonth(),1);
  const start=new Date(first);start.setDate(1-((first.getDay()+6)%7));
  let cells='';for(let i=0;i<35;i++){const dt=new Date(start);dt.setDate(start.getDate()+i);
    const w=Math.floor((dt-BASE)/864e5/7),d=(dt.getDay()+6)%7;

function drawMsgs(){
  const v=$('#v-msg');const p=MS.people.find(x=>x[0]===MS.cur);const th=MS.threads[MS.cur]||[];
  if(MS.unreadN[MS.cur]){MS.unreadN[MS.cur]=0;setTimeout(drawNav)}
  v.innerHTML=`<div class="msgs"><div class="mwrap"><div class="mlist"><h2>Messages</h2><div class="msearch">${ico('search',2)}Search messages</div>
    <div class="mitems">${MS.people.map(([k,n,c])=>`<button class="mi ${k===MS.cur?'on':''} ${MS.unreadN[k]?'unread':''}" type="button" data-p="${k}">${pav(c)}${n}${MS.unreadN[k]?`<span class="badge">${MS.unreadN[k]}</span>`:''}</button>`).join('')}</div></div>
   <div class="mchat"><div class="mhead">${pav(p[2])}<span>Chat with <b>${p[1]}</b></span><button class="btn" type="button" id="mAvail">Add availability</button></div>
    <div class="mbodyc" id="mb"><div class="rule"><b>All communication and sessions must happen on the platform.</b>It keeps boundaries clear and protects you, your clients and your practice<br>by keeping everything secure, documented and in one place.</div>
     ${th.length?`<div class="dayl">Today</div>${th.map(bub).join('')}`:`<div class="mstart"><img src="${IMG.hello}" alt=""><b>Start conversation</b>This is the very beginning<br>of your direct messages with ${p[1].split(' ')[0]}</div>`}</div>
    <div class="warn" id="warn">${ico('clock',2).replace('<svg','<svg width="13" height="13"')}All communication must stay on emoteCare. Sharing contact details takes clients off the platform.</div>
    <div class="mcomp"><textarea id="mt" placeholder="Type your message…" aria-label="Message">${MS.typed}</textarea><div class="row"><button class="btn dark sm" id="send" type="button" disabled>Send</button></div></div></div></div></div>`;
  const mb=$('#mb');mb.scrollTop=mb.scrollHeight;
  v.querySelectorAll('.mi').forEach(b=>b.onclick=()=>{MS.cur=b.dataset.p;MS.typed='';drawMsgs()});
  $('#mAvail').onclick=()=>{go('avail');setTimeout(openDrawer,250)};
  const ta=$('#mt'),send=$('#send');
  const sync=()=>{MS.typed=ta.value;const bad=CONTACT.test(ta.value);$('#warn').classList.toggle('on',bad);send.disabled=!ta.value.trim()||bad};
  ta.oninput=sync;sync();
  ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(!send.disabled)send.click()}};
  send.onclick=()=>{const msg=ta.value.trim();(MS.threads[MS.cur]=MS.threads[MS.cur]||[]).push({f:'me',t:msg,at:now()});MS.typed='';const who=MS.cur;drawMsgs();
    const r=REPLY[who];if(!r)return;const mb2=$('#mb');const ty=document.createElement('div');ty.className='bub';ty.innerHTML=`${pav(p[2])}<div class="tx typing"><i></i><i></i><i></i></div>`;mb2.appendChild(ty);mb2.scrollTop=mb2.scrollHeight;
    setTimeout(()=>{MS.threads[who].push({f:'them',t:r.shift()||'Thank you!',at:now()});if(S.view==='msg'&&MS.cur===who)drawMsgs()},1600)};
}
const REPLY={liam:['Thursday at 2 PM works perfectly. Thank you, see you then!','Great, thanks again.'],henry:['Thank you, that really helps!']};
const now=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
