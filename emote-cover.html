const W=2400,H=1500,stage=document.getElementById('stage');
const params=new URLSearchParams(location.search);
function setBg(b){document.body.dataset.bg=b;document.body.classList.toggle('light',['sand','sage','wood'].includes(b));document.querySelectorAll('#sw button').forEach(x=>x.classList.toggle('on',x.dataset.bg===b))}
setBg(['teal','ink','sand','sage','wood'].includes(params.get('bg'))?params.get('bg'):'ink');
if(!params.has('embed')){const sw=document.getElementById('sw');sw.style.display='flex';sw.onclick=e=>{if(e.target.dataset.bg)setBg(e.target.dataset.bg)}}

function fit(){const s=Math.max(innerWidth/W,innerHeight/H);stage.style.transform=`translate(${(innerWidth-W*s)/2}px,${(innerHeight-H*s)/2}px) scale(${s})`}
addEventListener('resize',fit);fit();

/* seeded random so the opening composition is always the same */
let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const R=(a,b)=>a+rnd()*(b-a);
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

const DRIFT=13;                 // slow table drift, stage px per second (right to left)
const SC=1.36;                  // card scale on the stage
const GAP=545,MIDY=750;         // one loose row
const cards=CARDS.map((src,i)=>{
  const d=document.createElement('div');d.className='card';d.innerHTML=`<img src="data:image/jpeg;base64,${src}" alt="">`;
  stage.appendChild(d);
  const c={el:d,x:80+i*GAP+R(-40,40),y:MIDY+R(-110,110),r:R(-5,5),s:SC,mv:null,ph:R(0,6.3),per:R(11,16)};
  d.style.zIndex=i+1;return c;                     // stacking never changes on screen
});
let z=cards.length;
let T=0;
function place(c){const f=Math.sin(T/c.per*6.283+c.ph);c.el.style.transform=`translate(${c.x}px,${c.y+f*12}px) rotate(${c.r+f*.7}deg) scale(${c.s})`}
cards.forEach(place);

/* a "nudge": a card is gently pushed a little, turned slightly and settles again */
function nudge(c,now){
  let dy=R(-70,70);if(c.y+dy<MIDY-150||c.y+dy>MIDY+150)dy=-dy;
  let dr=R(-3.5,3.5);if(Math.abs(c.r+dr)>6)dr=-dr;
  let dx=R(-90,40);const MIN=GAP-25;               // never crowd the neighbours
  const L=cards.filter(o=>o.x<c.x).sort((a,b)=>b.x-a.x)[0],Rn=cards.filter(o=>o.x>c.x).sort((a,b)=>a.x-b.x)[0];
  if(L&&c.x+dx<L.x+MIN)dx=Math.min(0,L.x+MIN-c.x);
  if(Rn&&c.x+dx>Rn.x-MIN)dx=Math.max(0,Rn.x-MIN-c.x);
  c.mv={t0:now,dur:R(5500,7500),y0:c.y,r0:c.r,dx,dy,dr};
  c.el.classList.add('lift');
}
let last=performance.now(),nextNudge=last+900;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tick(now){
  const dt=Math.min(64,now-last)/1000;last=now;
  if(!document.hidden){
    T+=dt;
    for(const c of cards){
      c.x-=DRIFT*dt;
      if(c.mv){
        const m=c.mv,p=Math.max(0,Math.min(1,(now-m.t0)/m.dur)),e=ease(p);
        const shift=m.dx*e;c.x+=shift-(m.lastShift||0);m.lastShift=shift;
        c.y=m.y0+m.dy*e;c.r=m.r0+m.dr*e;
        c.s=SC*(1+.015*Math.sin(Math.PI*p));
        if(p>=1){c.mv=null;c.s=SC;c.el.classList.remove('lift')}
      }
    }
    for(const c of cards){
      if(c.x<-360){                                   // fully off the left: rejoin the row at the far right, out of view
        const right=Math.max(...cards.map(o=>o.x));
        c.x=right+GAP+R(-30,30);c.y=MIDY+R(-110,110);c.r=R(-5,5);c.mv=null;c.s=SC;c.el.classList.remove('lift');
        c.el.style.zIndex=++z;                        // it is off screen, so the new stacking is never seen
      }
      place(c);
    }
    if(now>nextNudge){
      const vis=cards.filter(c=>!c.mv&&c.x>200&&c.x<W-200);
      if(vis.length)nudge(vis[Math.floor(rnd()*vis.length)],now);
      nextNudge=now+R(3000,5000);
    }
  }
  requestAnimationFrame(tick);
}
if(!reduce)requestAnimationFrame(tick);
