.card{background:#fff;font-family:P,Poppins,system-ui,sans-serif;color:#262626;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
.card .ph{height:360px;flex:none;border-radius:16px 16px 0 0;overflow:hidden}
.card .ph img{display:block;width:360px;height:360px}
.card .tw{margin-top:-31px;padding:0 12px;display:flex;flex-direction:column;gap:6px;position:relative}
.card .tg{border-radius:12px;padding:8px 12px;font-size:14px;line-height:24px;font-weight:500}
.card .pl{display:flex;gap:6px}
.card .ap{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:8px;font-size:12px;line-height:20px}
.card .ib{display:inline-flex;align-items:center;height:28px;padding:0 8px;border-radius:8px;background:#f6f5f4;font-size:12px;line-height:20px}
.card svg{width:16px;height:16px;flex:none}
.card .bd{padding:16px 24px 0;display:flex;flex-direction:column}
.card .nm{display:flex;align-items:center;gap:8px;font-size:18px;line-height:28px;font-weight:500;letter-spacing:-.18px}
.card .nm span{display:flex;gap:4px}.card .nm svg{width:20px;height:20px}
.card .rg{display:flex;align-items:center;gap:4px;font-size:12px;line-height:20px;font-weight:500;color:#3b5fbb}
.card .mt{font-size:12px;line-height:20px;color:#404040;margin-top:4px}
.card .mt .two{display:flex;gap:12px}.card .mt u{text-underline-offset:2px}
.card .lk{height:32px;display:inline-flex;align-items:center;font-size:12px;line-height:16px;color:#3b5fbb;text-decoration:underline;text-underline-offset:2px;align-self:flex-start}
.card .sl{margin-top:auto;display:flex;align-items:flex-end;gap:8px;padding:8px 24px 24px}
.card .am{display:flex;align-items:center;gap:4px}.card .am b{font-size:18px;line-height:28px;font-weight:500}.card .am i{font-style:normal;font-size:12px;line-height:20px;color:#525252}
.card .bk{height:40px;padding:0 16px;min-width:112px;border-radius:999px;background:#262626;color:#fff;font-size:14px;line-height:40px;text-align:center;flex:none}
.finger{position:absolute;left:0;top:0;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;z-index:100000;pointer-events:none;opacity:0;background:radial-gradient(circle at 45% 40%,rgba(255,255,255,.75),rgba(255,255,255,.42) 60%,rgba(255,255,255,.28));box-shadow:0 0 0 4px rgba(255,255,255,.7),0 10px 26px rgba(0,0,0,.28);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
#sw{position:fixed;left:12px;top:12px;z-index:9;display:none;gap:6px;font:500 12px/1 system-ui,sans-serif}
#sw button{border:0;border-radius:99px;padding:8px 12px;background:rgba(255,255,255,.85);cursor:pointer}
#sw button.on{background:#171717;color:#fff}
</style>

function cardHTML(d){const [an,tc,pc]=AP[d.a];
 return `<div class="ph"><img src="data:image/jpeg;base64,${PH[d.p]}" alt=""></div>
 <div class="tw"><div class="tg" style="background:${tc}">${d.t}</div>
 <div class="pl"><span class="ap" style="background:${pc}">${an}${IC.info}</span>${d.nointro?'':'<span class="ib">Intro call</span>'}</div></div>
 <div class="bd"><div class="nm">${d.n}<span>${d.ic.includes('v')?IC.verified:''}${d.ic.includes('m')?IC.message:''}</span></div>
 <div class="rg">BACP${IC.info}</div>
 <div class="mt"><div class="two"><span>Age: ${d.age||36}</span><span>Gender: ${d.g}</span></div><div>Speaks: ${d.s}</div><div>Experience: ${d.exp||8} years</div></div>
 <span class="lk">See profile</span></div>
 <div class="sl"><div style="flex:1"><div class="am"><b>£${d.price||45}</b><i>per session</i></div>${d.con?'<span class="lk" style="height:28px">Concessions available</span>':''}</div><span class="bk">Book now</span></div>`}
const W=2400,H=1500,stage=document.getElementById('stage');
const params=new URLSearchParams(location.search);
function setBg(b){document.body.dataset.bg=b;document.body.classList.toggle('light',['sand','sage','wood'].includes(b));document.querySelectorAll('#sw button').forEach(x=>x.classList.toggle('on',x.dataset.bg===b))}
setBg(['teal','ink','sand','sage','wood'].includes(params.get('bg'))?params.get('bg'):'ink');
if(!params.has('embed')){const sw=document.getElementById('sw');sw.style.display='flex';sw.onclick=e=>{if(e.target.dataset.bg)setBg(e.target.dataset.bg)}}

let fw=-1,fh=-1;
function fit(){const w=document.documentElement.clientWidth||innerWidth,h=document.documentElement.clientHeight||innerHeight;if(w===fw&&h===fh)return;fw=w;fh=h;if(!w||!h)return;const s=Math.max(w/W,h/H);stage.style.transform=`translate(${(w-W*s)/2}px,${(h-H*s)/2}px) scale(${s})`}
addEventListener('resize',fit);addEventListener('load',fit);addEventListener('pageshow',fit);if(window.ResizeObserver)new ResizeObserver(fit).observe(document.documentElement);fit();setInterval(fit,500);

/* seeded random so the opening composition is always the same */
let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const R=(a,b)=>a+rnd()*(b-a);
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

/* ---- cards spread loosely on a table; one at a time is picked up, considered and put down somewhere else ---- */
const SC=2400/1650,CW=360*SC,CH=682*SC;
const BX=[CW*.5-90,W-CW*.5+90],BY=[CH*.5+10,H-CH*.5-10];
const SHOW=[                                           // the five cards of the Figma EMOTE_COVER frame, bottom to top
 {p:'elena',n:'Elena Petrova',t:'Compassionate, holistic counsellor<br>offering integrative, body-based support',a:'hum',ic:'vm',g:'Female',s:M2,age:41,exp:12,price:55,nointro:1},
 {p:'eve',n:'Eve Houseman',t:'I truly care about my clients and nurture the working relationships',a:'int',ic:'v',g:'Female',s:'English'},
 {p:'chris',n:'Marcus Rivera',t:'Practical, structured support<br>for anxiety and low mood',a:'cbt',ic:'',g:'Male',s:M2,nointro:1},
 {p:'candy',n:'Aisha Okonkwo',t:'I can help you trust yourself and unlock the superpower within you',a:'psy',ic:'vm',g:'Male',s:M2},
 {p:'charlotte',n:'Charlotte Whitmore',t:'Integrative counsellor supporting your unique journey of self-growth',a:'sys',ic:'vm',g:'Male',s:M2}];
const cards=SHOW.map(dd=>{const d=document.createElement('div');d.className='card';d.innerHTML=cardHTML(dd);stage.appendChild(d);
  return {col:AP[dd.a][1],el:d,x:-9999,y:-9999,r:0,s:SC,path:null}});
let z=0;cards.forEach(c=>c.el.style.zIndex=++z);
const nd=(p,q)=>Math.hypot((p.x-q.x)/CW,(p.y-q.y)/CH);   // distance in card-sizes
function spot(c,others,edge){                               // a fairly open spot, never right beside a same-colour card
  let best=null,bs=-1e9;
  for(let i=0;i<120;i++){const p={x:R(BX[0],BX[1]),y:R(640,860)};       // stay in the row
    let s=9;for(const o of others){const d=nd(p,o);s=Math.min(s,d);if(o.col===c.col&&d<1.9)s-=5}
    if(edge&&Math.abs(p.x-W/2)<420)s-=3;
    s+=R(0,.25);if(s>bs){bs=s;best=p}}
  return best;
}
const START=[[220,690,-1.6],[2259,740,2],[575,859,0],[1683,832,0],[1162,641,2.4]];   // positions from the Figma cover
cards.forEach((c,i)=>{c.x=START[i][0];c.y=START[i][1];c.r=START[i][2]});
function place(c){c.el.style.transform=`translate(${c.x}px,${c.y}px) rotate(${c.r}deg) scale(${c.s})`}
cards.forEach(place);
const easeIO=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const clampP=p=>({...p,x:Math.min(BX[1]+60,Math.max(BX[0]-60,p.x)),y:Math.min(BY[1]+40,Math.max(BY[0]-40,p.y))});
function onTop(c){return !cards.some(o=>o!==c&&+o.el.style.zIndex>+c.el.style.zIndex&&Math.abs(o.x-c.x)<CW*.95&&Math.abs(o.y-c.y)<CH*.95)}
let lastC=null;
let turn=0;
function pick(now){
  const free=cards.filter(c=>!c.path&&c!==lastC&&onTop(c));if(!free.length)return;
  const think=(turn++%3)!==2;                          // two out of three moves: bring a card to the middle to look at it
  const c=think?free.sort((a,b)=>Math.abs(b.x-W/2)-Math.abs(a.x-W/2))[Math.floor(rnd()*Math.min(2,free.length))]
               :free[Math.floor(rnd()*free.length)];
  lastC=c;
  const k0={x:c.x,y:c.y,r:c.r,s:SC};
  const lift={x:c.x+R(-14,14),y:c.y-R(10,22),r:c.r+R(-2,2),s:SC*1.05,d:480};
  let frames;
  if(think){                                         // picked up from the edge, brought to the centre on top of the others,
    const cx=W/2+R(-70,70),cy=H/2+R(-30,20),cr=R(-2.5,2.5);   // held for a moment, then put back out on the table
    const to=spot(c,cards.filter(o=>o!==c),true),rt=R(-5,5);
    frames=[lift,
      {x:cx,y:cy,r:cr,s:SC*1.13,d:R(1900,2300)},
      {x:cx+R(-18,18),y:cy+R(-12,8),r:cr+R(-1.8,1.8),s:SC*1.14,d:R(1400,2000)},
      {x:cx+R(-14,14),y:cy+R(-8,10),r:cr+R(-1.5,1.5),s:SC*1.13,d:R(1100,1600)},
      {...to,r:rt,s:SC*1.03,d:R(1900,2400)},{...to,r:rt,s:SC,d:400}];
  }else if(rnd()<.6){                                // slides it across the table in one easy move
    const to=spot(c,cards.filter(o=>o!==c)),rt=R(-5,5);
    frames=[lift,{...to,r:rt,s:SC*1.03,d:R(2000,2600)},{...to,r:rt,s:SC,d:380}];
  }else{                                             // a small nudge: just shifts and turns it a little
    const p=clampP({x:c.x+R(-180,180),y:c.y+R(-60,60)}),r2=Math.max(-5,Math.min(5,c.r+R(-4,4)));
    frames=[{...lift,s:SC*1.02,d:350},{...p,r:r2,s:SC*1.02,d:R(1300,1700)},{...p,r:r2,s:SC,d:350}];
  }
  c.el.style.zIndex=++z;c.el.classList.add('lift');    // it is the top card, so nothing visibly jumps
  c.path={t0:now,from:k0,frames,i:0};
}
function step(c,now){
  const p=c.path;let f=p.frames[p.i],t=(now-p.t0)/f.d;
  while(t>=1){p.from={x:f.x,y:f.y,r:f.r,s:f.s};p.t0+=f.d;p.i++;
    if(p.i>=p.frames.length){c.x=f.x;c.y=f.y;c.r=f.r;c.s=f.s;c.path=null;c.el.classList.remove('lift');return}
    f=p.frames[p.i];t=(now-p.t0)/f.d}
  const e=easeIO(Math.max(0,t)),a=p.from;
  c.x=a.x+(f.x-a.x)*e;c.y=a.y+(f.y-a.y)*e;c.r=a.r+(f.r-a.r)*e;c.s=a.s+(f.s-a.s)*e;
}
let last=performance.now(),nextPick=last+1200;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tick(now){
  fit();
  if(!document.hidden){
    for(const c of cards)if(c.path){step(c,now);place(c)}
    if(now>nextPick&&!cards.some(c=>c.path)){pick(now);nextPick=now+R(900,2200)}
  }else{last=now}
  requestAnimationFrame(tick);
}
if(!reduce)requestAnimationFrame(tick);
