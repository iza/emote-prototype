.card{background:#fff;font-family:P,Poppins,system-ui,sans-serif;color:#262626;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
.card .ph{height:360px;flex:none;border-radius:16px 16px 0 0;overflow:hidden}
.card .ph img{display:block;width:360px;height:360px}
.card .tw{margin-top:-31px;padding:0 12px;display:flex;flex-direction:column;gap:6px;position:relative}
.card .tg{border-radius:12px;padding:8px 12px;font-size:14px;line-height:24px;font-weight:500}
.card .pl{display:flex;gap:6px}
.card .ap{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:8px;font-size:12px;line-height:20px}
.card .ib{display:inline-flex;align-items:center;height:28px;padding:0 8px;border-radius:8px;background:#f6f5f4;font-size:12px;line-height:20px}
.card svg{width:16px;height:16px;flex:none}
.card .bd{padding:16px 24px 0;display:flex;flex-direction:column}
.card .nm{display:flex;align-items:center;gap:8px;font-size:18px;line-height:28px;font-weight:500;letter-spacing:-.18px}
.card .nm span{display:flex;gap:4px}.card .nm svg{width:20px;height:20px}
.card .rg{display:flex;align-items:center;gap:4px;font-size:12px;line-height:20px;font-weight:500;color:#3b5fbb}
.card .mt{font-size:12px;line-height:20px;color:#404040;margin-top:4px}
.card .mt .two{display:flex;gap:12px}.card .mt u{text-underline-offset:2px}
.card .lk{height:32px;display:inline-flex;align-items:center;font-size:12px;line-height:16px;color:#3b5fbb;text-decoration:underline;text-underline-offset:2px;align-self:flex-start}
.card .sl{margin-top:auto;display:flex;align-items:flex-end;gap:8px;padding:8px 24px 24px}
.card .am{display:flex;align-items:center;gap:4px}.card .am b{font-size:18px;line-height:28px;font-weight:500}.card .am i{font-style:normal;font-size:12px;line-height:20px;color:#525252}
.card .bk{height:40px;padding:0 16px;min-width:112px;border-radius:999px;background:#262626;color:#fff;font-size:14px;line-height:40px;text-align:center;flex:none}
.finger{position:absolute;left:0;top:0;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;z-index:100000;pointer-events:none;opacity:0;background:radial-gradient(circle at 45% 40%,rgba(255,255,255,.75),rgba(255,255,255,.42) 60%,rgba(255,255,255,.28));box-shadow:0 0 0 4px rgba(255,255,255,.7),0 10px 26px rgba(0,0,0,.28);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
#sw{position:fixed;left:12px;top:12px;z-index:9;display:none;gap:6px;font:500 12px/1 system-ui,sans-serif}
#sw button{border:0;border-radius:99px;padding:8px 12px;background:rgba(255,255,255,.85);cursor:pointer}
#sw button.on{background:#171717;color:#fff}
</style>

const AP={cbt:['Cognitive behavioural therapy','#88d2e1','#d5eff5'],psy:['Psychodynamic therapy','#ffba3d','#ffe4a8'],hum:['Humanistic therapy','#bfd961','#e9f2c8'],int:['Integrative therapy','#d29aef','#e4cff2'],psyl:['Psychodynamic therapy','#bfd961','#dfe9b8']};
const M2='English, Spanish + <u>2 more...</u>',M4='English, French, Spanish, Portuguese';
const DATA=[
 {p:'ricardo',n:'Ricardo Arroyo Dans',t:'Need a different perspective or how to ‘thinking outside the box’?',a:'int',ic:'vm',g:'Male',s:M4,con:1},
 {p:'iris',n:'Iris McFee',t:'I transform the lives of the people who are kept awake at night by stress',a:'hum',ic:'',g:'Male',s:M2,con:1,nointro:1},
 {p:'romana',n:'Romana Norman',t:'Building a trusting relationship, where you feel valued and understood',a:'cbt',ic:'v',g:'Male',s:M2},
 {p:'candy',n:'Candy Bokungu',t:'I can help you trust yourself and unlock the superpower within you',a:'psy',ic:'vm',g:'Male',s:M2,con:1},
 {p:'andie',n:'Andie Clift',t:'I believe that essentially we all strive towards the positive',a:'int',ic:'v',g:'Male',s:M4,con:1},
 {p:'beard',n:'Christopher Wellington',t:'Integrative counsellor supporting your unique journey of self-growth',a:'hum',ic:'vm',g:'Male',s:M2,con:1,nointro:1},
 {p:'tracey',n:'Tracey Reinecke',t:'I offer compassionate, tailored support to help you navigate challenges',a:'psy',ic:'vm',g:'Male',s:M2,con:1},
 {p:'eve',n:'Eve Houseman',t:'I truly care about my clients and nurture the working relationships',a:'int',ic:'v',g:'Female',s:'English'},
 {p:'chris',n:'Christopher Wellington',t:'Integrative counsellor supporting your unique journey of self-growth',a:'cbt',ic:'vm',g:'Male',s:M2,con:1},
 {p:'maria',n:'Maria Casson',t:'Integrative therapist supporting self-discovery, meaning, and change',a:'psyl',ic:'vm',g:'Male',s:M2,con:1}
];
function cardHTML(d){const [an,tc,pc]=AP[d.a];
 return `<div class="ph"><img src="data:image/jpeg;base64,${PH[d.p]}" alt=""></div>
 <div class="tw"><div class="tg" style="background:${tc}">${d.t}</div>
 <div class="pl"><span class="ap" style="background:${pc}">${an}${IC.info}</span>${d.nointro?'':'<span class="ib">Intro call</span>'}</div></div>
 <div class="bd"><div class="nm">${d.n}<span>${d.ic.includes('v')?IC.verified:''}${d.ic.includes('m')?IC.message:''}</span></div>
 <div class="rg">BACP${IC.info}</div>
 <div class="mt"><div class="two"><span>Age: 36</span><span>Gender: ${d.g}</span></div><div>Speaks: ${d.s}</div><div>Experience: 8 years</div></div>
 <span class="lk">See profile</span></div>
 <div class="sl"><div style="flex:1"><div class="am"><b>£45</b><i>per session</i></div>${d.con?'<span class="lk" style="height:28px">Concessions available</span>':''}</div><span class="bk">Book now</span></div>`}
const W=2400,H=1500,stage=document.getElementById('stage');
const params=new URLSearchParams(location.search);
function setBg(b){document.body.dataset.bg=b;document.body.classList.toggle('light',['sand','sage','wood'].includes(b));document.querySelectorAll('#sw button').forEach(x=>x.classList.toggle('on',x.dataset.bg===b))}
setBg(['teal','ink','sand','sage','wood'].includes(params.get('bg'))?params.get('bg'):'ink');
if(!params.has('embed')){const sw=document.getElementById('sw');sw.style.display='flex';sw.onclick=e=>{if(e.target.dataset.bg)setBg(e.target.dataset.bg)}}

function fit(){const s=Math.max(innerWidth/W,innerHeight/H);stage.style.transform=`translate(${(innerWidth-W*s)/2}px,${(innerHeight-H*s)/2}px) scale(${s})`}
addEventListener('resize',fit);fit();

/* seeded random so the opening composition is always the same */
let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const R=(a,b)=>a+rnd()*(b-a);
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

const DRIFT=13;                 // slow table drift, stage px per second (right to left)
const SC=1.36;                  // card scale on the stage
const GAP=545,MIDY=750;         // one loose row
const cards=DATA.map((dd,i)=>{
  const d=document.createElement('div');d.className='card';d.innerHTML=cardHTML(dd);
  stage.appendChild(d);
  const c={col:AP[dd.a][1],el:d,x:80+i*GAP+R(-40,40),y:MIDY+R(-110,110),r:R(-5,5),s:SC,mv:null,ph:R(0,6.3),per:R(11,16)};
  d.style.zIndex=i+1;return c;                     // stacking never changes on screen
});
let z=cards.length;
let T=0;
function place(c){const f=Math.sin(T/c.per*6.283+c.ph);c.el.style.transform=`translate(${c.x}px,${c.y+f*12}px) rotate(${c.r+f*.7}deg) scale(${c.s})`}
cards.forEach(place);

/* a "nudge": a card is gently pushed a little, turned slightly and settles again */
function nudge(c,now){
  let dy=R(-70,70);if(c.y+dy<MIDY-150||c.y+dy>MIDY+150)dy=-dy;
  let dr=R(-3.5,3.5);if(Math.abs(c.r+dr)>6)dr=-dr;
  let dx=R(-90,40);const MIN=GAP-25;               // never crowd the neighbours
  const L=cards.filter(o=>o.x<c.x).sort((a,b)=>b.x-a.x)[0],Rn=cards.filter(o=>o.x>c.x).sort((a,b)=>a.x-b.x)[0];
  if(L&&c.x+dx<L.x+MIN)dx=Math.min(0,L.x+MIN-c.x);
  if(Rn&&c.x+dx>Rn.x-MIN)dx=Math.max(0,Rn.x-MIN-c.x);
  c.mv={t0:now,dur:R(5500,7500),y0:c.y,r0:c.r,dx,dy,dr};
  c.el.classList.add('lift');
}
/* a "finger swap": a fingertip presses a card, drags it over its neighbour, and the neighbour slides into the gap */
const finger=document.createElement('div');finger.className='finger';stage.appendChild(finger);
let swap=null;
function startSwap(now){
  const vis=cards.filter(c=>!c.mv&&c.x>320&&c.x<W-320).sort((a,b)=>a.x-b.x);
  if(!vis.length)return false;
  const A=vis[Math.floor(rnd()*vis.length)];
  const right=rnd()<.5;
  const B=cards.filter(o=>right?o.x>A.x:o.x<A.x).sort((a,b)=>right?a.x-b.x:b.x-a.x)[0];
  if(!B||B.mv||B.x<120||B.x>W-120)return false;
  const ord=[...cards].sort((a,b)=>a.x-b.x),n=ord.length,ia=ord.indexOf(A),ib=ord.indexOf(B);
  const lo=Math.min(ia,ib),hi=Math.max(ia,ib),Lc=ord[(lo-1+n)%n],Rc=ord[(hi+1)%n];
  if(Lc.col===ord[hi].col||Rc.col===ord[lo].col)return false;   // never put two same-colour cards side by side
  A.el.style.zIndex=++z;                          // cards sit apart at rest, so this is not visible
  const dxA=B.x-A.x,dxB=A.x-B.x;
  A.mv={t0:now+650,dur:2300,y0:A.y,r0:A.r,dx:dxA,dy:0,dr:right?3:-3,arc:-55,lift:.045};
  B.mv={t0:now+1150,dur:2000,y0:B.y,r0:B.r,dx:dxB,dy:0,dr:right?-2:2,arc:22,lift:.01};
  A.el.classList.add('lift');
  swap={A,t0:now,ox:R(-30,40),oy:R(-40,60)};
  return true;
}
function drawFinger(now){
  if(!swap){finger.style.opacity=0;return}
  const k=now-swap.t0,A=swap.A;
  let o=1,s=1;
  if(k<450){o=k/450;s=1.35-.35*o}                  // fingertip arrives
  else if(k<650){s=1-.15*((k-450)/200)}            // presses down
  else if(k<2950){s=.85}                           // drags
  else if(k<3200){s=.85+.15*((k-2950)/250)}        // lifts off
  else if(k<3700){o=1-(k-3200)/500;s=1+.25*(1-o)}  // fades away
  else{swap=null;finger.style.opacity=0;return}
  finger.style.opacity=o;
  finger.style.transform=`translate(${A.x+swap.ox}px,${A.y+swap.oy}px) scale(${s})`;
}
let last=performance.now(),nextNudge=last+900,nextSwap=last+3000;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tick(now){
  const dt=Math.min(64,now-last)/1000;last=now;
  if(!document.hidden){
    T+=dt;
    for(const c of cards){
      c.x-=DRIFT*dt;
      if(c.mv){
        const m=c.mv,p=Math.max(0,Math.min(1,(now-m.t0)/m.dur)),e=ease(p);
        const shift=m.dx*e;c.x+=shift-(m.lastShift||0);m.lastShift=shift;
        c.y=m.y0+m.dy*e+(m.arc||0)*Math.sin(Math.PI*p);c.r=m.r0+m.dr*e;
        c.s=SC*(1+(m.lift||.015)*Math.sin(Math.PI*p));
        if(p>=1){c.mv=null;c.s=SC;c.el.classList.remove('lift')}
      }
    }
    for(const c of cards){
      if(c.x<-360){                                   // fully off the left: rejoin the row at the far right, out of view
        const right=Math.max(...cards.map(o=>o.x));
        c.x=right+GAP+R(-30,30);c.y=MIDY+R(-110,110);c.r=R(-5,5);c.mv=null;c.s=SC;c.el.classList.remove('lift');
        c.el.style.zIndex=++z;                        // it is off screen, so the new stacking is never seen
      }
      place(c);
    }
    if(!swap&&now>nextSwap){nextSwap=now+(startSwap(now)?R(9000,13000):1500)}
    drawFinger(now);
    if(now>nextNudge){
      const vis=cards.filter(c=>!c.mv&&c.x>200&&c.x<W-200);
      if(vis.length)nudge(vis[Math.floor(rnd()*vis.length)],now);
      nextNudge=now+R(3000,5000);
    }
  }
  requestAnimationFrame(tick);
}
if(!reduce)requestAnimationFrame(tick);
</script>
