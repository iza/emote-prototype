<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Financial Products</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#065d44;--ink:#031711;--muted:#6b7772;--page:#faf9f6;--bg:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--page);font-family:Inter,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;gap:12px}
.phone{position:relative;width:390px;height:min(844px,100dvh);overflow:hidden;border-radius:28px;box-shadow:0 20px 60px rgba(23,23,23,.12),0 0 0 1px rgba(23,23,23,.06);background:var(--bg);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.phone *{-webkit-tap-highlight-color:transparent}
.restart{font-size:12px;line-height:20px;color:#525252;text-decoration:underline;text-underline-offset:3px;background:none;border:0;cursor:pointer;font-family:inherit}
@media (max-width:430px),(max-height:700px){body{gap:0}.phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}.restart{display:none}}
html.embed,html.embed body{background:transparent}
html.embed body{min-height:0;height:844px;gap:0;justify-content:flex-start}
html.embed .phone{height:800px;margin:4px 0 40px;border-radius:32px;box-shadow:0 0 0 1px rgba(23,23,23,.07),0 8px 22px rgba(23,23,23,.09)}
html.embed .restart{display:none}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus,button:focus-visible{outline:none}

.screen{position:absolute;inset:76px 0 78px 0;background:var(--bg);display:flex;flex-direction:column;transition:transform .45s cubic-bezier(.3,.7,.2,1),opacity .3s;z-index:1}
.screen.off-right{transform:translateX(100%)}
.screen.off-left{transform:translateX(-28%);opacity:.6}
.screen.hidden{visibility:hidden}
.top{position:absolute;left:0;right:0;top:0;z-index:6;height:76px;padding:28px 16px 0;display:flex;align-items:center;justify-content:space-between;background:var(--bg)}
.top .back{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:#5c3a46;width:72px}
.top .back svg{width:8px;height:14px}
.top h1{font-size:15px;line-height:20px;font-weight:600;color:#5c3a46;letter-spacing:-.2px}
.top .me{width:72px;display:flex;justify-content:flex-end}
.top .me img{width:32px;height:32px;border-radius:50%;object-fit:cover;display:block}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
.scroll::-webkit-scrollbar,.row::-webkit-scrollbar{display:none}
.eb{font-size:11px;line-height:14px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* home */
.gh{padding:40px 24px 0}
.gh h2{margin-top:6px;font-size:24px;line-height:30px;font-weight:700;letter-spacing:-.6px}
.gh p.s{margin-top:8px;font-size:14px;line-height:21px;color:#4a5450}
.cat{padding-top:22px}
.cat:last-child{padding-bottom:36px}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:0 24px}
.ch h3{font-size:18px;line-height:24px;font-weight:600;color:#3d4a47;letter-spacing:-.3px}
.ch span{flex-shrink:0;font-size:12px;font-weight:500;color:var(--muted)}
.row{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 24px;padding:14px 24px 16px;scrollbar-width:none;overscroll-behavior-x:contain}
.row::after{content:"";flex:0 0 12px}
.card{flex:0 0 256px;height:290px;scroll-snap-align:start;background:#fff;border-radius:32px;box-shadow:0 0 0 1px rgba(3,23,17,.08),0 4px 14px rgba(3,23,17,.05);padding:8px;display:flex;flex-direction:column;text-align:left;transition:transform .2s}
.card:active{transform:scale(.97)}
.hd{height:52px;border-radius:48px;display:flex;align-items:center;gap:8px;padding:0 12px 0 6px;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)}
.hd img{width:40px;height:40px;flex-shrink:0}
.hd b{font-size:14px;line-height:17px;font-weight:500;letter-spacing:-.1px}
.card .ill{width:240px;height:126px;margin-top:8px;object-fit:cover;display:block;flex-shrink:0}
.meta{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.meta .gr{font-size:14px;line-height:18px;color:#000;padding:0 6px}
.tag{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 2px 0 10px;border-radius:10px;font-size:12px;color:var(--ink)}
.tag i{width:16px;height:16px;border-radius:50%;color:#fff;font-style:normal;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.t-low{background:#d2e9cc}.t-low i{background:#065d44}
.t-mod{background:#ffe6c1}.t-mod i{background:#ff8e26}
.t-pink{background:#ffe0e0}.t-pink i{background:#e6649b}
.t-high{background:#febec6}.t-high i{background:#c61919}

/* detail */
.dwrap{flex:1;position:relative;overflow:hidden;touch-action:pan-y}
.dp{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;will-change:transform;transition:transform .7s cubic-bezier(.25,.8,.25,1),opacity .7s ease}
.dp::-webkit-scrollbar{display:none}
.dp.r{transform:translateX(100%);opacity:.4;pointer-events:none}
.dp.l{transform:translateX(-100%);opacity:.4;pointer-events:none}
.hero{margin:8px 16px 0;background:#fff;border-radius:32px 32px 0 0;padding:8px 8px 14px;box-shadow:inset 0 1px 0 rgba(3,23,17,.08),inset 1px 0 0 rgba(3,23,17,.08),inset -1px 0 0 rgba(3,23,17,.08)}
.hero .hd{height:48px}
.hero .ill{width:342px;height:180px;object-fit:cover;display:block;margin-top:8px}
.hero .meta{margin-top:6px}
.panel{margin:0 16px;border-radius:0 0 24px 24px;padding:20px 20px 104px;min-height:420px}
.prow{display:flex;justify-content:space-between;align-items:center}
.prow .eb{color:var(--ink);opacity:.6}
.sh{width:40px;height:40px;border-radius:50%;border:1px solid rgba(3,23,17,.35);display:flex;align-items:center;justify-content:center}
.sh svg{width:15px;height:17px}
.lead{margin-top:16px;font-size:16px;line-height:22px;font-weight:600;letter-spacing:-.2px}
.intro{margin-top:12px;font-size:14px;line-height:21px;color:#1e2b27}
.sec{margin-top:20px}
.sec h4{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);opacity:.55}
.sec p{margin-top:5px;font-size:14px;line-height:21px;color:#1e2b27}
.sec ul{list-style:none;margin-top:8px;display:flex;flex-direction:column;gap:6px}
.sec li{background:rgba(255,255,255,.62);border-radius:14px;padding:10px 12px;font-size:13px;line-height:18px;color:#3a4844}
.sec li b{display:block;font-weight:600;color:var(--ink);font-size:13.5px;margin-bottom:2px}
.cta{margin-top:28px;display:flex;flex-direction:column;gap:8px}
.cta button{height:48px;border-radius:24px;font-size:14px;font-weight:600}
.cta .p{background:var(--ink);color:#fff}
.cta .n{color:var(--ink)}
.foot{position:absolute;left:16px;right:16px;bottom:0;height:84px;padding:14px 20px 0;display:flex;justify-content:space-between;align-items:center;z-index:3;border-radius:0 0 0 0;pointer-events:none}
.foot>*{pointer-events:auto}
.pill{height:32px;padding:0 14px;border-radius:16px;background:rgba(255,255,255,.8);display:flex;align-items:center;gap:6px}
.pill i{width:5px;height:5px;border-radius:4px;opacity:.35;transition:all .35s}
.pill i.on{width:22px;opacity:1}
.nx{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;transition:transform .15s;box-shadow:0 4px 12px rgba(3,23,17,.16)}
.nx:active{transform:scale(.92)}

/* nav */
.nav{position:absolute;left:0;right:0;bottom:0;height:78px;background:#fff;border-top:1px solid #f0f1f0;display:flex;justify-content:space-around;align-items:flex-start;padding-top:12px;z-index:5}
.nav .it{width:60px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:500;color:var(--muted)}
.nav .it.on{color:var(--g);font-weight:600}
.nav .it svg{width:24px;height:24px}
.nav .chat{margin-top:-34px;width:64px;height:64px}
.nav .chat svg{width:64px;height:64px;filter:drop-shadow(0 4px 10px rgba(6,93,68,.25))}
.nav .it.on.learn svg path{fill:#065d44;stroke:#065d44}

.tap{position:absolute;z-index:20;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(3,23,17,.18);border:2px solid rgba(255,255,255,.75);pointer-events:none;opacity:0}
.tap.go{animation:tap .6s ease-out both}
@keyframes tap{0%{opacity:0;transform:scale(1.3)}25%{opacity:1;transform:scale(.85)}60%{opacity:1;transform:scale(.9)}100%{opacity:0;transform:scale(1.15)}}
.toast{position:absolute;left:50%;top:88px;transform:translate(-50%,-10px);background:var(--ink);color:#fff;font-size:13px;font-weight:500;padding:9px 14px;border-radius:18px;opacity:0;transition:all .35s;z-index:12;white-space:nowrap;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>

 </div>

<div class="tap" id="tap"></div>`;

let cur=null,page=0;

 cur=ci;page=pi;const C=CATS[ci],n=C.items.length;
 $('#dwrap').innerHTML=C.items.map((p,j)=>`<article class="dp ${j<pi?'l':j>pi?'r':''}">

 if(moved){moved=false;return}
 const t=e.target;

 if(t.closest('#back')){if(cur!==null)closeCat();return}

});

phone.addEventListener('pointerup',e=>{if(sx===null)return;const dx=e.clientX-sx,dy=e.clientY-sy;sx=null;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.4){moved=true;go(dx<0?1:-1)}});

}

  await browse(0,0,[2,'next',1,'next',1,'next']);
  await toCat(2);await rowTo(2,1);
  await browse(2,1,[2,'next',1,'back']);
  await toCat(3);await rowTo(3,1);
  await browse(3,1,[1,'next',1,'back']);

 }catch(e){}
}
function userAct(e){if(!e.isTrusted)return;if(demoOn){demoOn=false;RUN++;}clearTimeout(idleT);idleT=setTimeout(demo,14000)}
['pointerdown','wheel','touchstart'].forEach(ev=>phone.addEventListener(ev,userAct,{passive:true}));
$('#restart').onclick=()=>{clearTimeout(idleT);demo()};
let started=false;
new IntersectionObserver(es=>{if(es.some(x=>x.isIntersecting)&&!started){started=true;demo()}},{threshold:.35}).observe(phone);
reset();
