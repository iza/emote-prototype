<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck product pages</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;background:#eceef4;overflow:hidden;user-select:none}
html.embed body{background:transparent}
#wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1100px;height:690px;flex:none;transform-origin:center}
.win{position:absolute;inset:0;display:flex;flex-direction:column;border-radius:14px;background:#fff;box-shadow:0 0 0 1px rgba(20,22,48,.07),0 18px 40px -22px rgba(20,22,48,.22);overflow:hidden}
html.embed .win{box-shadow:none;border-radius:var(--er,16px)}
.bar{flex:none;height:46px;display:flex;align-items:flex-end;gap:14px;padding:0 18px;position:relative}
.dots{display:flex;gap:8px;align-self:center}.dots i{width:12px;height:12px;border-radius:50%;background:#e3e5eb}
.tabs{display:flex;gap:4px;margin-left:10px}
.tab{height:34px;width:190px;border-radius:10px 10px 0 0;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:12.5px;color:#6a6d84;cursor:pointer;transition:background .3s,color .3s;letter-spacing:-.006em;position:relative}
.tab svg{width:14px;height:14px;flex:none}
.tab.on{background:#f3f4f7;color:#161823}
.tab:not(.on):hover{background:#f8f9fb}
.tab .x{margin-left:auto;width:9px;height:9px;opacity:.4}
.ub{flex:none;height:42px;background:#f3f4f7;display:flex;align-items:center;justify-content:center;margin:0 10px;border-radius:0 10px 0 0}
.url{width:440px;height:28px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;color:#4a4d66;letter-spacing:-.006em}
.url svg{width:10px;height:12px}
.view{position:relative;flex:1;margin:0 10px 10px;border-radius:0 0 9px 9px;background:#f8f8f8;overflow:hidden}
.pg{position:absolute;left:0;top:0;width:100%;opacity:0;transition:opacity .6s cubic-bezier(.22,1,.36,1);will-change:transform}
.pg.on{opacity:1}
.pg img{display:block;width:100%;height:auto}
.hint{position:absolute;right:14px;bottom:14px;height:28px;padding:0 11px;border-radius:8px;background:rgba(18,19,49,.78);color:#fff;font-size:12px;display:flex;align-items:center;opacity:0;transition:opacity .4s;pointer-events:none}
.view:hover .hint{opacity:1}
.view.manual .hint{opacity:0}
</style></head>
<body>
<div id="wrap"><div id="stage"><div class="win">
 <div class="bar"><div class="dots"><i></i><i></i><i></i></div>
  <div class="tabs" id="tabs">
   <div class="tab on" data-k="0"><svg viewBox="0 0 20 20"><path d="M2.5 8.3L12 2L12 18L2.5 11.7A2 2 0 0 1 2.5 8.3Z" fill="#ca1ced" style="mix-blend-mode:multiply"/><path d="M10.1 8.4L20 1L20 19L10.1 11.6A2 2 0 0 1 10.1 8.4Z" fill="#29b9d6" style="mix-blend-mode:multiply"/></svg>Rewind · Deck<svg class="x" viewBox="0 0 9 9" fill="none" stroke="#161823" stroke-width="1.3" stroke-linecap="round"><path d="m1.5 1.5 6 6m0-6-6 6"/></svg></div>
   <div class="tab" data-k="1"><svg viewBox="0 0 20 20"><circle cx="14" cy="10" r="6" fill="#f5bc20"/><path d="M9.5 8.3L0 2L0 18L9.5 11.7A2 2 0 0 0 9.5 8.3Z" fill="#ca1ced" style="mix-blend-mode:multiply"/></svg>Stream · Deck<svg class="x" viewBox="0 0 9 9" fill="none" stroke="#161823" stroke-width="1.3" stroke-linecap="round"><path d="m1.5 1.5 6 6m0-6-6 6"/></svg></div>
   <div class="tab" data-k="2"><svg viewBox="0 0 20 20"><rect x="1" y="1" width="4" height="8" rx="1" fill="#0000db"/><rect x="7" y="1" width="12" height="8" rx="1" fill="#29b9d6"/><rect x="1" y="11" width="12" height="8" rx="1" fill="#29b9d6"/><rect x="15" y="11" width="4" height="8" rx="1" fill="#0000db"/></svg>Studio · Deck<svg class="x" viewBox="0 0 9 9" fill="none" stroke="#161823" stroke-width="1.3" stroke-linecap="round"><path d="m1.5 1.5 6 6m0-6-6 6"/></svg></div>
  </div></div>
 <div class="ub"><div class="url"><svg viewBox="0 0 11 13" fill="none"><rect x="1" y="5.5" width="9" height="6.8" rx="1.6" fill="#4a4d66"/><path d="M3 5.6V4a2.5 2.5 0 0 1 5 0v1.6" stroke="#4a4d66" stroke-width="1.4"/></svg><span id="u">datadeck.co/products/rewind</span></div></div>
 <div class="view" id="view">
  <div class="pg on" data-k="0"><img fetchpriority="high" src="p-rewind.webp" alt="Deck Rewind product page"></div>
  <div class="pg" data-k="1"><img fetchpriority="low" decoding="async" src="p-stream.webp" alt="Deck Stream product page"></div>
  <div class="pg" data-k="2"><img fetchpriority="low" decoding="async" src="p-studio.webp" alt="Deck Studio product page"></div>
  <div class="hint">Scroll to explore, or switch tabs</div>
 </div>
</div></div></div>
<script>
const $=s=>document.querySelector(s),view=$('#view'),pgs=[...document.querySelectorAll('.pg')],tabs=[...document.querySelectorAll('.tab')];
const NAMES=['rewind','stream','studio'];const W=1100,H=690;let cur=0,y=[0,0,0],run=0,manual=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function maxY(k){return Math.max(0,pgs[k].offsetHeight-view.clientHeight)}
function setY(k,v){y[k]=Math.max(0,Math.min(maxY(k),v));pgs[k].style.transform=`translateY(${-y[k]}px)`}
function show(k){cur=k;pgs.forEach((p,i)=>p.classList.toggle('on',i===k));tabs.forEach((t,i)=>t.classList.toggle('on',i===k));$('#u').textContent='datadeck.co/products/'+NAMES[k]}
function tween(k,to,ms,id){return new Promise(res=>{const from=y[k],t0=performance.now();(function f(n){if(id!==run)return res();const t=Math.min(1,(n-t0)/ms);setY(k,from+(to-from)*ease(t));t<1?requestAnimationFrame(f):res()})(performance.now())})}
async function loop(id){
 while(id===run){
  for(let k=0;k<3;k++){
   if(id!==run)return;await ready(pgs[k].querySelector('img'));if(id!==run)return;setY(k,0);show(k);await sleep(2200);
   const step=view.clientHeight*.72;
   while(y[k]<maxY(k)-2){if(id!==run)return;await tween(k,Math.min(maxY(k),y[k]+step),1700,id);await sleep(1500)}
   await sleep(1200);
  }
 }
}
function takeOver(){if(manual)return;manual=true;run++;view.classList.add('manual')}
view.addEventListener('wheel',e=>{e.preventDefault();takeOver();setY(cur,y[cur]+e.deltaY)},{passive:false});
let ty=null;view.addEventListener('touchstart',e=>{takeOver();ty=e.touches[0].clientY},{passive:true});
view.addEventListener('touchmove',e=>{if(ty==null)return;const d=ty-e.touches[0].clientY;ty=e.touches[0].clientY;setY(cur,y[cur]+d*1.4)},{passive:true});
tabs.forEach((t,i)=>t.addEventListener('click',()=>{takeOver();show(i)}));
function fit(){const e=document.documentElement.classList.contains('embed'),m=e?0:40;const s=Math.min((innerWidth-m)/W,(innerHeight-m)/H,1.2);$('#stage').style.transform=`scale(${s})`;$('#stage').style.setProperty('--er',(16/s)+'px')}
if(window.self!==window.top||/embed/.test(location.search))document.documentElement.classList.add('embed');
addEventListener('resize',fit);fit();
let started=false;
const io=new IntersectionObserver(es=>es.forEach(e=>{if(manual)return;if(e.isIntersecting){if(!started){started=true;loop(++run)}}else{started=false;run++}}),{threshold:.2});
const ready=i=>i.complete&&i.naturalWidth?Promise.resolve():new Promise(r=>{i.addEventListener('load',r,{once:true});i.addEventListener('error',r,{once:true})});
ready(document.images[0]).then(()=>io.observe($('#stage')));
</script>
</body></html>
