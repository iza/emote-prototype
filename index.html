<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>emoteCare Matching Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --page:#faf9f6;
  --n0:#ffffff; --n50:#fbf9f8; --n200:#e5e5e5; --n300:#d4d4d4; --n500:#737373; --n600:#525252; --n700:#404040; --n800:#262626; --n900:#171717;
  --o10:rgba(38,38,38,.1); --o20:rgba(38,38,38,.2); --o50:rgba(38,38,38,.5);
  --p200:#e9f2c8; --p400:#cadd85; --p500:#bfd961; --p900:#657625;
  --c100:#eaf7fa; --c200:#d5eff5; --c400:#a9dfea; --c600:#6dc4d6; --c700:#52a9c1; --c800:#3f8ca4; --c900:#316d82; --c950:#265868;
  --y500:#ffba3d; --peach100:#ffe8d9; --peach950:#5f3019; --blue700:#3b5fbb;
  --shadow-md:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -1px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--page);font-family:Poppins,system-ui,sans-serif;color:var(--n800);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;gap:12px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--n800);outline-offset:2px}

.phone{position:relative;width:390px;height:min(812px,100dvh);overflow:hidden;border-radius:28px;box-shadow:0 20px 60px rgba(23,23,23,.12),0 0 0 1px rgba(23,23,23,.06);background:#fff}
.restart{font-size:12px;line-height:20px;color:var(--n600);text-decoration:underline;text-underline-offset:3px}
@media (max-width:430px),(max-height:700px){
  body{gap:0}
  .phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}
  .restart{display:none}
}

/* embedded in the portfolio: no page colour, no frame, exact phone height */
html.embed,html.embed body{background:transparent}
html.embed body{min-height:0;height:812px;gap:0}
html.embed .phone{height:812px;box-shadow:none}
html.embed .restart{display:none}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.screen.enter{animation:fade .2s ease-out both}
.screen.leaving{pointer-events:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
.blob{position:absolute;left:0;pointer-events:none;z-index:0}
.blob svg{display:block}
.z{position:relative;z-index:1}

/* TOP NAV */
.nav{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 16px 12px;width:100%;flex-shrink:0}
.nav-row{display:flex;align-items:center;justify-content:space-between;width:100%}
.nav-row.pr8{padding-right:8px}
.icon-btn{width:32px;height:32px;border-radius:96px;display:flex;align-items:center;justify-content:center}
.icon-btn svg{width:20px;height:20px}
.icon-btn[disabled]{opacity:.3;cursor:default}
.exit{height:30px;padding:0 12px;border:1px solid var(--o20);border-radius:9999px;font-size:14px;line-height:24px;color:var(--n800);white-space:nowrap}
.exit.muted{color:var(--n500)}
.progress{display:flex;flex-direction:column;align-items:center;gap:4px;padding:0 8px;width:100%}
.progress-label{font-size:14px;line-height:24px;text-align:center}
.bars{display:flex;gap:4px;width:100%}
.bar{flex:1;height:4px;border-radius:2px;background:var(--o10);overflow:hidden}
.bar i{display:block;height:100%;background:var(--n800);border-radius:2px;transition:width .35s ease}

/* BUTTONS */
.actions{display:flex;flex-direction:column;gap:8px;padding:0 24px 40px;width:100%;flex-shrink:0}
.btn{height:40px;min-width:120px;width:100%;border-radius:9999px;padding:8px 16px;font-size:14px;line-height:24px;text-align:center}
.btn-primary{background:var(--n800);color:#fff}
.btn-secondary{height:38px;border:1px solid var(--o20);color:var(--n800)}

/* TEXT SCREENS (2.x) */
.t-body{flex:1;display:flex;flex-direction:column;gap:12px;padding:16px 24px 0;min-height:0}
.h5{font-size:20px;line-height:32px;font-weight:500;letter-spacing:-.2px;color:var(--n800)}
.h6{font-size:18px;line-height:28px;font-weight:500;letter-spacing:-.18px;color:var(--n900)}
.field{flex:1;min-height:0;display:flex}
.field textarea{flex:1;width:100%;resize:none;border:0;background:transparent;font:inherit;font-size:16px;line-height:28px;color:var(--n800);caret-color:var(--c700);outline:none}
.field textarea::placeholder{color:var(--p900);opacity:1}
.counter{padding:0 24px 12px;font-size:12px;line-height:20px;color:var(--n800)}
.counter span{color:var(--o50)}

/* INTRO (3.1 / 4.1) */
.intro{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:0 24px;text-align:center}
.intro.g16{gap:16px}
.h4{font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.24px;color:var(--n900)}
.body16{font-size:16px;line-height:28px;color:var(--n800)}

/* THERAPY CARDS (3.x) */
.tc-wrap{flex:1;display:flex;flex-direction:column;gap:16px;padding:0 20px;min-height:0;overflow-y:auto}
.tcard{position:relative;height:320px;flex-shrink:0;border-radius:12px;padding:16px 16px 12px;display:flex;flex-direction:column;touch-action:pan-y;user-select:none;transition:transform .3s ease,opacity .3s ease}
.tcard .ill{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.tcard .ill svg{max-height:150px;width:auto}
.tcard .tt{font-size:20px;line-height:32px;font-weight:500;letter-spacing:-.2px}
.tcard .tg{font-size:14px;line-height:24px}
.dots{display:flex;gap:4px;justify-content:center;align-items:center;height:12px;margin-top:4px}
.dots b{width:16px;height:4px;border-radius:2px;opacity:.8}
.dots i{width:4px;height:4px;border-radius:2px;opacity:.8}
.goal{font-size:14px;line-height:24px;color:var(--n800)}
.lede{margin-top:-12px}
.badges{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.badge{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 8px;border-radius:8px;font-size:14px;line-height:24px;white-space:nowrap}
.badge svg{width:16px;height:16px;flex-shrink:0}
.swipe{display:flex;justify-content:center;gap:16px;padding:12px 0 24px;flex-shrink:0}
.swipe button{width:56px;height:56px;border-radius:50%;border:1px solid var(--n500);display:flex;align-items:center;justify-content:center;transition:transform .15s ease,background .15s ease}
.swipe button:active{transform:scale(.94)}
.swipe button.on{background:var(--n800)}
.swipe button.on svg path{stroke:#fff}
.swipe svg{width:24px;height:24px}

/* CHIP SCREENS (4.x) */
.c-body{flex:1;display:flex;flex-direction:column;gap:12px;padding:24px 24px 0;min-height:0;overflow-y:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:30px;padding:0 12px;border:1px solid var(--c800);border-radius:9999px;font-size:14px;line-height:24px;color:var(--n800);white-space:nowrap;transition:background .15s ease,color .15s ease}
.chip[aria-pressed="true"]{background:var(--c800);color:#fff}

/* PRACTICAL (4.7) */
.p-body{flex:1;display:flex;flex-direction:column;gap:48px;padding:24px 24px 0;min-height:0;overflow-y:auto}
.p-q{display:flex;flex-direction:column;gap:12px}

/* SUMMARY */
.sum{background:var(--n50)}
.sum-scroll{flex:1;overflow-y:auto;padding:0 8px 24px;display:flex;flex-direction:column;gap:8px;min-height:0}
.sum-title{text-align:center;padding:36px 32px 12px}
.acc{background:var(--p400);border-radius:12px}
.acc-head{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px 12px 16px;text-align:left;font-size:16px;line-height:28px;font-weight:500;color:var(--n800)}
.acc-head svg{width:20px;height:20px;flex-shrink:0;transition:transform .2s ease}
.acc.open .acc-head svg{transform:rotate(180deg)}
.acc-body{display:none;padding:0 16px 14px;font-size:14px;line-height:24px;color:var(--n800)}
.acc.open .acc-body{display:block}
.acc-body .muted{color:var(--n600)}
.acc-edit{font-size:14px;line-height:24px;color:var(--blue700);text-decoration:underline;text-underline-offset:2px;margin-left:4px}
.row-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.edit{width:24px;height:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.edit svg{width:16px;height:16px}
.tbox{background:var(--c400);border-radius:12px;padding:16px;display:flex;flex-direction:column}
.tbox h3{font-size:16px;line-height:28px;font-weight:500;padding-bottom:12px}
.trow{border-top:1px solid var(--c700);padding:10px 0 12px;display:flex;flex-direction:column;gap:6px}
.tbox.plain .trow:first-child{border-top:0;padding-top:0}
.trow .lbl{font-size:14px;line-height:24px;font-weight:500}
.tb{display:inline-flex;align-items:center;height:28px;padding:0 8px;border-radius:8px;background:var(--c100);color:var(--c950);font-size:14px;line-height:24px;white-space:nowrap}
.tbs{display:flex;flex-wrap:wrap;gap:8px}
.foot{font-size:12px;line-height:20px;color:var(--n600);padding:8px 16px 0}
.sum-cta{padding:12px 24px 40px;border-top:1px solid var(--n300);background:var(--n50);flex-shrink:0}

/* RESULTS */
.res-wrap{background:var(--n50)}
.res{position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
.res::-webkit-scrollbar{display:none}
.page{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;padding:20px 15px}
.pcard{width:100%;max-width:360px;max-height:100%;background:#fff;border-radius:16px;box-shadow:var(--shadow-md);display:flex;flex-direction:column;overflow:hidden}
.pc-top{position:relative;display:flex;flex-direction:column;flex:0 1 auto;min-height:0}
.photo{position:relative;aspect-ratio:1;flex:0 1 auto;min-height:150px;border-radius:12px 12px 0 0;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 28%;display:block}
.play{position:absolute;left:calc(50% + 6px);top:calc(50% - 16px);transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:rgba(38,38,38,.3);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center}
.play svg{width:20px;height:24px;margin-left:4px}
.tagwrap{position:relative;margin-top:-31px;padding:0 12px;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.tagline{border-radius:12px;padding:8px 12px;font-size:14px;line-height:24px;font-weight:500;color:var(--n800)}
.pc-pills{display:flex;flex-wrap:wrap;gap:6px}
.apill{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:8px;font-size:12px;line-height:20px;color:var(--n800)}
.apill svg{width:16px;height:16px}
.ibadge{display:inline-flex;align-items:center;height:28px;padding:0 8px;border-radius:8px;background:#f6f5f4;font-size:12px;line-height:20px;color:var(--n900)}
.pc-body{padding:16px 24px 0;display:flex;flex-direction:column;flex-shrink:0}
.name{display:flex;align-items:center;gap:8px;font-size:18px;line-height:28px;font-weight:500;letter-spacing:-.18px}
.name .ic{display:flex;gap:4px}
.name .ic button{display:flex}
.name svg{width:20px;height:20px}
.reg{display:flex;align-items:center;gap:4px;font-size:12px;line-height:20px;font-weight:500;color:var(--blue700)}
.reg svg{width:16px;height:16px}
.meta{font-size:12px;line-height:20px;color:var(--n700);margin-top:4px}
.meta .two{display:flex;gap:12px}
.meta u{text-underline-offset:2px}
.lnk{height:32px;display:inline-flex;align-items:center;font-size:12px;line-height:16px;color:var(--blue700);text-decoration:underline;text-underline-offset:2px;align-self:flex-start}
.sales{display:flex;align-items:flex-end;gap:8px;padding:8px 24px 24px;flex-shrink:0}
.sales .amt{display:flex;align-items:center;gap:4px}
.sales .amt b{font-size:18px;line-height:28px;font-weight:500;letter-spacing:-.18px}
.sales .amt span{font-size:12px;line-height:20px;color:var(--n600)}
.book{height:40px;padding:0 16px;min-width:112px;border-radius:9999px;background:var(--n800);color:#fff;font-size:14px;line-height:24px;flex-shrink:0}
.vdots{position:absolute;left:5px;top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:4px;align-items:center;width:6px;pointer-events:none}
.vdots i{width:4px;height:4px;border-radius:2px;background:var(--n800);opacity:.25;transition:height .25s ease,opacity .25s ease}
.vdots i.on{height:12px;opacity:1}
.page.cta{padding:0}
.cta-card{width:100%;height:100%;background:#fdca6d;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.cta-card .ct{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:0 40px;text-align:center}
.cta-card .ct .btn{width:auto;min-width:0;padding:8px 16px;margin-top:12px}
.cta-card img{width:100%;display:block}
.guide{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px;padding:52px 51px;background:rgba(38,38,38,.5);cursor:pointer;animation:fade .25s ease both}
.guide.out{animation:fadeout .2s ease both}
@keyframes fadeout{to{opacity:0}}
.guide .hand{padding:5px 9px}
.guide .hand svg{width:54px;height:63px;display:block;animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.guide .pillmsg{width:100%;background:#fff;border-radius:9999px;padding:12px 40px 16px;display:flex;flex-direction:column;align-items:center}
.guide .pillmsg .chev{width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.guide .pillmsg .chev svg{width:16px;height:16px}
.guide .pillmsg p{font-size:14px;line-height:24px;font-weight:500;color:var(--n800);white-space:nowrap}

.toast{position:absolute;left:16px;right:16px;bottom:24px;z-index:50;background:var(--n900);color:#fff;font-size:14px;line-height:22px;padding:12px 16px;border-radius:12px;opacity:0;transform:translateY(8px);transition:opacity .2s ease,transform .2s ease;pointer-events:none}
.toast.show{opacity:1;transform:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

function secProgress(sec){
  const idxs=STEPS.map((s,i)=>s.sec===sec?i:-1).filter(i=>i>=0);
  return idxs.map(i=>i);
}
function navHTML({progress=true,simple=false,pr8=false}={}){
  const step=STEPS[S.step];
  let prog='';
  if(progress){
    const bars=[0,1,2].map(sec=>{
      const idxs=secProgress(sec);
      let w=0;
      if(step.sec>sec) w=100;
      else if(step.sec===sec){const pos=idxs.indexOf(S.step);w=Math.round((pos+1)/(idxs.length+1)*100)}
      return `<div class="bar"><i style="width:${w}%"></i></div>`;
    }).join('');
    prog=`<div class="progress"><div class="progress-label">${SECTIONS[step.sec]}</div><div class="bars" aria-label="Section ${step.sec+1} of 3">${bars}</div></div>`;
  }
  return `<div class="nav z"><div class="nav-row${pr8?' pr8':''}">
    <button class="icon-btn" data-act="back" aria-label="Back" ${S.step===0?'disabled':''}>${icon('arrowLeft')}</button>

}

  if(theme==='teal42') return `<div class="blob" style="bottom:0">${B.teal42.svg}</div>`;
  if(theme==='teal47') return `<div class="blob" style="bottom:-1px">${B.teal47.svg}</div>`;
  return '';
}

/* ---------- navigation ---------- */
function go(i){S.step=Math.max(0,Math.min(STEPS.length-1,i));render(true)}
function next(){ if(S.editing){S.editing=false;go(IDX_SUMMARY)} else go(S.step+1) }
const IDX_SUMMARY = STEPS.findIndex(s=>s.type==='summary');
const IDX_RESULTS = STEPS.findIndex(s=>s.type==='results');
function back(){ if(S.editing){S.editing=false;go(IDX_SUMMARY)} else if(S.step>0) go(S.step-1) }

/* ---------- screens ---------- */
function screenText(st){
  const v=S.text[st.key]||'';
  const scr=el(`<section class="screen" style="background:var(--p500)" aria-label="${esc(st.q)}">
    ${blob('green')}
    ${navHTML({pr8:true})}
    <div class="t-body z">
      <label class="h5" for="ta">${st.q}</label>
      <div class="field"><textarea id="ta" maxlength="500" placeholder="${esc(st.ph)}">${esc(v)}</textarea></div>
    </div>
    <div class="counter z"><b style="font-weight:400" id="cnt">${v.length}</b><span>/500 characters</span></div>
    <div class="actions z">
      <button class="btn btn-primary" data-act="next" id="pri"></button>
    </div></section>`);
  const ta=scr.querySelector('textarea'), pri=scr.querySelector('#pri'), cnt=scr.querySelector('#cnt');
  const sync=()=>{const has=ta.value.trim().length>0;pri.textContent=has?'Save and continue':'Continue';cnt.textContent=ta.value.length};
  ta.addEventListener('input',()=>{S.text[st.key]=ta.value;sync()});
  sync();
  return scr;
}
function screenIntro(st){
  const isAmber=st.theme==='amber';
  return el(`<section class="screen" style="background:${isAmber?'var(--y500)':'var(--c600)'}">
    ${blob(st.theme)}

}
function screenCard(st){
  const t=THERAPIES[st.therapy], liked=S.likes[st.therapy];
  const scr=el(`<section class="screen" style="background:#fff">
    ${navHTML()}
    <div class="tc-wrap">
      <div class="tcard" style="background:${t.bg};color:${t.ink}" id="card">
        <div class="ill">${SVG.ill[st.therapy]}</div>
        <div class="tt">${t.name}</div><div class="tg">${t.tag}</div>
        <div class="dots"><b style="background:${t.ink}"></b><i style="background:${t.ink}"></i></div>
      </div>
      <div class="goal">A life goal of mine</div>
      <p class="h5 lede">${t.goal}</p>
      <div class="badges">${t.badges.map((b,i)=>`<span class="badge" style="background:${t.bBg};color:${t.bInk}">${SVG.badge[st.therapy][i]}${esc(b)}</span>`).join('')}</div>
    </div>
    <div class="swipe">
      <button data-act="pass" aria-label="Not for me" class="${liked===false?'on':''}">${icon('x')}</button>
      <button data-act="like" aria-label="This resonates with me" aria-pressed="${liked===true}" class="${liked===true?'on':''}">${icon('heart')}</button>
    </div></section>`);
  const card=scr.querySelector('#card');
  const decide=(v)=>{S.likes[st.therapy]=v;card.style.transform=`translateX(${v?110:-110}%) rotate(${v?8:-8}deg)`;card.style.opacity='0';scr.querySelector(`[data-act="${v?'like':'pass'}"]`).classList.add('on');setTimeout(next,260)};
  scr.querySelector('[data-act="like"]').onclick=()=>decide(true);
  scr.querySelector('[data-act="pass"]').onclick=()=>decide(false);
  // drag to swipe
  let x0=null,dx=0;
  card.addEventListener('pointerdown',e=>{x0=e.clientX;dx=0;card.style.transition='none';card.setPointerCapture(e.pointerId)});
  card.addEventListener('pointermove',e=>{if(x0===null)return;dx=e.clientX-x0;card.style.transform=`translateX(${dx}px) rotate(${dx/25}deg)`});
  const end=()=>{if(x0===null)return;x0=null;card.style.transition='';if(Math.abs(dx)>90)decide(dx>0);else card.style.transform=''};
  card.addEventListener('pointerup',end);card.addEventListener('pointercancel',end);
  return scr;
}
function screenChips(st){
  const sel=S.chips[st.key];
  const scr=el(`<section class="screen" style="background:var(--c600)">
    ${blob('teal42')}
    ${navHTML()}
    <div class="c-body z">
      <h2 class="h6" id="qh">${st.q}</h2>
      <div class="chips" role="group" aria-labelledby="qh">${st.opts.map(o=>`<button class="chip" aria-pressed="${sel.includes(o)}">${esc(o)}</button>`).join('')}</div>
    </div>
    <div class="actions z"><button class="btn btn-primary" data-act="next" id="pri"></button></div></section>`);
  const pri=scr.querySelector('#pri');
  const sync=()=>{pri.textContent=sel.length?'Save and continue':'I don’t mind'};
  scr.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const o=b.textContent,i=sel.indexOf(o);i>=0?sel.splice(i,1):sel.push(o);b.setAttribute('aria-pressed',i<0);sync()});
  sync();
  return scr;
}
const START_OPTS=['Immediately','This week','Anytime'];
const BUDGETS=[{l:'Up to £40',lo:0,hi:40},{l:'£40–£60',lo:40,hi:60},{l:'£60–£80',lo:60,hi:80},{l:'£80+',lo:80,hi:999}];
function screenPractical(){
  const group=(id,q,opts,arr)=>`<div class="p-q"><h2 class="h6" id="${id}">${q}</h2>
    <div class="chips" role="group" aria-labelledby="${id}" data-arr="${id}">${opts.map(o=>`<button class="chip" aria-pressed="${arr.includes(o)}">${o}</button>`).join('')}</div></div>`;
  const scr=el(`<section class="screen" style="background:var(--c600)">
    ${blob('teal47')}
    ${navHTML()}
    <div class="p-body z">
      ${group('start','When would you like to start the therapy?',START_OPTS,S.start)}
      ${group('budget','How much would you like to pay per session?',BUDGETS.map(b=>b.l),S.budget)}
    </div>
    <div class="actions z"><button class="btn btn-primary" data-act="next" id="pri"></button></div></section>`);
  const pri=scr.querySelector('#pri');
  const sync=()=>{pri.textContent=(S.start.length||S.budget.length)?'Save and continue':'I don’t mind'};
  scr.querySelectorAll('[data-arr]').forEach(g=>{const arr=g.dataset.arr==='start'?S.start:S.budget;
    g.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const o=b.textContent,i=arr.indexOf(o);i>=0?arr.splice(i,1):arr.push(o);b.setAttribute('aria-pressed',i<0);sync()})});
  sync();
  return scr;
}
function screenSummary(){
  const tRows=STEPS.filter(s=>s.type==='chips').map(s=>{
    const v=S.chips[s.key];
    return `<div class="trow"><div class="row-h"><span class="lbl">${s.label}:</span><button class="edit" data-edit="${s.key}" aria-label="Edit ${s.label}">${icon('edit')}</button></div>
      <div class="tbs">${(v.length?v:['I don’t mind']).map(x=>`<span class="tb">${esc(x)}</span>`).join('')}</div></div>`;
  }).join('');
  const qs=STEPS.filter(s=>s.type==='text');
  const scr=el(`<section class="screen sum">
    <div class="nav"><div class="nav-row"><button class="icon-btn" data-act="back" aria-label="Back">${icon('arrowLeft')}</button><button class="exit muted" data-act="exit">Save and exit</button></div></div>
    <div class="sum-scroll">
      <h1 class="h5 sum-title">Here’s what you’ve shared to find your ideal therapist</h1>
      ${qs.map(s=>`<div class="acc${S.open[s.key]?' open':''}" data-k="${s.key}"><button class="acc-head" aria-expanded="${!!S.open[s.key]}">${s.q}${icon('chevronDown')}</button>
        <div class="acc-body">${S.text[s.key]?esc(S.text[s.key]):'<span class="muted">Nothing shared yet.</span>'}<button class="acc-edit" data-edit="${s.key}">Edit</button></div></div>`).join('')}
      <div class="tbox"><h3>Your ideal therapist is:</h3>${tRows}</div>
      <div class="tbox plain">
        <div class="trow"><div class="row-h"><span class="lbl">I’d like to start therapy:</span><button class="edit" data-edit="practical" aria-label="Edit start">${icon('edit')}</button></div><div class="tbs">${(S.start.length?S.start:['Anytime']).map(x=>`<span class="tb">${x}</span>`).join('')}</div></div>
        <div class="trow"><div class="row-h"><span class="lbl">I am willing to pay per session:</span><button class="edit" data-edit="practical" aria-label="Edit price">${icon('edit')}</button></div><div class="tbs">${(S.budget.length?S.budget:['I don’t mind']).map(x=>`<span class="tb">${x}</span>`).join('')}</div></div>
      </div>
      <p class="foot">* Some of this information will be used to create your profile which you can edit at a later date.</p>
    </div>
    <div class="sum-cta"><button class="btn btn-primary" data-act="next">Show me my therapists</button></div></section>`);
  scr.querySelectorAll('.acc-head').forEach(h=>h.onclick=()=>{const a=h.parentElement,k=a.dataset.k;S.open[k]=!S.open[k];a.classList.toggle('open');h.setAttribute('aria-expanded',S.open[k])});
  scr.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const k=b.dataset.edit;S.editing=true;
    if(k==='practical'){go(STEPS.findIndex(s=>s.type==='practical'));return}
    go(STEPS.findIndex(s=>s.key===k))});
  return scr;
}
function inBudget(p){return BUDGETS.some(b=>S.budget.includes(b.l)&&p>=b.lo&&p<=b.hi)}
function score(t){
  let s=0;
  t.approaches.forEach(a=>{if(S.likes[a])s+=3; if(S.likes[a]===false)s-=1});
  const c=S.chips;
  if(c.gender.includes(t.gender))s+=2;
  s+=t.specialities.filter(x=>c.specialities.includes(x)).length;
  s+=t.communities.filter(x=>c.communities.includes(x)).length;
  if(c.ethnicity.includes(t.ethnicity))s+=1;
  if(c.sexuality.includes(t.sexuality))s+=1;
  if(S.budget.length&&inBudget(t.price))s+=2;
  if(S.start.some(x=>t.start.includes(x)))s+=1;
  return s;
}
const CARD_COLORS={cbt:['#88d2e1','#d5eff5'],psy:['#ffba3d','#ffe4a8'],hum:['#bfd961','#e9f2c8'],int:['#d29aef','#e4cff2'],sys:['#99affa','#d2dbf4']};
function screenResults(){
  const list=[...THERAPISTS].sort((a,b)=>score(b)-score(a));
  const total=list.length+1;
  const first=n=>esc(n.split(' ')[0]);
  const langs=t=>{const l=t.speaks.split(', ');return l.length>2?`${l.slice(0,2).join(', ')} + <u>${l.length-2} more...</u>`:l.join(', ')};
  const pages=list.map(t=>{const lead=t.approaches[0],[tag,pill]=CARD_COLORS[lead];
    return `<div class="page"><article class="pcard" aria-label="${esc(t.name)}">
      <div class="pc-top">
        <div class="photo"><img src="${IMG[t.img]}" alt="Portrait of ${esc(t.name)}"></div>
        <div class="tagwrap">
          <div class="tagline" style="background:${tag}">${esc(t.tagline)}</div>
          <div class="pc-pills"><button class="apill" style="background:${pill}" data-toast="Explains ${THERAPIES[lead].name.toLowerCase()}.">${THERAPIES[lead].name}${icon('info')}</button><span class="ibadge">Intro call</span></div>
        </div>
      </div>
      <div class="pc-body">
        <div class="name">${esc(t.name)}<span class="ic"><span title="Verified therapist">${icon('verified')}</span><button aria-label="Message ${esc(t.name)}" data-toast="Opens a message to ${first(t.name)}. Replies within 24 hrs.">${icon('message')}</button></span></div>
        <div class="reg">${t.reg}${icon('info')}</div>
        <div class="meta"><div class="two"><span>Age: ${t.age}</span><span>Gender: ${t.gender}</span></div><div>Speaks: ${langs(t)}</div><div>Experience: ${t.exp}</div></div>
        <button class="lnk" data-toast="Opens ${first(t.name)}’s full profile.">See profile</button>
      </div>
      <div class="sales"><div style="flex:1"><div class="amt"><b>£${t.price}</b><span>per session</span></div>
          <button class="lnk" style="height:28px" data-toast="Shows concession rates.">Concessions available</button></div>
        <button class="book" data-toast="Opens ${first(t.name)}’s calendar.">Book now</button></div>
    </article></div>`}).join('');
  const scr=el(`<section class="screen res-wrap">
    <div class="res">${pages}
      <div class="page cta"><article class="cta-card" aria-label="Browse therapists">
        <div class="ct"><h2 class="h4" style="color:var(--n800)">Not ready to choose<br>just yet? That’s okay!</h2>
          <p style="font-size:14px;line-height:24px">You can use your summary to guide your own search, and explore therapists who feel right for you.</p>
          <button class="btn btn-primary" data-toast="Opens the full therapist directory, filtered by your summary.">Browse therapists</button></div>
        <img src="${IMG.cta}" alt=""></article></div>
    </div>
    <div class="vdots" aria-hidden="true">${Array.from({length:total},(_,j)=>`<i class="${j===0?'on':''}"></i>`).join('')}</div>
    ${S.guideSeen?'':`<div class="guide" role="button" tabindex="0" aria-label="Swipe up for more therapists. Tap to dismiss.">
      <div class="hand">${SVG.swipe}</div>
      <div class="pillmsg"><span class="chev">${SVG.chevUp}</span><p>Swipe up for more therapists</p></div></div>`}
    </section>`);
  scr.querySelectorAll('[data-toast]').forEach(b=>b.onclick=()=>toast(b.dataset.toast));
  const res=scr.querySelector('.res'),dots=[...scr.querySelectorAll('.vdots i')];
  res.addEventListener('scroll',()=>{const i=Math.round(res.scrollTop/res.clientHeight);dots.forEach((d,j)=>d.classList.toggle('on',j===i));dismiss()},{passive:true});
  const g=scr.querySelector('.guide');
  function dismiss(){if(!g||S.guideSeen)return;S.guideSeen=true;g.classList.add('out');setTimeout(()=>g.remove(),200)}
  if(g){g.onclick=dismiss;g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();dismiss()}};g.addEventListener('wheel',dismiss,{passive:true});g.addEventListener('touchmove',dismiss,{passive:true})}
  return scr;
}
function toastEl(){return phone.querySelector('.toast')}
function render(anim){
  const st=STEPS[S.step];
  const scr={text:screenText,intro:screenIntro,card:screenCard,chips:screenChips,practical:screenPractical,summary:screenSummary,results:screenResults}[st.type](st);
  const prev=[...phone.querySelectorAll('.screen')];
  const prevBars=prev.length?[...prev[prev.length-1].querySelectorAll('.bar i')].map(i=>i.style.width):[];
  prev.forEach(n=>{n.classList.add('leaving');n.querySelectorAll('textarea,input').forEach(f=>f.blur())});
  const tgt=toastEl();
  if(tgt) phone.insertBefore(scr,tgt); else phone.appendChild(scr);
  // progress bars continue from where they were instead of re-appearing
  const bars=[...scr.querySelectorAll('.bar i')];
  if(anim&&prevBars.length===bars.length){const to=bars.map(i=>i.style.width);bars.forEach((i,k)=>{i.style.transition='none';i.style.width=prevBars[k]});scr.offsetWidth;bars.forEach((i,k)=>{i.style.transition='';i.style.width=to[k]})}
  if(anim&&prev.length){scr.classList.add('enter');setTimeout(()=>prev.forEach(n=>n.remove()),220)} else prev.forEach(n=>n.remove());
  scr.querySelectorAll('[data-act="next"]').forEach(b=>b.addEventListener('click',next));
  scr.querySelectorAll('[data-act="back"]').forEach(b=>b.addEventListener('click',back));
  scr.querySelectorAll('[data-act="exit"]').forEach(b=>b.addEventListener('click',()=>toast('Progress saved. You can pick up where you left off.')));
}
document.getElementById('restart').onclick=()=>{S=fresh();render(true)};
render(false);
/* ---------- autoplay demo: runs while visible, stops for good on first real interaction ---------- */
(function(){
  const css=document.createElement('style');
  css.textContent='.tap{position:absolute;z-index:60;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:rgba(23,23,23,.18);box-shadow:0 0 0 2px rgba(255,255,255,.7);pointer-events:none;transform:scale(.4);opacity:0;transition:transform .25s ease,opacity .25s ease}.tap.on{transform:scale(1);opacity:1}';
  document.head.appendChild(css);
  let live=true,visible=false,run=0;
  const stop=e=>{if(e.isTrusted&&live){live=false;phone.querySelectorAll('.tap').forEach(t=>t.remove())}};
  ['pointerdown','keydown','wheel','touchstart'].forEach(t=>phone.addEventListener(t,stop,{capture:true,passive:true}));
  new IntersectionObserver(es=>{visible=es[0].isIntersecting},{threshold:.35}).observe(phone);
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  async function wait(ms,id){let t=0;while(t<ms){if(!live||id!==run)throw 0;await sleep(100);if(visible)t+=100}}
  const q=s=>{const sc=phone.querySelectorAll('.screen:not(.leaving)');return sc[sc.length-1].querySelector(s)};
  async function tap(node,id){
    if(!node)return;
    const p=phone.getBoundingClientRect(),r=node.getBoundingClientRect();
    const d=document.createElement('div');d.className='tap';
    d.style.left=(r.left-p.left+r.width/2)+'px';d.style.top=(r.top-p.top+r.height/2)+'px';
    phone.appendChild(d);d.offsetWidth;d.classList.add('on');
    await wait(260,id);node.click();d.classList.remove('on');setTimeout(()=>d.remove(),300);
  }
  async function type(text,id){
    const ta=q('textarea');
    for(const ch of text){ta.value+=ch;ta.dispatchEvent(new Event('input'));ta.scrollTop=ta.scrollHeight;await wait(ch===' '?55:32,id)}
  }
  const chip=label=>[...phone.querySelectorAll('.screen:not(.leaving) .chip')].find(b=>b.textContent===label);
  const nextBtn=()=>q('[data-act="next"]');
  async function loop(id){
    await wait(1400,id);
    const answers=['Work stress has been building up and I find it hard to switch off.','I tried CBT once. The tools helped, but I wanted more space to talk.','Close to my friends. Things are harder with my family.'];
    for(const a of answers){await type(a,id);await wait(600,id);await tap(nextBtn(),id);await wait(900,id)}
    await wait(1600,id);await tap(nextBtn(),id);await wait(1100,id);           // therapy types intro
    for(const v of [true,true,false,false,true]){await wait(1500,id);await tap(q(`[data-act="${v?'like':'pass'}"]`),id);await wait(500,id)}
    await wait(1600,id);await tap(nextBtn(),id);await wait(1000,id);           // therapist intro
    const picks=[['Female'],[],[],['Stress','Anxiety'],[]];
    for(const p of picks){await wait(700,id);for(const c of p){await tap(chip(c),id);await wait(450,id)}await wait(500,id);await tap(nextBtn(),id);await wait(800,id)}
    await wait(500,id);await tap(chip('This week'),id);await wait(450,id);await tap(chip('£40–£60'),id);await wait(700,id);await tap(nextBtn(),id);
    await wait(1200,id);const sc=q('.sum-scroll');                             // summary
    if(sc){sc.scrollTo({top:sc.scrollHeight,behavior:'smooth'});await wait(2200,id);sc.scrollTo({top:0,behavior:'smooth'});await wait(900,id)}
    await tap(nextBtn(),id);await wait(2400,id);                               // results
    const res=q('.res');
    if(res){for(const k of [1,2,3]){res.scrollTo({top:res.clientHeight*k,behavior:'smooth'});await wait(2200,id)}}
    await wait(1200,id);
    S=fresh();render(true);
  }
  (async function go(){while(live){const id=++run;try{await loop(id)}catch(e){}}})();
})();
</script>
