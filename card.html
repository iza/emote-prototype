*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#fff}
body{font-family:I,system-ui,sans-serif;color:#2e3438;font-size:13px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:root{--line:#e6eaee;--mute:#76838c;--bg:#f7f9fa;--acc:#f07da7}
#app{position:absolute;left:0;top:0;width:1200px;height:780px;transform-origin:0 0;display:flex;flex-direction:column;background:#fff;overflow:hidden}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* top bar */
.top{height:52px;flex:none;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--line)}
.logo{width:40px;height:24px;border-radius:6px;background:#bfd961;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;font-family:P;flex:none}
.logo b{font-size:9px;font-weight:500}.logo i{font-style:normal;font-size:4.6px;font-weight:500;letter-spacing:.08em;margin-top:2px}
.crumbs{font-size:13px;color:var(--mute)}.crumbs b{color:#2e3438;font-weight:600}
.chip{font-size:11px;font-weight:500;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--mute)}
.chip.ok{border-color:#cfe7d9;background:#effaf3;color:#1d7a4c}
.views{margin-left:auto;display:flex;gap:2px;background:#f1f3f5;padding:3px;border-radius:9px}
.views button{height:28px;padding:0 12px;border-radius:7px;font-size:12.5px;font-weight:500;color:#5c6870;display:flex;align-items:center;gap:6px}
.views button.on{background:#fff;color:#2e3438;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.views svg{width:13px;height:13px}

.body{flex:1;display:flex;min-height:0}
.side{width:248px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:auto;background:#fff}
.side.r{width:316px;border-right:0;border-left:1px solid var(--line)}
.sec{padding:16px 18px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.lab{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.lab span{letter-spacing:0;text-transform:none;font-weight:500}
.row{display:flex;align-items:center;justify-content:space-between;height:30px;font-size:12.5px}
.row code{font-size:11px;color:var(--mute)}
.tog{width:30px;height:18px;border-radius:999px;background:#cfd6dd;position:relative;transition:background .15s;flex:none}
.tog::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tog.on{background:#262626}.tog.on::after{transform:translateX(12px)}
.tog:focus-visible,.apb:focus-visible,.seg button:focus-visible{outline:2px solid #262626;outline-offset:2px}
.apps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.apb{height:34px;border-radius:8px;position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);transition:transform .15s}
.apb:hover{transform:translateY(-1px)}
.apb.on::after{content:"";position:absolute;inset:-3px;border:1.5px solid #262626;border-radius:10px}
.apname{font-size:12px;margin-top:8px;color:#5c6870}.apname b{color:#2e3438;font-weight:500}
.seg{display:flex;background:#f1f3f5;border-radius:8px;padding:3px;gap:2px}
.seg button{flex:1;height:26px;border-radius:6px;font-size:12px;color:#5c6870;font-weight:500}
.seg button.on{background:#fff;color:#2e3438;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.ppl{display:flex;gap:8px}.ppl button{width:34px;height:34px;border-radius:50%;overflow:hidden;outline:2px solid transparent;outline-offset:2px;transition:outline-color .15s}
.ppl button.on{outline-color:#262626}.ppl img{width:100%;height:100%;object-fit:cover;display:block}

/* canvas */
.canvas{flex:1;position:relative;overflow:hidden;background:var(--bg)}
.canvas.grid{background-image:linear-gradient(rgba(0,0,0,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.045) 1px,transparent 1px);background-size:8px 8px}
.ctools{position:absolute;left:14px;top:12px;display:flex;gap:6px;z-index:40}
.tb{height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:500;color:#5c6870;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.tb:hover{color:#2e3438;border-color:#cfd6dd}.tb.on{background:#2e3438;color:#fff;border-color:#2e3438}
.tb svg{width:13px;height:13px}
.size{position:absolute;right:14px;top:16px;font-size:11px;color:var(--mute);z-index:40}
.world{position:absolute;left:50%;top:50%;width:360px;height:682px;transform:translate(-62%,-48%) scale(.84);transform-origin:center}

/* the card (emoteCare tokens) */
.card{width:360px;height:682px;border-radius:16px;overflow:hidden;background:#fff;color:#262626;display:flex;flex-direction:column;font-family:P,sans-serif;position:relative;
 box-shadow:0 1px 3px rgba(60,45,30,.10),0 14px 34px rgba(60,45,30,.10);transition:box-shadow .3s,transform .3s}
.card.hover{transform:translateY(-6px);box-shadow:0 2px 6px rgba(60,45,30,.12),0 28px 56px rgba(60,45,30,.18)}
.card .ph{height:360px;flex:none;overflow:hidden;position:relative}.card .ph img{display:block;width:360px;height:360px;object-fit:cover;transition:transform .5s}
.card.hover .ph img{transform:scale(1.03)}
.card .tw{margin-top:-31px;padding:0 12px;display:flex;flex-direction:column;gap:6px;position:relative}
.card .tg{border-radius:12px;padding:8px 12px;font-size:14px;line-height:24px;font-weight:500;transition:background .35s}
.card .pl{display:flex;gap:6px}
.card .ap{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:8px;font-size:12px;line-height:20px;transition:background .35s}
.card .ib{display:inline-flex;align-items:center;height:28px;padding:0 8px;border-radius:8px;background:#f6f5f4;font-size:12px;line-height:20px}
.card svg{width:16px;height:16px;flex:none}
.card .bd{padding:16px 24px 0;display:flex;flex-direction:column}
.card .nm{display:flex;align-items:center;gap:8px;font-size:18px;line-height:28px;font-weight:500;letter-spacing:-.18px;align-self:flex-start}
.card .nm span{display:flex;gap:4px}.card .nm svg{width:20px;height:20px}
.card .rg{display:flex;align-items:center;gap:4px;font-size:12px;line-height:20px;font-weight:500;color:#3b5fbb;align-self:flex-start}
.card .mt{font-size:12px;line-height:20px;color:#404040;margin-top:4px;align-self:flex-start}
.card .mt .two{display:flex;gap:12px}.card .mt u{text-underline-offset:2px}
.card .lk{height:32px;display:inline-flex;align-items:center;font-size:12px;line-height:16px;color:#3b5fbb;text-decoration:underline;text-underline-offset:2px;align-self:flex-start}
.card .sl{margin-top:auto;display:flex;align-items:flex-end;gap:8px;padding:8px 24px 24px}
.card .am{display:flex;align-items:center;gap:4px}.card .am b{font-size:18px;line-height:28px;font-weight:500}.card .am i{font-style:normal;font-size:12px;line-height:20px;color:#525252}
.card .bk{height:40px;padding:0 16px;min-width:112px;border-radius:999px;background:#262626;color:#fff;font-size:14px;line-height:40px;text-align:center;flex:none;transition:background .15s}
.card.hover .bk{background:#404040}
/* skeleton (loading) */
.card.loading [data-p]{color:transparent!important;background:#efefee!important;border-radius:8px}
.card.loading [data-p] *{visibility:hidden}
.card.loading .ph{background:#efefee}.card.loading .ph img{opacity:0}
.card.loading [data-p],.card.loading .ph{position:relative;overflow:hidden}
.card.loading [data-p]::after,.card.loading .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);transform:translateX(-100%);animation:shim 1.3s infinite}
@keyframes shim{to{transform:translateX(100%)}}
/* build */
.card [data-p]{transition:opacity .45s ease,transform .5s cubic-bezier(.2,.8,.2,1),background .35s}
.card.build [data-p]{opacity:0;transform:translateY(10px)}
.card.build [data-p].in{opacity:1;transform:none}

/* overlays */
.ov{position:absolute;inset:0;pointer-events:none;z-index:30}
.hl{position:absolute;border:1.5px solid var(--acc);border-radius:5px;opacity:0;transition:all .18s ease}
.hl.on{opacity:1}
.mk{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#fff;border:1.5px solid #2e3438;font:600 11px/19px I;text-align:center;color:#2e3438;pointer-events:auto;cursor:pointer;transition:all .18s;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.mk.on,.mk:hover{background:var(--acc);border-color:var(--acc);color:#fff}
.mkl{position:absolute;font:500 12px/16px I;color:#2e3438;white-space:nowrap;pointer-events:auto;cursor:pointer;transition:color .15s}
.mkl small{display:block;font:400 10.5px/14px ui-monospace,Menlo,monospace;color:var(--mute)}
.mkl.on{color:#b54584}
svg.lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
svg.lines path{fill:none;stroke:#9aa6ae;stroke-width:1;transition:stroke .15s}
svg.lines path.on{stroke:var(--acc);stroke-width:1.5}
svg.lines circle{fill:#9aa6ae}svg.lines circle.on{fill:var(--acc)}
.anat-off .mk,.anat-off .mkl,.anat-off svg.lines{opacity:0;pointer-events:none}
.mk,.mkl,svg.lines{transition:opacity .3s}
.pad{position:absolute;background:rgba(240,125,167,.16);display:flex;align-items:center;justify-content:center;font:600 9px I;color:#b54584}
.redl{position:absolute;font:600 10px I;color:#b54584;white-space:nowrap}

/* inspector */
.ins-h{font-size:16px;font-weight:600;line-height:22px;color:#2e3438;display:flex;align-items:center;gap:8px}
.ins-h .n{width:20px;height:20px;border-radius:50%;background:var(--acc);color:#fff;font-size:10.5px;display:grid;place-items:center;flex:none}
.ins-d{font-size:12.5px;line-height:19px;color:#5c6870;margin-top:6px}
.tok{display:grid;grid-template-columns:84px 1fr;gap:8px;padding:8px 0;border-top:1px solid #f0f2f4;font-size:12px;line-height:18px;align-items:center}
.tok:first-child{border-top:0}
.tok>span{color:var(--mute)}
.tok code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tok code i{width:12px;height:12px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);flex:none}
.tok code small{color:#a3adb4;font-size:10.5px}
.ptabs{display:flex;gap:14px;border-bottom:1px solid var(--line);padding:0 18px;flex:none}
.ptabs button{height:38px;font-size:12.5px;font-weight:500;color:var(--mute);position:relative}
.ptabs button.on{color:#2e3438}.ptabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:#2e3438;border-radius:2px}
.ptabs .cnt{font-size:10px;background:#eef1f4;border-radius:999px;padding:1px 6px;margin-left:4px;font-weight:600}
.pbody{flex:1;overflow:auto}
.ar{display:flex;align-items:center;gap:8px;font-size:12px;padding:9px 0;border-top:1px solid #f0f2f4}
.ar:first-child{border-top:0}
.ar b{font-size:10px;font-weight:700;border-radius:999px;padding:2px 7px;flex:none}
.ar .ok{background:#e4f5ec;color:#147a4d}.ar .fail{background:#ffe6ef;color:#8d3467}
.ar span{margin-left:auto;color:var(--mute);font-family:ui-monospace,Menlo,monospace;font-size:11px}
.code{background:#1d2125;color:#d8dee4;border-radius:10px;padding:14px;font:11.5px/18px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre;overflow:auto}
.code .k{color:#bfd961}.code .a{color:#88d2e1}.code .s{color:#faa8ca}.code .c{color:#76838c}
.uses{display:flex;flex-wrap:wrap;gap:6px}
.uses span{font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:#5c6870}
</style>
</head>

  <div class="canvas" id="canvas">
   <div class="ctools">
    <button class="tb" id="replay"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 3v3h-3"/></svg>Build</button>
    <button class="tb" id="gridb"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 6h12M2 10h12M6 2v12M10 2v12"/></svg>Grid</button>
   </div>
   <div class="size mono">360 × 682 · radius-4</div>
   <div class="world" id="world"><div class="card" id="card"></div><div class="ov" id="ov"></div></div>
  </div>
  <aside class="side r" style="display:flex;flex-direction:column">
   <div class="sec" style="flex:none"><div class="ins-h" id="ih"></div><p class="ins-d" id="id"></p></div>
   <div class="ptabs" id="ptabs"><button class="on" data-t="tokens">Tokens</button><button data-t="a11y">Accessibility</button><button data-t="code">Code</button></div>
   <div class="pbody sec" id="pb"></div>
  </aside>
