<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Financial Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#065d44;--ink:#031711;--muted:#6b7772;--line:#eceeed;--soft:#f5f6f5;--page:#faf9f6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--page);font-family:Inter,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;gap:12px;font-feature-settings:"tnum" 1}
.phone{position:relative;width:390px;height:min(844px,100dvh);overflow:hidden;border-radius:28px;box-shadow:0 20px 60px rgba(23,23,23,.12),0 0 0 1px rgba(23,23,23,.06);background:#fff;-webkit-tap-highlight-color:transparent}
.phone *{-webkit-tap-highlight-color:transparent}
.restart{font-size:12px;line-height:20px;color:#525252;text-decoration:underline;text-underline-offset:3px;background:none;border:0;cursor:pointer;font-family:inherit}
@media (max-width:430px),(max-height:700px){body{gap:0}.phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}.restart{display:none}}
html.embed,html.embed body{background:transparent}
html.embed body{min-height:0;height:844px;gap:0;justify-content:flex-start}
html.embed .phone{height:800px;margin:4px 0 40px;border-radius:32px;box-shadow:0 0 0 1px rgba(23,23,23,.07),0 8px 22px rgba(23,23,23,.09)}
html.embed .restart{display:none}
button:focus,button:focus-visible{outline:none}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* screens */
.screen{position:absolute;inset:76px 0 78px 0;background:#fff;display:flex;flex-direction:column;transition:transform .42s cubic-bezier(.3,.7,.2,1),opacity .3s ease;z-index:1}
.screen.off-right{transform:translateX(100%)}
.screen.off-left{transform:translateX(-28%);opacity:.6}
.screen.hidden{visibility:hidden}
.top{position:absolute;left:0;right:0;top:0;height:76px;padding:28px 16px 0;display:flex;align-items:center;justify-content:space-between;background:#fff;z-index:6;transition:background .35s}
.top.onbg{background:#f4f5f4}
.top .back,.top h1{transition:opacity .25s}
.top.onbg .back,.top.onbg h1{opacity:0;pointer-events:none}
.top h1.swap{opacity:0}
.top .back{width:32px;height:32px;display:flex;align-items:center}
.top .back svg{width:9px;height:15px}
.top h1{font-size:15px;line-height:20px;font-weight:500;letter-spacing:-.2px}
.top .me{width:32px;height:32px;border-radius:50%;overflow:hidden}
.top .me img{width:100%;height:100%;object-fit:cover;display:block}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}
.eb{font-size:11px;line-height:14px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* home */
.hero{padding:28px 20px 0;display:flex;justify-content:space-between;align-items:flex-end}
.bal{margin-top:6px;font-size:42px;line-height:46px;font-weight:700;letter-spacing:-1.8px}
.bal span{font-size:26px;color:var(--muted);font-weight:400;margin-right:2px;letter-spacing:0}
.delta{margin-top:6px;font-size:13px;font-weight:500;color:#0a7a55}
.delta em{font-style:normal;color:var(--muted);font-weight:400}
.pbtn{height:34px;padding:0 14px;border-radius:17px;border:1px solid #d9dedc;font-size:13px;font-weight:500;display:flex;align-items:center;margin-bottom:6px;transition:background .2s}
.pbtn:active{background:var(--soft)}
.forest{margin:40px 6px 0;display:grid;grid-template-columns:repeat(4,1fr);align-items:end;height:172px}
.col{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer}
.tree{pointer-events:none;position:absolute;bottom:0;left:50%;margin-left:-42px;width:84px;height:252px;transform-origin:50% 100%}
.tree .layer{position:absolute;inset:0}
.tree img{position:absolute;left:0;bottom:0;width:84px;height:252px;opacity:0;transform-origin:50% 100%;transition:opacity .7s ease,transform .9s cubic-bezier(.2,.8,.25,1)}
.tree img.on{opacity:1}
.tree .grey{filter:grayscale(1) brightness(1.62) contrast(.52);clip-path:inset(0 0 0 0);transition:clip-path 1.4s cubic-bezier(.5,0,.3,1)}
.tree.alive .grey{clip-path:inset(0 0 100% 0)}
.tree.sway{animation:sway 5s ease-in-out infinite alternate}
@keyframes sway{0%{transform:rotate(-1.1deg)}100%{transform:rotate(1.1deg)}}
.sprout{width:56px;height:56px;border-radius:12px;background:#f8d2e6;position:relative;overflow:hidden;margin-bottom:2px}
.sprout img{position:absolute;left:3px;bottom:2px;width:50px;height:150px}
.labels{display:grid;grid-template-columns:repeat(4,1fr);margin:12px 6px 0;text-align:center}
.labels .eb{font-size:10px;letter-spacing:.1em}
.amt{display:table;padding:0 8px;border-radius:14px;cursor:pointer;margin:6px auto 0;height:28px;line-height:28px;font-size:17px;font-weight:600;letter-spacing:-.4px}
.add{margin:6px auto 0;width:56px;height:28px;border-radius:14px;background:#f1f3f2;color:var(--g);font-size:18px;line-height:28px;display:block;transition:transform .15s}
.card{border-radius:20px;background:var(--soft);padding:18px}
.goalcard{margin:32px 16px 0}
.goalcard h3{margin-top:6px;font-size:18px;line-height:24px;font-weight:600;letter-spacing:-.4px}
.bar{margin-top:16px;height:6px;border-radius:3px;background:#e1e5e3;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;background:var(--g);transition:width 1.2s cubic-bezier(.3,.7,.2,1)}
.bar.behind i{background:#f07a73}
.row{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--muted)}
.row b{color:var(--ink);font-weight:600}
.st{margin-top:14px;display:flex;justify-content:space-between;align-items:center}
.pill{font-size:12px;font-weight:600;color:#0a7a55;background:#e3f4ec;padding:5px 10px;border-radius:12px}
.pill.behind{color:#b9433b;background:#fde8e6}
.link{font-size:13px;font-weight:600;color:var(--g)}
.sec{margin:36px 20px 12px;display:flex;justify-content:space-between;align-items:baseline}
.sec h2{font-size:18px;line-height:24px;font-weight:600;letter-spacing:-.4px}
.accs{padding:0 16px 28px;display:flex;flex-direction:column;gap:10px}
.acc{border-radius:18px;padding:16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:transform .15s}
.acc:active{transform:scale(.985)}
.acc .n{font-size:13px;font-weight:500;color:rgba(3,23,17,.7)}
.acc .v{margin-top:2px;font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.8px}
.acc .g{margin-top:4px;font-size:12px;color:rgba(3,23,17,.62)}
.chev{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chev svg{width:7px;height:12px}

/* account detail */
.hcard{margin:4px 16px 0;border-radius:24px;padding:20px 16px 18px}
.hcard .t{font-size:20px;line-height:26px;font-weight:600;letter-spacing:-.4px}
.hcard .p{margin-top:2px;font-size:13px;color:rgba(3,23,17,.65)}
.hcard .bal{margin-top:14px;font-size:38px;line-height:42px}
.hcard .bal span{color:rgba(3,23,17,.5)}
.hcard .u{margin-top:4px;font-size:12px;color:rgba(3,23,17,.55)}
.wcard{margin-top:16px;background:#fff;border-radius:18px;padding:16px}
.wcard .q{font-size:15px;line-height:21px;font-weight:600;letter-spacing:-.2px}
.chips{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{border-radius:14px;padding:10px 12px}
.chip small{display:block;font-size:11px;line-height:14px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.chip b{display:block;margin-top:4px;font-size:18px;line-height:22px;font-weight:700;letter-spacing:-.5px}
.chart{position:relative;margin-top:18px;height:170px}
.chart .grid{position:absolute;left:34px;right:0;top:0;bottom:22px;display:flex;flex-direction:column;justify-content:space-between}
.chart .grid i{display:block;border-top:1px solid rgba(3,23,17,.08);position:relative}
.chart .grid i span{position:absolute;left:-34px;top:-7px;font-size:10px;color:rgba(3,23,17,.55);font-style:normal}
.chart .bars{position:absolute;left:34px;right:0;top:0;bottom:22px;display:flex;justify-content:space-around;align-items:flex-end}
.chart .b{width:26px;display:flex;flex-direction:column-reverse;border-radius:6px 6px 2px 2px;overflow:hidden;transform-origin:50% 100%;transform:scaleY(0);transition:transform .8s cubic-bezier(.2,.8,.25,1)}
.chart.run .b{transform:scaleY(1)}
.chart .xl{position:absolute;left:34px;right:0;bottom:0;display:flex;justify-content:space-around;font-size:11px;font-weight:500;color:rgba(3,23,17,.6)}
.chart .xl span{width:26px;text-align:center}
.provs{padding:0 16px;display:flex;flex-direction:column;gap:10px}
.prov{border:1px solid var(--line);border-radius:18px;padding:16px}
.prov .h{display:flex;justify-content:space-between;align-items:center}
.prov .h b{font-size:15px;font-weight:600}
.prov .v{margin-top:8px;font-size:24px;line-height:30px;font-weight:700;letter-spacing:-.8px}
.prov .v em{font-style:normal;font-size:14px;font-weight:600;color:#0a7a55;margin-left:8px;letter-spacing:0}
.prov .u{font-size:12px;color:var(--muted)}
.ask{margin:14px 16px 28px;height:56px;border-radius:28px;background:#fde4ea;display:flex;align-items:center;gap:12px;padding:0 8px;font-size:15px;font-weight:600;color:#5c3a46}
.ask img{width:40px;height:40px;border-radius:50%;object-fit:cover}

/* projection */
.ph{padding:8px 20px 0}
.ph h2{font-size:28px;line-height:34px;font-weight:700;letter-spacing:-1px}
.ph p{margin-top:10px;font-size:14px;line-height:21px;color:#4a5450}
.ages{margin:20px 16px 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.age{border:1px solid #d9dedc;border-radius:16px;padding:12px 14px;position:relative}
.age b{display:block;margin-top:4px;font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.6px}
.qm{position:absolute;right:12px;top:12px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:700;line-height:22px;text-align:center}
.pots{margin:14px 16px 0;display:flex;flex-direction:column;gap:8px}
.pot{height:52px;border-radius:16px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:15px;font-weight:600}
.pot span:last-child{font-size:14px;font-weight:600;opacity:.75}
.cta{margin:16px 16px 0;height:52px;border-radius:26px;background:var(--ink);color:#fff;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;width:calc(100% - 32px)}
.result{display:none}
.proj.done .form{display:none}
.proj.done .result{display:block}
.rhead{padding:8px 20px 0}
.rhead p{font-size:14px;line-height:20px;color:#4a5450}
.rhead p.bal{color:var(--ink);margin-top:8px;font-size:40px;line-height:44px}
.fut{margin:28px 6px 0;height:252px}
.area{margin:12px 16px 0;position:relative;height:150px}
.area svg{width:100%;height:100%;display:block;overflow:visible}
.area path{transition:clip-path 1.6s ease}
.area .ax{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:6px}
.brk{margin:20px 16px 28px;display:flex;flex-direction:column}
.brk div{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.brk div:last-child{border:0}
.brk i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:10px;vertical-align:-1px}
.brk b{font-weight:600}

/* bottom nav */
.nav{position:absolute;left:0;right:0;bottom:0;height:78px;background:#fff;border-top:1px solid #f0f1f0;display:flex;justify-content:space-around;align-items:flex-start;padding-top:12px;z-index:5}
.nav .it{width:60px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:500;color:var(--muted)}
.nav .it.on{color:var(--g);font-weight:600}
.nav .it svg{width:24px;height:24px}
.nav .chat{margin-top:-34px;width:64px;height:64px}
.nav .chat svg{width:64px;height:64px;filter:drop-shadow(0 4px 10px rgba(6,93,68,.25))}

/* sheets */
.dim{position:absolute;inset:0;background:rgba(3,23,17,.45);opacity:0;pointer-events:none;transition:opacity .3s;z-index:8}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:28px 28px 0 0;z-index:9;transform:translateY(105%);transition:transform .42s cubic-bezier(.3,.7,.2,1);padding:20px 20px 28px}
.sheet.on{transform:none}
.sheet .x{position:absolute;right:16px;top:16px;width:32px;height:32px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center}
.sheet .x svg{width:12px;height:12px}
.gs{height:690px}
.step{position:absolute;inset:20px 20px 28px;transition:opacity .3s,transform .35s}
.step.out{opacity:0;transform:translateX(-30px);pointer-events:none}
.step.wait{opacity:0;transform:translateX(30px);pointer-events:none}
.ill{margin:30px auto 0;width:218px;height:218px;display:block}
.step h2{margin-top:28px;text-align:center;font-size:26px;line-height:32px;font-weight:700;letter-spacing:-.8px}
.step .sub{margin-top:12px;text-align:center;font-size:14px;line-height:21px;color:#4a5450}
.step .cta{position:absolute;left:0;right:0;bottom:0;margin:0;width:100%}
.cur{margin-top:40px;padding:14px;border-radius:16px;background:var(--soft);font-size:13px;line-height:19px;color:#4a5450}
.cur b{color:var(--ink);font-weight:600}
.step h3{margin-top:24px;font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.6px}
.step h3 small{font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:6px}
.fl{margin-top:18px}
.opts{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px}
.op{height:38px;padding:0 16px;border-radius:19px;border:1px solid #cfd6d3;font-size:14px;font-weight:500;transition:all .2s}
.op.sel{background:var(--g);border-color:var(--g);color:#fff}
.cta[disabled]{opacity:.35}
.tip{padding-top:26px}
.tip h3{font-size:20px;line-height:26px;font-weight:700;letter-spacing:-.4px;padding-right:40px}
.tip p{margin-top:10px;font-size:14px;line-height:21px;color:#4a5450}
.tip .cta{margin:22px 0 0;width:100%;background:#fff;color:var(--ink);border:1px solid var(--ink)}

/* connect */
.onb{background:#f4f5f4}
.onbody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 24px 40px;text-align:center}
.onbody img{display:block}
.onbody h2{margin-top:24px;font-size:24px;line-height:30px;font-weight:700;letter-spacing:-.7px}
.onbody p.s{margin-top:10px;font-size:14px;line-height:21px;color:#4a5450}
.onbody .cta{margin:28px 0 0;width:100%;position:relative;overflow:hidden}
.onbody .lnk{margin-top:18px;font-size:14px;font-weight:500;color:var(--ink)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;margin-right:10px;vertical-align:-3px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.found{margin-top:22px;width:100%;display:flex;flex-direction:column;gap:8px;text-align:left}
.found div{height:44px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:14px;font-weight:500;opacity:0;transform:translateY(8px);transition:all .35s}
.found div.on{opacity:1;transform:none}
.found div span:last-child{width:22px;height:22px;border-radius:50%;background:#e3f4ec;color:#0a7a55;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.found div small{color:var(--muted);font-weight:400;margin-left:6px}
#cbody{justify-content:flex-start;padding-top:56px;transition:padding .4s}
#cbody.busy{padding-top:12px}
#cbody.busy .lnk{display:none}
.okimg{animation:pop .6s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}

/* guidance */
.hint{animation:hint 1.6s ease-out infinite}
@keyframes hint{0%{box-shadow:0 0 0 0 rgba(6,93,68,.45)}70%{box-shadow:0 0 0 10px rgba(6,93,68,0)}100%{box-shadow:0 0 0 0 rgba(6,93,68,0)}}
.tap{position:absolute;z-index:20;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(3,23,17,.18);border:2px solid rgba(255,255,255,.75);pointer-events:none;opacity:0}
.tap.go{animation:tap .6s ease-out both}
@keyframes tap{0%{opacity:0;transform:scale(1.3)}25%{opacity:1;transform:scale(.85)}60%{opacity:1;transform:scale(.9)}100%{opacity:0;transform:scale(1.15)}}
.toast{position:absolute;left:50%;top:88px;transform:translate(-50%,-10px);background:var(--ink);color:#fff;font-size:13px;font-weight:500;padding:9px 14px;border-radius:18px;opacity:0;transition:all .35s;z-index:12;white-space:nowrap;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.tree.sway{animation:none}.hint{animation:none}}
</style>
</head>
<body>
<script>if(window.self!==window.top)document.documentElement.classList.add("embed")</script>
<div class="phone" id="phone"></div>
<button class="restart" id="restart" type="button">Restart</button>
<script>

/* ---------- trees ---------- */
function treeEl(stage,grey){
 const t=document.createElement('div');t.className='tree sway'+(grey?'':' alive');t.style.animationDelay=(-Math.random()*5)+'s';
 const imgs=s=>TREES.map((src,i)=>`<img src="${src}" data-s="${i+1}" class="${i+1===s?'on':''}" alt="">`).join('');
 t.innerHTML=`<div class="layer green">${imgs(stage)}</div><div class="layer grey">${imgs(stage)}</div>`;
 t.dataset.stage=stage;return t;
}
function setStage(t,s){
 t.dataset.stage=s;
 t.querySelectorAll('.layer').forEach(l=>l.querySelectorAll('img').forEach(im=>{
  const on=+im.dataset.s===s;
  if(on){im.style.transition='none';im.style.transform='scale(.86)';void im.offsetWidth;im.style.transition='';im.style.transform='scale(1)';}
  im.classList.toggle('on',on);
 }));
}
const sleepT=ms=>new Promise(r=>setTimeout(r,ms));
async function grow(t,to,step=520){let s=+t.dataset.stage;while(s<to){s++;setStage(t,s);await sleepT(step)}}
function countTo(el,to,dur=1200,from=0){const t0=performance.now();const f=now=>{const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=fmt(from+(to-from)*e);if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}

 buildAccs();updateHint();
}
function buildAccs(){const k=[...document.querySelectorAll('.acc')];k.forEach(d=>{const key=d.dataset.open,A=ACC[key];if(S.goal[key])d.querySelector('.g').textContent=`£${fmt(A.target)} by ${A.when}`})}

/* ---------- projection ---------- */
const FUT={investments:[1820939,'#0b6045'],savings:[309204,'#a35a98'],pension:[264838,'#d9b417'],property:[0,'#4fa8f0']};
function openProj(){$('#proj').classList.remove('done');$('#projScroll').scrollTop=0;show('proj')}
async function calc(){
 const P=$('#proj');P.classList.add('done');$('#projScroll').scrollTop=0;
 const total=FUT.investments[0]+FUT.savings[0]+FUT.pension[0];
 countTo($('#fnw'),total,2600);
 const f=$('#futForest'),l=$('#futLabels');f.innerHTML='';l.innerHTML='';
 const trees={};
 ORDER.forEach(k=>{const col=document.createElement('div');col.className='col';
  const start=S.stage[k];const t=treeEl(start,k==='property'&&!S.goal.property);col.appendChild(t);f.appendChild(col);trees[k]=t;
  const lab=document.createElement('div');lab.innerHTML=`<p class="eb">${LABEL[k]}</p><p class="amt" style="font-size:14px">${k==='property'?'—':'£'+(FUT[k][0]>=1e6?(FUT[k][0]/1e6).toFixed(1)+'m':Math.round(FUT[k][0]/1000)+'k')}</p>`;l.appendChild(lab)});
 // area chart
 const W=358,H=150,xs=[0,.15,.3,.5,.75,1];const g=t=>Math.pow(t,2.2);
 const ser=[['investments',.76],['savings',.13],['pension',.11]];let base=xs.map(()=>0);let paths='';
 ser.forEach(([k,share])=>{const top=xs.map((x,i)=>base[i]+share*(.06+.94*g(x)));const pts=xs.map((x,i)=>[x*W,H-top[i]*H]);const bot=xs.map((x,i)=>[x*W,H-base[i]*H]).reverse();
  paths+=`<path d="M${pts.map(p=>p.join(',')).join(' L')} L${bot.map(p=>p.join(',')).join(' L')} Z" fill="${FUT[k][1]}" opacity=".9"/>`;base=top});
 $('#area').innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><g id="ag" style="clip-path:inset(0 100% 0 0);transition:clip-path 2.6s cubic-bezier(.4,0,.2,1)">${paths}</g></svg><div class="ax"><span>27</span><span>32</span><span>37</span><span>44</span><span>52</span><span>60</span></div>`;
 $('#brk').innerHTML=[['investments','Investments'],['savings','Savings'],['pension','Pension'],['property','Real Estate']].map(([k,n])=>`<div><span><i style="background:${FUT[k][1]}"></i>${n}</span><b>${FUT[k][0]?'£'+fmt(FUT[k][0]):'Not added'}</b></div>`).join('');
 await sleepT(60);$('#ag').style.clipPath='inset(0 0 0 0)';
 await sleepT(300);
 await Promise.all([grow(trees.investments,10,420),grow(trees.pension,8,600),grow(trees.savings,8,700)]);
 updateHint();
}

/* ---------- toast & taps ---------- */
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),4200)}
function tapAt(el){const p=phone.getBoundingClientRect(),r=el.getBoundingClientRect(),t=$('#tap');t.style.left=(r.left-p.left+r.width/2)+'px';t.style.top=(r.top-p.top+r.height/2)+'px';t.classList.remove('go');void t.offsetWidth;t.classList.add('go')}

/* ---------- guidance hint ---------- */
function hintTarget(){
 const top=stack[stack.length-1];
 if($('#goalSheet').classList.contains('on')){if(!$('#st1').classList.contains('out'))return $('#go1');if(!pick.d)return $('#dates .op:nth-child(3)');if(!pick.a)return $('#amts .op:nth-child(3)');return $('#setGoal')}
 if($('#tipSheet').classList.contains('on'))return $('#tipSheet .cta');
 if(top==='connect')return $('#connectBtn');if(top==='okscr')return $('#letsGo');
 if(top==='home'){if(!S.goal.investments)return $('[data-add="investments"]');if(!S.seenAcc)return $('[data-amt="savings"]');if(!S.seenProj)return $('#toProj');return null}
 if(top==='acc')return $('#topBack');
 if(top==='proj'){if(!$('#proj').classList.contains('done'))return $('#calc');return $('#topBack')}
 return null;
}
function updateHint(){return;document.querySelectorAll('.hint').forEach(e=>e.classList.remove('hint'));const t=hintTarget();if(t)t.classList.add('hint')}

/* ---------- events ---------- */
phone.addEventListener('click',e=>{
 const t=e.target;
 const add=t.closest('[data-add]');if(add){if(stack.length>1)back();openGoal(add.dataset.add);return}
 const col=t.closest('.col');if(col&&col.closest('#forest')){const k=col.dataset.k;if(k==='savings'||S.goal[k]){S.seenAcc=true;openAcc(k)}else openGoal(k);return}
 const am=t.closest('[data-amt]');if(am&&am.closest('#labels')){S.seenAcc=true;openAcc(am.dataset.amt);return}
 const acc=t.closest('[data-open]');if(acc){if(acc.dataset.open==='savings')S.seenAcc=true;openAcc(acc.dataset.open);return}
 if(t.closest('[data-back]')){back();return}
 if(t.closest('[data-close]')||t.id==='dim'){closeSheets();return}
 if(t.closest('#go1')){goStep2();return}
 const op=t.closest('.op');if(op){choose(op.parentNode.id==='dates'?'d':'a',op);return}
 if(t.closest('#setGoal')&&!$('#setGoal').disabled){setGoal();return}
 if(t.closest('#toProj')){S.seenProj=true;openProj();return}
 if(t.closest('#calc')){calc();return}
 if(t.closest('#connectBtn')){connect();return}
 if(t.closest('#letsGo')){enterHome();return}
 if(t.closest('#qm')){$('#dim').classList.add('on');$('#tipSheet').classList.add('on');updateHint();return}
},true);

/* ---------- reset & demo ---------- */
let RUN=0,demoOn=false,idleT;
function reset(){
 RUN++;demoOn=false;
 S={stage:{...START},goal:{investments:false,pension:false,property:false},seenAcc:false,seenProj:false};
 ACC.investments.when='';ACC.investments.target=20000;
 stack=['connect'];setTop('connect');['acc','proj','home'].forEach(id=>{const s=$('#'+id);s.className='screen off-right hidden'+(id==='proj'?' proj':'')});
 $('#okscr').className='screen onb off-right hidden';$('#connect').className='screen onb';connecting=false;
 $('#connectBtn').innerHTML='Connect my account';$('#cbody').classList.remove('busy');$('#found').innerHTML='';
 closeSheets();$('#homeScroll').scrollTop=0;$('#nw').textContent='0';$('#mainBar').style.width='0';
 buildHome();updateHint();
}
let connecting=false;
async function connect(){
 if(connecting)return;connecting=true;const r=RUN;
 $('#connectBtn').innerHTML='<span class="spin"></span>Connecting securely…';$('#cbody').classList.add('busy');
 const f=$('#found');f.innerHTML=[['Current account','Monzo'],['Savings','Chase · Marcus'],['Investments','Vanguard · Trading 212'],['Pension','PensionBee']].map(([a,b])=>`<div><span>${a}<small>${b}</small></span><span>✓</span></div>`).join('');
 const rows=[...f.children];
 for(const d of rows){await sleepT(650);if(r!==RUN)return;d.classList.add('on')}
 await sleepT(700);if(r!==RUN)return;show('okscr');
}
function enterHome(){
 show('home');setTimeout(()=>{stack=['home'];['connect','okscr'].forEach(id=>$('#'+id).classList.add('hidden'))},460);
 const r=RUN;setTimeout(async()=>{if(r!==RUN)return;countTo($('#nw'),75000,1600);$('#mainBar').style.width='72%';
  const ts=ORDER.map(k=>[$(`.col[data-k="${k}"] .tree`),S.stage[k]]);
  await Promise.all(ts.map(([t,s],i)=>sleepT(i*120).then(()=>grow(t,s,260))));updateHint()},450);
}
const dsleep=ms=>new Promise((res,rej)=>{const r=RUN;setTimeout(()=>r===RUN&&demoOn?res():rej('stop'),ms*1.7)});
async function dtap(sel){const el=typeof sel==='string'?$(sel):sel;if(!el)return;tapAt(el);await dsleep(300);el.click()}
async function demo(){
 reset();demoOn=true;
 try{
  await dsleep(1400);
  await dtap('#connectBtn');await dsleep(2300);
  await dtap('#letsGo');await dsleep(3200);
  await dtap('[data-add="investments"]');await dsleep(1500);
  await dtap('#go1');await dsleep(1100);
  await dtap('#dates .op:nth-child(3)');await dsleep(700);
  await dtap('#amts .op:nth-child(3)');await dsleep(800);
  await dtap('#setGoal');await dsleep(5200);
  await dtap('.col[data-k="savings"] .tree');await dsleep(2600);
  $('#accScroll').scrollTo({top:330,behavior:'smooth'});await dsleep(1800);
  $('#accScroll').scrollTo({top:0,behavior:'smooth'});await dsleep(900);
  await dtap('#topBack');await dsleep(1200);
  await dtap('#toProj');await dsleep(1700);
  await dtap('#qm');await dsleep(2200);await dtap('#tipSheet .cta');await dsleep(800);
  await dtap('#calc');await dsleep(4200);
  $('#projScroll').scrollTo({top:380,behavior:'smooth'});await dsleep(2600);
  $('#projScroll').scrollTo({top:0,behavior:'smooth'});await dsleep(1200);
  await dtap('#topBack');await dsleep(2500);
  demo();
 }catch(e){}
}
function userAct(e){if(!e.isTrusted)return;if(demoOn){demoOn=false;RUN++;}clearTimeout(idleT);idleT=setTimeout(demo,12000)}
['pointerdown','wheel','touchstart'].forEach(ev=>phone.addEventListener(ev,userAct,{passive:true}));
$('#restart').onclick=()=>{clearTimeout(idleT);demo()};
let started=false;
new IntersectionObserver(es=>{if(es.some(x=>x.isIntersecting)&&!started){started=true;demo()}},{threshold:.35}).observe(phone);
reset();
</script>
</body>
