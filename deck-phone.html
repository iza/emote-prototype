<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck Link preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&display=swap" rel="stylesheet">
<style>
:root{--ease:cubic-bezier(.22,1,.36,1);--ink:#121331;--ink2:#4b4e6b;--mute:#7c7f99;--line:#dfe1ea;--soft:#f4f5f8;--navy:#0d0b2e;--ok:#29963B;--blue:#0097D5}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-optical-sizing:auto;font-feature-settings:'cv11','ss03';font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;background:#e9ebf3;overflow:hidden}
html.embed body{background:transparent}
#wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:380px;height:680px;flex:none;border-radius:24px;background:#fff;overflow:hidden;transform-origin:center;
  box-shadow:0 0 0 1px rgba(18,19,49,.06),0 24px 60px -18px rgba(18,19,49,.28)}
html.embed #stage{box-shadow:0 0 0 1px rgba(18,19,49,.06)}
.top{position:absolute;left:0;right:0;top:0;height:58px;display:flex;align-items:center;justify-content:center;z-index:5;background:#fff}
.top .bk,.top .x{position:absolute;top:19px;width:20px;height:20px;color:#a0a3b8;transition:opacity .35s var(--ease),transform .35s var(--ease)}
.top .bk.off{opacity:0;transform:translateX(4px)}
.top .bk{left:20px}.top .x{right:20px}
.top .lg svg{display:block;height:19px;width:auto}
.scr{position:absolute;inset:58px 0 0 0;padding:0 24px;opacity:0;transform:scale(1.015);filter:blur(6px);transition:opacity .55s var(--ease),transform .7s var(--ease),filter .55s var(--ease);pointer-events:none}
.scr.on{opacity:1;transform:none;filter:none;transition-delay:.12s}
.scr.out{opacity:0;transform:scale(.985);filter:blur(6px);transition-duration:.35s,.45s,.35s;transition-delay:0s}
.scr.on .st{animation:rise .7s var(--ease) both;animation-delay:calc(var(--i,0)*70ms + 120ms)}
@keyframes rise{from{opacity:0;transform:translateY(8px);filter:blur(2px)}to{opacity:1;transform:none;filter:none}}
.c{text-align:center}
.pair{display:flex;justify-content:center;margin:18px 0 22px}
.pair .a,.pair .b{width:56px;height:56px;border-radius:15px;overflow:hidden;display:grid;place-items:center;box-shadow:0 0 0 1px rgba(18,19,49,.1);background:#fff}
.pair .b{margin-left:10px}
.pair svg{width:56px;height:56px;display:block}
.pair .gr{background:#0e4d36;color:#fff;font-weight:600;font-size:24px;letter-spacing:-.04em;position:relative}
.gr i{position:absolute;right:12px;top:13px;width:8px;height:11px;border-radius:8px 0 8px 0;background:#59c57b;transform:rotate(-20deg)}
h2{font-size:21px;line-height:1.24;font-weight:600;letter-spacing:-.024em;text-wrap:balance;color:var(--ink)}
.sub{font-size:14px;line-height:21px;letter-spacing:-.006em;color:#6b6e89;margin-top:8px;text-wrap:balance}
.info{margin:30px 0 0;border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;text-align:left;background:#fff}
.info>div{display:flex;align-items:flex-start;gap:14px;padding:16px}
.info>div+div{border-top:1px solid #eceef3}
.info .ti{width:36px;height:36px;border-radius:10px;background:var(--soft);display:grid;place-items:center;flex:none}
.info .ti svg{width:18px;height:18px}
.info b{display:block;font-size:14px;font-weight:600;color:var(--ink);letter-spacing:-.012em;margin-bottom:4px}
.info p span{display:block;font-size:12.5px;line-height:18px;color:var(--mute)}
.legal{position:absolute;left:24px;right:24px;bottom:110px;text-align:center;font-size:12px;line-height:18px;color:#9a9db3}
.btn{display:inline-flex;align-items:center;justify-content:center;height:46px;padding:0 22px;border-radius:12px;background:var(--navy);color:#fff;font-size:14px;font-weight:500;letter-spacing:-.005em;transition:transform .25s var(--ease),background .4s var(--ease)}
.btn.dis{background:#cdd0dc;box-shadow:none}
.btn.press,.prov.press,.cb.press{transform:scale(.97)}
.dots{display:inline-flex;gap:5px}.dots i{width:5px;height:5px;border-radius:50%;background:#fff;animation:bl 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.3}40%{opacity:1}}
.bottom{position:absolute;left:0;right:0;bottom:28px;display:flex;flex-direction:column;align-items:center;gap:16px}
.cancel{font-size:14px;color:var(--ink)}
/* search */
.hd{font-size:21px;line-height:1.24;font-weight:600;letter-spacing:-.024em;text-align:center;margin:14px 0 20px}
.sbar{height:44px;border-radius:12px;background:var(--soft);box-shadow:inset 0 0 0 1px rgba(18,19,49,.04);display:flex;align-items:center;gap:10px;padding:0 14px;font-size:14px;letter-spacing:-.006em;color:#8a8da6}
.sbar .q{color:var(--ink)}
.caret{display:inline-block;width:1.5px;height:16px;background:var(--ink);vertical-align:-3px;margin-left:1px;animation:cb 1s steps(1) infinite}
@keyframes cb{50%{opacity:0}}
.list{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.prov{display:flex;align-items:center;gap:14px;height:62px;padding:0 14px;border:1px solid var(--line);border-radius:10px;transition:opacity .35s var(--ease),transform .35s var(--ease),background .3s,border-color .3s,max-height .45s var(--ease),padding .45s var(--ease),margin .45s var(--ease);max-height:62px;overflow:hidden}
.prov svg{width:40px;height:40px;border-radius:11px;flex:none;box-shadow:0 0 0 1px rgba(18,19,49,.08)}
.prov b{display:block;font-size:14px;line-height:18px;font-weight:500;letter-spacing:-.01em}.prov span{display:block;margin-top:3px;font-size:12.5px;line-height:17px;letter-spacing:-.003em;color:#7c7f99}
.prov.hide{opacity:0;max-height:0;height:0;padding-block:0;border-width:0;margin-top:-8px}
.prov.sel{background:#f2f8fd;border-color:#9fd2ee}
/* login */
.logo1{display:flex;justify-content:center;margin:18px 0 18px}.logo1 svg{width:48px;height:48px;border-radius:13px}
.fld{margin-top:16px;text-align:left}
#s2 .sub+.fld{margin-top:28px}
.fld label{display:block;font-size:13px;font-weight:500;letter-spacing:-.003em;color:var(--ink2);margin-bottom:7px}
.inp{height:44px;border:1px solid var(--line);border-radius:10px;background:#fafbfc;padding:0 12px;display:flex;align-items:center;font-size:14px;transition:border-color .3s var(--ease),box-shadow .3s var(--ease)}
.inp.f{border-color:#5d6080;box-shadow:0 0 0 4px rgba(13,11,46,.07);background:#fff}
.pw{letter-spacing:2px}
.or{display:flex;align-items:center;gap:12px;margin:24px 0 20px;font-size:12px;color:#a6a9be}.or::before,.or::after{content:"";flex:1;height:1px;background:#eceef3}
.ghost{display:flex;width:100%;height:46px;padding:0 20px;border:1px solid #c9cbd8;border-radius:12px;align-items:center;justify-content:center;font-size:14px;font-weight:500}
/* accounts */
.acc{animation:rise .55s var(--ease) both;animation-delay:calc(var(--i,0)*70ms);display:flex;align-items:center;gap:14px;height:66px;padding:0 14px;border:1px solid var(--line);border-radius:10px;transition:background .3s,border-color .3s,transform .35s var(--ease)}
.acc p{flex:1;min-width:0}
.acc .ai{width:40px;height:40px;border-radius:11px;background:var(--soft);display:grid;place-items:center;flex:none;box-shadow:0 0 0 1px rgba(18,19,49,.06);transition:background .3s}
.acc.on .ai{background:#e3f1fb}
.acc b{display:block;font-size:14px;line-height:18px;font-weight:500;font-variant-numeric:tabular-nums;font-feature-settings:'tnum','cv11','ss03';letter-spacing:.012em;color:var(--ink)}.acc p span{display:block;margin-top:3px;font-size:12.5px;line-height:17px;letter-spacing:-.003em;color:#7c7f99;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc.on{background:#f2f8fd;border-color:#9fd2ee}
.cb{width:20px;height:20px;border-radius:6px;border:1.5px solid #c3c6d4;display:grid;place-items:center;flex:none;transition:all .2s}
.acc.on .cb{background:#0097D5;border-color:#0097D5}
.cb svg{opacity:0;transition:opacity .2s}.acc.on .cb svg{opacity:1}
.skel{height:66px;border-radius:10px;background:linear-gradient(90deg,#f1f2f6 0,#f8f9fb 40%,#f1f2f6 80%);background-size:300% 100%;animation:sh 1.1s linear infinite}
@keyframes sh{to{background-position:-150% 0}}
.foot{position:absolute;left:0;right:0;bottom:0;padding:14px 24px 22px;background:#fff;box-shadow:0 -8px 20px -14px rgba(18,19,49,.25)}
.foot .btn{width:100%}
/* progress */
.mid{display:flex;flex-direction:column;align-items:center;margin-top:84px}
.mid .ic{position:relative;width:40px;height:40px;transition:transform .45s cubic-bezier(.3,1.5,.5,1)}
#pic::before{content:"";position:absolute;inset:0;border-radius:50%;background:rgba(18,19,49,.18);animation:halo 1.8s ease-out infinite}
#pic svg{position:relative}
@keyframes halo{from{transform:scale(1);opacity:.7}to{transform:scale(1.9);opacity:0}}
#okc{transform:scale(.4);opacity:0;transition:transform .6s cubic-bezier(.3,1.6,.5,1),opacity .3s}.done #okc{transform:none;opacity:1}
.mid .ic.pop{transform:scale(1.15)}
.pdots{display:flex;gap:8px;margin:18px 0 30px}.pdots i{width:6px;height:6px;border-radius:50%;background:#d8dae4;animation:wave 1.25s ease-in-out infinite;animation-delay:var(--d,0s)}
.pdots i.on{background:#121331;animation:none;transform:none;transition:background .3s}
@keyframes wave{0%,60%,100%{background:#d8dae4;transform:scale(1)}30%{background:#7c7f99;transform:scale(1.35)}}
.msg{transition:opacity .25s}
.ck{stroke-dasharray:20;stroke-dashoffset:20}
.done .ck{transition:stroke-dashoffset .5s .15s ease;stroke-dashoffset:0}
/* touch indicator */
#tap{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:rgba(255,255,255,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.9);box-shadow:0 0 0 1px rgba(13,11,46,.08),0 6px 18px -4px rgba(13,11,46,.35);z-index:9;opacity:0;transition:left .8s var(--ease),top .8s var(--ease),opacity .35s,transform .2s var(--ease);pointer-events:none}
#tap.show{opacity:1}#tap.down{transform:scale(.78)}
#tap::after{content:"";position:absolute;inset:-1px;border-radius:50%;border:1.5px solid rgba(13,11,46,.35);opacity:0}
#tap.down::after{animation:ring .5s var(--ease)}
@keyframes ring{from{opacity:.9;transform:scale(.8)}to{opacity:0;transform:scale(2.2)}}
@media (prefers-reduced-motion:reduce){.scr{transition:opacity .2s}}
html.embed #stage{box-shadow:none;border-radius:0}
.code{display:flex;gap:8px;justify-content:center;margin-top:30px}
.code i{width:42px;height:52px;border-radius:10px;border:1px solid var(--line);background:#fafbfc;display:grid;place-items:center;font-style:normal;font-size:20px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.code i.f{border-color:#5d6080;box-shadow:0 0 0 4px rgba(13,11,46,.07);background:#fff}
.resend{margin-top:18px;font-size:13px;color:#7c7f99}.resend b{color:var(--ink);font-weight:500}
.pair .a.cl-tile{background:#5b3fd6;box-shadow:none;color:#fff;font-weight:600;font-size:24px;letter-spacing:-.04em}
</style></head>
<body>
<div id="wrap"><div id="stage">
  <div class="top"><svg class="bk" viewBox="0 0 20 20" fill="none"><path d="M16 10H4m5-5-5 5 5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lg" data-i="deck"></span><svg class="x" viewBox="0 0 20 20" fill="none"><path d="M5 5l10 10M15 5 5 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></div>
  <section class="scr c" id="s0">
    <div class="pair" style="margin-top:30px"><div class="a cl-tile" id="ct">V</div><div class="b" data-i="deckmono"></div></div>
    <h2 data-t="c_h"></h2>
    <div class="info">
      <div><span class="ti" data-i="link"></span><p><b data-t="c_1"></b><span data-t="c_1s"></span></p></div>
      <div><span class="ti" data-i="shield"></span><p><b data-t="c_2"></b><span data-t="c_2s"></span></p></div>
    </div>
    <p class="legal" data-t="legal"></p>
    <div class="bottom"><span class="btn" style="width:calc(100% - 48px)" data-t="cont"></span><span class="cancel" data-t="cancel"></span></div>
  </section>
  <section class="scr" id="s1">
    <p class="hd" data-t="s_h"></p>
    <div class="sbar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#121331" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span class="q">Con Ed<i class="caret"></i></span></div>
    <div class="list" id="plist"></div>
  </section>
  <section class="scr c" id="s2">
    <div class="logo1" data-i="coned"></div>
    <h2 data-t="l_h"></h2>
    <p class="sub" data-t="l_s"></p>
    <div class="fld"><label data-t="login"></label><div class="inp">alex@company.com</div></div>
    <div class="fld"><label data-t="pass"></label><div class="inp pw">••••••••••</div></div>
    <div style="margin-top:26px"><span class="btn" style="width:100%" data-t="cont"></span></div>
    <div class="or" data-t="or"></div>
    <span class="ghost" data-t="upload"></span>
  </section>
  <section class="scr c" id="s6">
    <div class="logo1" data-i="coned"></div>
    <h2 data-t="m_h"></h2>
    <p class="sub" data-t="m_s"></p>
    <div class="code"><i>4</i><i>8</i><i>2</i><i>1</i><i class="f"><span class="caret"></span></i><i></i></div>
    <p class="resend" data-t="m_r"></p>
    <div class="bottom"><span class="btn dis" style="width:calc(100% - 48px)" data-t="cont"></span></div>
  </section>
  <section class="scr" id="s3">
    <div class="logo1" data-i="coned"></div>
    <h2 class="c" data-t="a_h"></h2>
    <p class="sub c" data-t="a_s"></p>
    <div class="list" id="alist" style="margin-top:18px"></div>
    <div class="foot"><span class="btn" data-t="a_b"></span></div>
  </section>
  <section class="scr c" id="s4">
    <div class="pair"><div class="a" data-i="deckmono"></div><div class="b" data-i="coned"></div></div>
    <div class="mid"><div class="ic" id="pic" data-i="lock"></div><div class="pdots" id="pd"></div>
      <div class="msg"><h2 data-t="p_h"></h2><p class="sub" data-t="p_s"></p></div></div>
  </section>
  <section class="scr c" id="s5">
    <div class="pair"><div class="a" data-i="deckmono"></div><div class="b" data-i="coned"></div></div>
    <div class="mid done"><div class="ic" id="okc" data-i="check"></div><div style="height:30px"></div>
      <h2 data-t="d_h"></h2><p class="sub" data-t="d_s"></p></div>
  </section>
</div></div>
<script src="deck-assets.js"></script>
<script>
(function(){
const d=document.documentElement;d.classList.add('embed');
document.querySelectorAll('[data-i]').forEach(e=>{e.innerHTML=ICONS[e.dataset.i]||''});
const $=id=>document.getElementById(id),stage=$('stage');
function fit(){const k=Math.min(innerWidth/380,innerHeight/680);stage.style.transform='scale('+k+')'}
addEventListener('resize',fit);fit();
const P=[['coned','Con Edison','Electricity, Gas'],['pge','Pacific Gas and Electric','Electricity, Gas'],['duke','Duke Energy','Electricity, Gas']];
$('plist').innerHTML=P.map((p,i)=>`<div class="prov${i==0?' sel':''}">${ICONS[p[0]]}<p><b>${p[1]}</b><span>${p[2]}</span></p></div>`).join('');
const A=[['987-6543-2109-87','9101 Pine Blvd, San Diego, CA',1],['987-6543-2109-88','678 Oak Ave, San Francisco, CA',1],['456-7890-1234-56','24 Elm St, Sacramento, CA',0]];
const ck='<svg width="11" height="9" viewBox="0 0 11 9" fill="none"><path d="M1 4.5 4 7.5 10 1.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
$('alist').innerHTML=A.map(a=>`<div class="acc${a[2]?' on':''}"><span class="ai"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5d6080" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span><p><b>${a[0]}</b><span>${a[1]}</span></p><span class="cb">${ck}</span></div>`).join('');
for(let i=0;i<8;i++){const x=document.createElement('i');if(i<5)x.className='on';$('pd').appendChild(x)}
const T={
en:{c_h:'{c} uses Deck<br>to connect your utility accounts',c_1:'Connect effortlessly',c_1s:'Deck lets you securely connect your utility account in seconds',c_2:'Keep your data safe',c_2s:'Deck uses best-in-class encryption to help protect your data',legal:'By selecting ‘Continue’ you agree<br>to the Deck End User Privacy Policy',cont:'Continue',cancel:'Cancel',s_h:'Select Utility Provider',l_h:'Log in to Con Edison',l_s:'Provide your login and password<br>to let Deck securely retrieve your data',login:'Login',pass:'Password',or:'or even better',upload:'Upload an invoice',m_h:'Enter verification code',m_s:'We sent a 6-digit code<br>to your phone ending in 4821',m_r:'Didn’t get it? <b>Resend code</b>',a_h:'Your accounts',a_s:'Deck will only access data from selected accounts',a_b:'Continue with 2 selected',p_h:'Accessing account',p_s:'Accessing and retrieving your data',d_h:'Connection complete',d_s:'Your data is synced and you’ll be<br>back to {c} soon'},
fr:{c_h:'{c} utilise Deck<br>pour connecter vos comptes',c_1:'Connexion sans effort',c_1s:'Deck connecte votre compte fournisseur en toute sécurité, en quelques secondes',c_2:'Vos données protégées',c_2s:'Deck utilise un chiffrement de premier ordre pour protéger vos données',legal:'En sélectionnant « Continuer », vous acceptez<br>la politique de confidentialité de Deck',cont:'Continuer',cancel:'Annuler',s_h:'Choisissez votre fournisseur',l_h:'Connexion à Con Edison',l_s:'Saisissez votre identifiant et mot de passe<br>pour que Deck récupère vos données',login:'Identifiant',pass:'Mot de passe',or:'ou encore mieux',upload:'Importer une facture',m_h:'Code de vérification',m_s:'Nous avons envoyé un code à 6 chiffres<br>au numéro se terminant par 4821',m_r:'Pas reçu ? <b>Renvoyer le code</b>',a_h:'Vos comptes',a_s:'Deck n’accède qu’aux comptes sélectionnés',a_b:'Continuer avec 2 comptes',p_h:'Accès au compte',p_s:'Récupération de vos données',d_h:'Connexion réussie',d_s:'Vos données sont synchronisées,<br>retour à {c} dans un instant'},
de:{c_h:'{c} nutzt Deck,<br>um Ihre Konten zu verbinden',c_1:'Mühelos verbinden',c_1s:'Deck verbindet Ihr Versorgerkonto sicher in Sekunden',c_2:'Ihre Daten bleiben sicher',c_2s:'Deck schützt Ihre Daten mit erstklassiger Verschlüsselung',legal:'Mit „Weiter“ akzeptieren Sie<br>die Datenschutzrichtlinie von Deck',cont:'Weiter',cancel:'Abbrechen',s_h:'Versorger auswählen',l_h:'Bei Con Edison anmelden',l_s:'Geben Sie Login und Passwort ein,<br>damit Deck Ihre Daten sicher abruft',login:'Login',pass:'Passwort',or:'oder noch besser',upload:'Rechnung hochladen',m_h:'Bestätigungscode eingeben',m_s:'Wir haben einen 6-stelligen Code<br>an Ihre Nummer mit 4821 gesendet',m_r:'Keinen Code erhalten? <b>Erneut senden</b>',a_h:'Ihre Konten',a_s:'Deck greift nur auf ausgewählte Konten zu',a_b:'Mit 2 Konten fortfahren',p_h:'Konto wird geöffnet',p_s:'Ihre Daten werden abgerufen',d_h:'Verbindung hergestellt',d_s:'Ihre Daten sind synchronisiert,<br>gleich geht es zurück zu {c}'}};
let lang='en',client='Verdant',cur=null;
function apply(){const t=T[lang];document.querySelectorAll('[data-t]').forEach(e=>{e.innerHTML=(t[e.dataset.t]||'').replace(/\{c\}/g,client)});$('ct').textContent=client[0]}
function show(id){const n=$(id);if(!n||n===cur)return;if(cur){cur.classList.remove('on');cur.classList.add('out');const o=cur;setTimeout(()=>o.classList.remove('out'),400)}n.classList.add('on');cur=n;document.querySelector('.top .bk').classList.toggle('off',['s0','s4','s5'].includes(id))}
function textSwap(){const live=document.querySelector('.scr.on');if(!live){apply();return}live.style.transition='opacity .25s';live.style.opacity=0;setTimeout(()=>{apply();live.style.opacity='';setTimeout(()=>live.style.transition='',300)},250)}
addEventListener('message',e=>{const m=e.data||{};if(m.lang&&m.lang!==lang){lang=m.lang;textSwap()}if(m.client){client=m.client;apply()}if(m.screen)show(m.screen)});
const q=new URLSearchParams(location.search);if(q.get('lang'))lang=q.get('lang');apply();show(q.get('screen')||'s0');
})();
</script>
</body></html>
