function match(t){
 for(const k in F){const s=F[k];if(!s.size)continue;
  const ok={g:()=>s.has(t.g),age:()=>s.has(band(t.age,'age')),exp:()=>s.has(band(t.exp,'exp')),lang:()=>t.l.some(x=>s.has(x)),com:()=>t.com.some(x=>s.has(x)),
   a:()=>s.has(t.a),top:()=>t.top.some(x=>s.has(x)),price:()=>s.has(band(t.price,'price')),today:()=>!!t.today,intro:()=>!!t.intro}[k]();
  if(!ok)return false}
 if(q){const hay=(t.n+' '+A[t.a][0]+' '+t.top.join(' ')+' '+t.t).toLowerCase();if(!q.split(/\s+/).every(w=>hay.includes(w)))return false}
 return true}
function toggle(k,v){F[k]=F[k]||new Set();F[k].has(v)?F[k].delete(v):F[k].add(v);sync()}
function drawGroups(){$('#groups').innerHTML=G[tab].map(g=>`<div class="grp"><h3>${g.h}</h3>${g.p?`<p>${g.p}</p>`:''}<div class="opts">${g.o.map(v=>`<button class="opt" data-k="${g.k}" data-v="${v}" aria-pressed="${on(g.k,v)}">${g.k==='a'?`<i style="background:${A[v][1]}"></i>`:''}${label(g.k,v)}</button>`).join('')}</div></div>`).join('');
 $$('#groups .opt').forEach(b=>b.onclick=()=>toggle(b.dataset.k,b.dataset.v))}
$$('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;$$('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));drawGroups()});
$('#quick').innerHTML=QUICK.map(([k,v])=>`<button class="chip" data-k="${k}" data-v="${v}" aria-pressed="false">${v}</button>`).join('');
$$('#quick .chip').forEach(b=>b.onclick=()=>toggle(b.dataset.k,b.dataset.v));
// cards
function cardHTML(t){const a=A[t.a];return `<article class="card" data-v="${t.v}"><div class="ph" style="background-image:url(${t.v}.jpg)"><video muted playsinline loop preload="none" data-src="${t.v}.mp4" aria-label="Intro video from ${t.n}"></video><span class="pb">${PLAY}</span></div>
<div class="tw"><div class="tg" style="background:${a[1]}">${t.t}</div><div class="pl"><span class="ap" style="background:${a[2]}">${a[0]}${IC.info}</span>${t.intro?'<span class="ib">Intro call</span>':''}</div></div>
<div class="bd"><div class="nm">${t.n}<span>${IC.verified}${IC.message}</span></div><div class="rg">${t.reg}${IC.info}</div>
<div class="mt"><div class="two"><span>Age: ${t.age}</span><span>Gender: ${t.g}</span></div><div>Speaks: ${t.l.join(', ')}</div><div>Experience: ${t.exp} years</div></div><button class="lk" data-toast="Opens ${t.n.split(' ')[0]}’s full profile">See profile</button></div>
<div class="sl"><div style="flex:1"><div class="am"><b>£${t.price}</b><i>per session</i></div><button class="lk" style="height:28px" data-toast="Shows concession rates">Concessions available</button></div><button class="bk" data-toast="${t.today?'Opens today’s free times':'Opens the next free times'} with ${t.n.split(' ')[0]}">Book now</button></div></article>`}
$('#grid').innerHTML=T.map(cardHTML).join('');
const cards=$$('.card');
const hov=matchMedia('(hover:hover)').matches;
const V=c=>c.querySelector('video');
function play(c){cards.forEach(o=>o!==c&&stop(o));const v=V(c);if(!v.getAttribute('src'))v.src=v.dataset.src;v.muted=true;c.classList.add('on');const p=v.play();p&&p.catch(()=>{})}
function stop(c){c.classList.remove('on');V(c).pause()}
cards.forEach(c=>{if(hov){c.addEventListener('mouseenter',()=>play(c));c.addEventListener('mouseleave',()=>stop(c))}
 c.querySelector('.ph').addEventListener('click',()=>{if(hov)return;c.classList.contains('on')?stop(c):play(c)})});
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1800)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-toast]');if(b)toast(b.dataset.toast)});
function sync(){
 const sort=$('#sort').value;const list=T.map((t,i)=>({t,i,c:cards[i]}));
 if(sort==='low')list.sort((x,y)=>x.t.price-y.t.price);else if(sort==='high')list.sort((x,y)=>y.t.price-x.t.price);else if(sort==='exp')list.sort((x,y)=>y.t.exp-x.t.exp);
 let n=0;list.forEach(({t,c})=>{$('#grid').appendChild(c);const ok=match(t);c.classList.toggle('out',!ok);if(ok)n++;else stop(c)});
 $('#count').textContent=n;$('#empty').classList.toggle('on',n===0);
 $$('#quick .chip').forEach(b=>b.setAttribute('aria-pressed',on(b.dataset.k,b.dataset.v)));
 $$('#groups .opt').forEach(b=>b.setAttribute('aria-pressed',on(b.dataset.k,b.dataset.v)));
 const act=[];for(const k in F)F[k].forEach(v=>act.push([k,v]));
 $('#active').innerHTML=act.map(([k,v])=>`<button data-k="${k}" data-v="${v}" aria-label="Remove ${label(k,v)}">${label(k,v)}${IC.x}</button>`).join('');
 $$('#active button').forEach(b=>b.onclick=()=>toggle(b.dataset.k,b.dataset.v));
 $('#done').textContent=`Show ${n} therapist${n===1?'':'s'}`}
function clearAll(){for(const k in F)delete F[k];q='';$('#q').value='';sync()}
$('#clear').onclick=clearAll;$('#clear2').onclick=clearAll;$('#sort').onchange=sync;
$('#q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();sync()});$('#go').onclick=()=>{q=$('#q').value.trim().toLowerCase();sync()};
$('#fbtn').onclick=()=>document.body.classList.add('sheet');$('#done').onclick=()=>document.body.classList.remove('sheet');
// layout: scale the desktop page to the frame, or switch to the phone layout
function fit(){const W=innerWidth,H=innerHeight,m=W<640;document.body.classList.toggle('m',m);const st=$('#stage');
 if(!m){const s=W/1280;st.style.transform=`scale(${s})`;st.style.height=(H/s)+'px';const cw=(1280-300-48-40)/3;cards.forEach(c=>c.style.zoom=cw/360)}
 else{st.style.height='';const z=Math.min(1,(W-28)/360);cards.forEach(c=>c.style.zoom=z)}}
if(new URLSearchParams(location.search).has('full'))document.documentElement.classList.add('full');
$('#fsBtn').onclick=()=>{window.open(location.href.split('?')[0]+'?full','_blank','noopener')};
addEventListener('resize',fit);fit();drawGroups();sync();
</script></body></html>
