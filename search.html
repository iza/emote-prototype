:root{--n0:#fff;--n50:#fbf9f8;--n100:#f6f5f4;--n200:#ecebe9;--n300:#dcdad7;--n500:#a3a3a3;--n600:#525252;--n700:#404040;--n800:#262626;--lime:#bfd961;--lime2:#e9f2c8;--blue:#3b5fbb}
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:var(--n0)}
body{font-family:P,system-ui,sans-serif;color:var(--n800);-webkit-font-smoothing:antialiased;font-size:14px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:16px;height:16px;flex:none}
#stage{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;display:flex;flex-direction:column;background:var(--n0)}
/* top: search */
.top{flex:none;display:flex;flex-direction:column;align-items:center;gap:14px;padding:28px 24px 22px;border-bottom:1px solid var(--n200)}
.top h1{font-size:20px;line-height:28px;font-weight:500;letter-spacing:-.2px}
.sbar{width:560px;max-width:100%;height:44px;display:flex;align-items:center;gap:8px;padding:0 6px 0 14px;border-radius:999px;background:var(--n100)}
.sbar input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:14px;outline:none;color:var(--n800)}
.sbar .go{height:32px;padding:0 16px;border-radius:999px;background:var(--lime);font-size:13px}
.quick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{height:32px;padding:0 14px;border-radius:999px;border:1px solid #9fc5cf;font-size:13px;line-height:30px;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.chip[aria-pressed="true"]{background:#2e6d80;border-color:#2e6d80;color:#fff}
/* body */
.main{flex:1;min-height:0;display:flex;background:var(--n50)}
.panel{flex:none;width:300px;overflow-y:auto;padding:20px 20px 24px;border-right:1px solid var(--n200);background:var(--n0);scrollbar-width:thin}
.panel h2{font-size:16px;line-height:24px;font-weight:500;margin-bottom:12px}
.tabs{display:flex;padding:3px;border-radius:10px;background:var(--n100);margin-bottom:18px}
.tabs button{flex:1 1 auto;height:30px;padding:0 8px;border-radius:8px;font-size:12px;white-space:nowrap;color:var(--n600)}
.tabs button[aria-selected="true"]{background:#fff;color:var(--n800);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.grp{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.grp h3{font-size:13px;line-height:20px;font-weight:500}
.grp p{font-size:11px;line-height:16px;color:var(--n600);margin-top:-6px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--n300);font-size:12px;line-height:26px;white-space:nowrap;transition:background .15s,border-color .15s}
.opt[aria-pressed="true"]{background:var(--n200);border-color:var(--n500)}
.opt i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0}
.clear{height:32px;padding:0 14px;border-radius:999px;border:1px solid var(--n300);font-size:12px;margin-top:4px}
.res{flex:1;min-width:0;display:flex;flex-direction:column}
.bar{flex:none;display:flex;align-items:center;gap:10px;padding:16px 24px 12px;font-size:13px}
.bar b{font-weight:500}
.bar .sort{margin-left:auto;display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--n300);border-radius:8px;font-size:12px;background:#fff}
.bar .sort select{border:0;background:none;font:inherit;outline:none;cursor:pointer}
.active{display:flex;gap:6px;flex-wrap:wrap}
.active button{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 6px 0 10px;border-radius:999px;background:var(--n800);color:#fff;font-size:11px}
.active button svg{width:14px;height:14px}.active button svg path{stroke:#fff}
.gridw{flex:1;min-height:0;overflow-y:auto;padding:4px 24px 28px;scrollbar-width:thin}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.empty{display:none;flex-direction:column;align-items:center;gap:10px;padding:80px 20px;text-align:center;color:var(--n600)}
.empty b{color:var(--n800);font-weight:500;font-size:16px}
.empty.on{display:flex}
/* card (emoteCare TherapistCard, zoomed to fit its column) */
.card{width:360px;height:682px;border-radius:16px;overflow:hidden;background:#fff;display:flex;flex-direction:column;position:relative;box-shadow:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -1px rgba(0,0,0,.06);transition:opacity .25s}
.card.out{display:none}
.ph{height:360px;flex:none;position:relative;background:#e9e6e1 center/cover;cursor:pointer}
.ph video{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
.card.on .ph video{opacity:1}
.pb{position:absolute;left:calc(50% + 6px);top:calc(50% - 16px);transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:rgba(38,38,38,.3);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;transition:opacity .25s;pointer-events:none}
.pb svg{width:20px;height:24px;margin-left:4px}.card.on .pb{opacity:0}
.tw{margin-top:-31px;padding:0 12px;display:flex;flex-direction:column;gap:6px;position:relative}
.tg{border-radius:12px;padding:8px 12px;font-size:14px;line-height:24px;font-weight:500}
.pl{display:flex;gap:6px}.ap{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:8px;font-size:12px;line-height:20px}
.ib{display:inline-flex;align-items:center;height:28px;padding:0 8px;border-radius:8px;background:var(--n100);font-size:12px;line-height:20px}
.bd{padding:16px 24px 0;display:flex;flex-direction:column}
.nm{display:flex;align-items:center;gap:8px;font-size:18px;line-height:28px;font-weight:500;letter-spacing:-.18px}.nm span{display:flex;gap:4px}.nm svg{width:20px;height:20px}
.rg{display:flex;align-items:center;gap:4px;font-size:12px;line-height:20px;font-weight:500;color:var(--blue)}
.mt{font-size:12px;line-height:20px;color:var(--n700);margin-top:4px}.two{display:flex;gap:12px}
.lk{height:32px;display:inline-flex;align-items:center;font-size:12px;line-height:16px;color:var(--blue);text-decoration:underline;text-underline-offset:2px;align-self:flex-start}
.sl{margin-top:auto;display:flex;align-items:flex-end;gap:8px;padding:8px 24px 24px}.am{display:flex;align-items:center;gap:4px}.am b{font-size:18px;line-height:28px;font-weight:500}.am i{font-style:normal;font-size:12px;line-height:20px;color:var(--n600)}
.bk{height:40px;padding:0 16px;min-width:112px;border-radius:999px;background:var(--n800);color:#fff;font-size:14px;line-height:40px;text-align:center}
.toast{position:absolute;left:50%;bottom:20px;transform:translate(-50%,20px);opacity:0;background:var(--n800);color:#fff;font-size:12px;padding:8px 14px;border-radius:10px;transition:all .25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.fbtn{display:none}
/* phone layout: native size, filters in a sheet */
body.m{overflow:hidden}
body.m #stage{position:static;width:100%;height:100%;transform:none}
body.m .top{padding:16px 14px 12px;gap:10px}body.m .top h1{font-size:16px}
body.m .quick{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;width:100%;scrollbar-width:none;padding-bottom:2px}
body.m .panel{position:absolute;left:0;right:0;bottom:0;top:30%;width:auto;z-index:10;border-radius:16px 16px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.18);transform:translateY(105%);transition:transform .3s ease}
body.m.sheet .panel{transform:none}
body.m .fbtn{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--n300);background:#fff;font-size:12px}

function fit(){const W=innerWidth,H=innerHeight,m=W<640;document.body.classList.toggle('m',m);const st=$('#stage');
 if(!m){const s=W/1280;st.style.transform=`scale(${s})`;st.style.height=(H/s)+'px';const cw=(1280-300-48-40)/3;cards.forEach(c=>c.style.zoom=cw/360)}
 else{st.style.height='';const z=Math.min(1,(W-28)/360);cards.forEach(c=>c.style.zoom=z)}}
addEventListener('resize',fit);fit();drawGroups();sync();
</script></body></html>
