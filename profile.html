<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>emoteCare Therapist Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --page:#faf9f6;
  --n0:#fff; --n50:#fbf9f8; --n100:#f6f5f4; --n200:#e5e5e5; --n300:#d4d4d4; --n500:#737373; --n600:#525252; --n700:#404040; --n800:#262626; --n900:#171717;
  --o10:rgba(38,38,38,.1); --o20:rgba(38,38,38,.2);
  --p200:#e9f2c8; --p950:#576721;
  --c400:#a9dfea; --c800:#3f8ca4; --def:#bfe7f0;
  --blue700:#3b5fbb;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--page);font-family:Poppins,system-ui,sans-serif;color:var(--n800);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;gap:12px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
button:focus-visible{outline:2px solid var(--n800);outline-offset:2px}
.phone{position:relative;width:390px;height:min(812px,100dvh);overflow:hidden;border-radius:28px;box-shadow:0 20px 60px rgba(23,23,23,.12),0 0 0 1px rgba(23,23,23,.06);background:#fff}
.restart{font-size:12px;line-height:20px;color:var(--n600);text-decoration:underline;text-underline-offset:3px}
@media (max-width:430px),(max-height:700px){
  body{gap:0}
  .phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}
  .restart{display:none}
}
html.embed,html.embed body{background:transparent}
html.embed body{min-height:0;height:812px;gap:0}
html.embed .phone{height:812px;box-shadow:none}
html.embed .restart{display:none}

.scroll{position:absolute;inset:0 0 var(--cta-h,100px) 0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

/* header */
.hero{background:var(--c400);padding:16px 16px 0}
.hero p{font-size:18px;line-height:28px;font-weight:500;letter-spacing:-.18px;color:var(--c800)}
.hero-row{background:var(--c400);height:72px;padding:16px;display:flex;justify-content:space-between;align-items:flex-start}
.avatar{width:88px;height:88px;border-radius:8px;overflow:hidden;flex-shrink:0;position:relative;z-index:1}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block}
.hero-btns{display:flex;gap:8px;height:40px;align-items:center}
.circle{width:38px;height:38px;border-radius:9999px;border:1px solid var(--o20);display:flex;align-items:center;justify-content:center}
.circle svg{width:16px;height:16px}
.spacer{height:48px}
.name-row{display:flex;align-items:center;gap:8px;padding:0 16px 0 24px}
.name-row h1{font-size:18px;line-height:28px;font-weight:500;letter-spacing:-.18px}
.icon-btn{display:flex;position:relative}
.icon-btn svg{width:20px;height:20px}

/* tabs */
.tabs{position:sticky;top:0;z-index:5;background:#fff;padding:8px 16px;display:flex;gap:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs.stuck{box-shadow:0 1px 0 var(--n200)}
.tab{height:30px;padding:3px 11px;border-radius:32px;font-size:13px;line-height:20px;color:var(--n700);white-space:nowrap;flex-shrink:0;transition:background .15s ease}
.tab[aria-selected="true"]{background:var(--n100)}

/* sections */
.sections{display:flex;flex-direction:column;gap:16px;padding:8px 16px 32px}
.panel{display:none;flex-direction:column;gap:16px}
.panel.on{display:flex;animation:fade .2s ease-out both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{background:var(--n50);border:1px solid var(--n100);border-radius:12px;padding:16px 16px 32px;display:flex;flex-direction:column;gap:16px}
.card h2{font-size:14px;line-height:24px;font-weight:500;color:var(--n800)}
.card.tight{gap:0}
.faq-card{padding-bottom:16px;gap:4px}
.p14{font-size:14px;line-height:24px;color:var(--n800)}
.row{display:flex;gap:8px;align-items:flex-start}
.row .ic{padding:4px;display:flex;flex-shrink:0}
.row .ic svg{width:20px;height:20px}
.row .tx{flex:1;display:flex;flex-direction:column;gap:4px;font-size:14px;line-height:24px}
.row .tx b{font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;height:28px;padding:0 8px;border-radius:8px;background:var(--p200);color:var(--p950);font-size:14px;line-height:24px;white-space:nowrap}
.item{display:flex;flex-direction:column}
.item b{font-size:14px;line-height:24px;font-weight:500}
.items{display:flex;flex-direction:column;gap:16px}
.qbtn{display:inline-flex;vertical-align:middle;margin-left:2px;padding:4px;border-radius:96px}
.qbtn svg{width:16px;height:16px}

/* video */
.video{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#ddd}
.video img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block}
.video:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 71%,rgba(0,0,0,.3) 85%);pointer-events:none}
.vplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1;width:64px;height:64px;border-radius:50%;background:rgba(38,38,38,.3);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;transition:transform .15s ease}
.vplay:active{transform:translate(-50%,-50%) scale(.94)}
.vplay svg{width:18px;height:20px;margin-left:3px}
.vnote{position:absolute;inset:0;z-index:2;background:rgba(23,23,23,.72);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s ease}
.vnote.show{opacity:1;pointer-events:auto}
.vnote p{font-size:16px;line-height:26px;font-weight:500}
.vclose{height:36px;padding:0 16px;border-radius:9999px;background:#fff;color:var(--n800);font-size:14px;line-height:24px}

/* how I work */
.def{background:var(--def);border-radius:12px;padding:16px;display:flex;flex-direction:column}
.def h3{font-size:14px;line-height:24px;font-weight:500}
.quad-wrap{display:grid;grid-template-columns:20px 1fr 20px;align-items:center;justify-items:center;gap:6px;padding-top:16px}
.axis{display:flex;align-items:center;gap:4px;font-size:14px;line-height:24px;font-weight:500}
.axis svg{width:16px;height:16px}
.axis.v{writing-mode:vertical-rl;transform:rotate(180deg)}
.axis.v.r{transform:none}
.quad{position:relative;width:100%;aspect-ratio:1;background:#fff;border:1px solid var(--n200);border-radius:8px;overflow:hidden}
.quad:before,.quad:after{content:"";position:absolute;background:var(--n300)}
.quad:before{left:50%;top:0;bottom:0;width:1px}
.quad:after{top:50%;left:0;right:0;height:1px}
.quad .pin{position:absolute;left:65%;top:40%;width:40px;height:40px;margin:-40px 0 0 -20px}
.quad .pin svg{width:40px;height:40px;display:block}

/* faq */
.faq{background:var(--n50);border:1px solid var(--n100);border-radius:12px}
.faq-q{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px;font-size:14px;line-height:24px;font-weight:500}
.faq-q svg{width:20px;height:20px;flex-shrink:0;transition:transform .2s ease}
.faq.open .faq-q svg{transform:rotate(180deg)}
.faq-a{display:none;padding:0 16px 16px;font-size:14px;line-height:24px}
.faq.open .faq-a{display:block}
.banner{position:relative;overflow:hidden;height:78px;border-radius:12px;background:var(--blue700);color:#fff;display:flex;align-items:center;padding:12px 16px;width:100%}
.banner span{display:flex;flex-direction:column;position:relative;z-index:1}
.banner b{font-size:16px;line-height:28px;font-weight:500}
.banner small{font-size:14px;line-height:24px}
.banner img{position:absolute;right:0;top:0;height:78px;width:112px}

/* sticky CTA */
.cta{position:absolute;left:0;right:0;bottom:0;z-index:10;background:#fff;border-top:1px solid var(--n200);padding:12px 16px 8px;display:flex;flex-direction:column;gap:8px}
.cta .top{display:flex;align-items:center;gap:8px}
.cta .price{flex:1;display:flex;flex-direction:column;gap:4px}
.cta .amt{display:flex;align-items:flex-end;gap:4px}
.cta .amt b{font-size:18px;line-height:28px;font-weight:500;letter-spacing:-.18px}
.cta .amt span{font-size:14px;line-height:24px;color:var(--n600)}
.cta .next{font-size:12px;line-height:20px}
.book{height:40px;width:126px;border-radius:9999px;background:var(--n800);color:#fff;font-size:14px;line-height:24px;text-align:center}
.cancel{font-size:11px;line-height:16px;color:var(--n500);text-align:center}

/* tooltip + toast */
.tip{position:absolute;z-index:30;max-width:240px;background:var(--n900);color:#fff;font-size:12px;line-height:18px;padding:8px 10px;border-radius:8px;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .15s ease,transform .15s ease}
.tip.show{opacity:1;transform:none}
.toast{position:absolute;left:16px;right:16px;bottom:116px;z-index:50;background:var(--n900);color:#fff;font-size:14px;line-height:22px;padding:12px 16px;border-radius:12px;opacity:0;transform:translateY(8px);transition:opacity .2s ease,transform .2s ease;pointer-events:none}
.toast.show{opacity:1;transform:none}

/* booking flow screens */
.screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;background:#fff;opacity:0;visibility:hidden;transition:opacity .22s ease,visibility 0s linear .22s}
.screen.on{opacity:1;visibility:visible;transition:opacity .22s ease,visibility 0s}
.bk-top{background:#bfe7f0;padding:24px 24px 8px;display:flex;flex-direction:column;gap:8px;flex-shrink:0}
.bk-top .av{width:88px;height:88px;border-radius:8px;overflow:hidden}
.bk-top .av img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block}
.bk-top p{font-size:14px;line-height:24px}
.bk-top p b{font-weight:500;display:block}
.bk-body{flex:1;overflow-y:auto;scrollbar-width:none;padding:8px 0 40px;display:flex;flex-direction:column;gap:24px}
.bk-body::-webkit-scrollbar{display:none}
.bk-back{margin-left:8px;width:40px;height:40px;border-radius:96px;display:flex;align-items:center;justify-content:center}
.bk-back svg{width:20px;height:20px}
.bk-main{display:flex;flex-direction:column;gap:16px}
.bk-title{padding:0 24px;font-size:20px;line-height:32px;font-weight:500;letter-spacing:-.2px}
.cal{padding:8px 0 24px;display:flex;flex-direction:column;gap:16px}
.cal .month{padding:0 24px;font-size:14px;line-height:24px}
.cal .rows{display:flex;flex-direction:column;gap:24px}
.days{display:flex;gap:8px;overflow-x:auto;padding:0 24px;scrollbar-width:none;scroll-padding:0 24px}
.days::-webkit-scrollbar,.times::-webkit-scrollbar{display:none}
.day{flex-shrink:0;width:56px;padding:8px;border:1px solid #a3a3a3;border-radius:8px;background:#fff;color:#525252;display:flex;flex-direction:column;align-items:center;text-align:center;transition:background .15s ease,color .15s ease,border-color .15s ease}
.day small{font-size:12px;line-height:20px}
.day b{font-size:18px;line-height:28px;font-weight:500;letter-spacing:-.18px}
.day[aria-pressed="true"]{background:#262626;border-color:#262626;color:#fff}
.day[aria-pressed="true"] small{color:#d4d4d4}
.day:disabled{border-color:var(--o10);color:#a3a3a3;cursor:default}
.day:disabled b{font-size:16px;font-weight:400;letter-spacing:0;text-decoration:line-through}
.slots{display:flex;flex-direction:column;justify-content:center;gap:12px;min-height:72px}
.times{display:flex;gap:8px;overflow-x:auto;padding:1px 24px;scrollbar-width:none}
.time{flex-shrink:0;height:38px;padding:0 16px;border:1px solid var(--o20);border-radius:9999px;font-size:14px;line-height:24px;color:var(--n800);transition:background .15s ease,border-color .15s ease}
.time[aria-pressed="true"]{background:#262626;border-color:#262626;color:#fff}
.tz{padding:0 24px;font-size:12px;line-height:20px;color:#525252}
.repeat{padding-left:24px;display:flex;gap:12px;align-items:flex-start}
.repeat b{display:block;font-size:14px;line-height:24px;font-weight:500}
.repeat small{display:block;font-size:12px;line-height:20px;color:var(--n700)}
.switch{flex-shrink:0;width:44px;height:24px;border-radius:9999px;padding:2px;background:var(--o20);display:flex;align-items:center;transition:background .2s ease}
.switch .knob{width:20px;height:20px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;transition:transform .2s ease}
.switch .knob svg{width:16px;height:16px}
.switch[aria-checked="true"]{background:var(--n900)}
.switch[aria-checked="true"] .knob{transform:translateX(20px)}
.switch .ck{display:none}.switch[aria-checked="true"] .ck{display:block}.switch[aria-checked="true"] .xx{display:none}
.bk-cta{flex-shrink:0;padding:12px 24px 32px;display:flex;flex-direction:column;gap:12px;background:#fff}
.btn-primary{height:40px;width:100%;border-radius:9999px;background:var(--n800);color:#fff;font-size:14px;line-height:24px;text-align:center;transition:opacity .15s ease}
.btn-primary[aria-disabled="true"]{opacity:.35;cursor:default}
.bk-cta p{font-size:12px;line-height:20px;color:#525252;text-align:center}

/* confirm and pay */
.sum{margin:0 24px;border-top:1px solid var(--n200)}
.sum-row{border-bottom:1px solid var(--n200);padding:12px 0;font-size:14px;line-height:24px}
.sum-row span{color:var(--n600)}
.sum-row b{font-weight:500}
.btn-apple{height:38px;width:100%;border-radius:9999px;border:1px solid var(--o20);display:flex;align-items:center;justify-content:center}
.btn-apple svg{width:49px;height:20px}

/* success */
#success{background:#fff;padding:40px 16px;justify-content:flex-start}
.ok-card{padding:80px 24px;display:flex;flex-direction:column}
.ok-inner{height:501px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:80px;text-align:center}
.ok-text{display:flex;flex-direction:column;align-items:center;gap:8px}
.ok-text svg{width:120px;height:120px}
.ok-text h2{font-size:20px;line-height:32px;font-weight:500;letter-spacing:-.2px;color:var(--n800)}
.ok-text p{font-size:14px;line-height:24px;color:var(--n600)}
.ok-btns{width:200px;display:flex;flex-direction:column;gap:16px}
.btn-outline{height:38px;width:100%;border-radius:9999px;border:1px solid var(--o20);font-size:14px;line-height:24px;text-align:center}
</style>
</head>

const T={
  name:'Christopher Wellington', first:'Christopher',
  tagline:'A grounded therapist to help you gently navigate life’s ups and downs.',
  who:[
    ['user',[['Gender:','Male'],['Age:','36'],['Sexuality:','Straight'],['','Person of colour']]],
    ['flag',[['Ethnicity:','English'],['Speaks:','English, Portuguese'],['Location:','England']]],
    ['briefcase',[['Qualification:','Counsellor'],['Professional experience:','8 years'],['Professional membership:','British Association for Counselling and Psychotherapy (BACP)','member']]]
  ],
  about:"I'm a BACP-registered counsellor with eight years' experience working with adults. People often come to me when anxiety, low mood or stress has started to shape their days. I offer a calm, practical space where we can make sense of what's going on and find changes that feel manageable.",
  communities:['Christian','LGBTQIA+','Neurodiverse'],
  values:[['Honesty',"I'll be open about what I notice, and about what therapy can and can't help with."],['Curiosity',"Everyone's story is different. I want to understand yours, without fitting it into a box."],['Steadiness',"Change takes time. I'll stay consistent and supportive through the harder moments."]],
  approach:['Cognitive behavioural therapy','By focusing on your thoughts and behaviours, CBT helps you change your relationship with unwanted thoughts and patterns. By building awareness and learning practical coping skills, it helps you become your own therapist.'],
  reason:"I trained in CBT because it gives people tools they can use straight away. It's structured and collaborative: we agree goals together, track progress and adjust as we go.",
  modalities:[['Cognitive restructuring','Noticing unhelpful thoughts, testing them against the evidence and finding more balanced alternatives.'],['Behavioural activation','Planning small, achievable activities that rebuild energy and motivation when mood is low.'],['Graded exposure','Facing anxious situations step by step, at a pace we agree, so they lose their hold over time.']],
  main:[['Anxiety',"Worry, panic and social anxiety. We'll look at what keeps anxiety going and practise responding differently."],['Stress and burnout',"When work or life feels relentless. We'll name the pressures, set boundaries and build routines that protect your energy."],['Sleep','Trouble falling or staying asleep. CBT for insomnia targets the habits and thoughts that get in the way of rest.']],
  other:['Depression','Low confidence','Panic attacks','Self-esteem','Anger management'],
  notFit:"I'm not the best fit if you're looking for long-term, open-ended exploration of the past, or support with complex trauma or an eating disorder. I'm happy to point you to therapists on emoteCare who specialise in that work.",
  faqs:[
    ['What will our first session be like?',"Our first session is a chance to get to know each other. I'll ask what's brought you to therapy and what you'd like to change, and explain how CBT works. By the end, we'll agree whether to work together and what the next few sessions could look like."],
    ['How do I get the most out of working with you?',"Come with a rough idea of what you'd like to work on, and try the small tasks we agree between sessions. Most progress happens in everyday life, between our conversations."],
    ['What do you enjoy most about being a therapist?',"Seeing someone realise they're coping with something that once felt impossible. Those moments make the work worthwhile."],
    ['Do you have personal or lived mental health experience?',"Yes. I've had my own experience of anxiety, and therapy helped me through it. It's part of why I trained, though our sessions will always focus on you."]
  ]
};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TABS=['About me','How I work','Specialities','FAQs'];

function whoRow([icon,lines]){
  return `<div class="row"><span class="ic">${ic(icon)}</span><div class="tx">${lines.map(([k,v,extra])=>{
    if(extra==='member') return `<div><b>${k}</b><button class="qbtn" data-tip="A professional body that sets standards for ethical, safe practice. Members are held to its code of conduct." aria-label="What is a professional membership?">${ic('question')}</button><div>${esc(v)}</div></div>`;
    return `<div>${k?`<b>${k}</b> `:''}${esc(v)}</div>`}).join('')}</div></div>`;
}

   ${card('When I may not be the right fit',`<p class="p14">${esc(T.notFit)}</p>`,'tight')}`,
  `${T.faqs.map(([q,a])=>`<section class="card tight faq-card"><h2>${q}</h2><p class="p14">${esc(a)}</p></section>`).join('')}
   <button class="banner" data-toast="Opens a message to ${T.first}. He usually replies within 24 hours."><span><b>Have more questions?</b><small>Send ${T.first} a message</small></span><img src="${IMG.banner}" alt=""></button>`
];

const phone=document.getElementById('phone');
phone.innerHTML=`
  <div class="scroll" id="scroll">
    <header>
      <div class="hero"><p>${T.tagline}</p></div>
      <div class="hero-row">
        <div class="avatar"><img src="${IMG.chris}" alt="${T.name}"></div>
        <div class="hero-btns">
          <button class="circle" aria-label="Message ${T.first}" data-toast="Opens a message to ${T.first}. He usually replies within 24 hours.">${ic('message')}</button>
          <button class="circle" aria-label="Share profile" data-toast="Opens your phone’s share sheet.">${ic('share')}</button>
        </div>
      </div>
      <div class="spacer"></div>
      <div class="name-row"><h1>${T.name}</h1><button class="icon-btn" data-tip="Verified therapist: identity, qualifications and membership checked by emoteCare." aria-label="Verified therapist">${ic('verified')}</button></div>
    </header>
    <nav class="tabs" role="tablist" id="tabs">${TABS.map((t,i)=>`<button class="tab" role="tab" aria-selected="${i===0}" data-i="${i}">${t}</button>`).join('')}</nav>
    <main class="sections">${panels.map((p,i)=>`<div class="panel${i===0?' on':''}" role="tabpanel" data-i="${i}">${p}</div>`).join('')}</main>
  </div>
  <div class="cta" id="cta">
    <div class="top"><div class="price"><div class="amt"><b>£45</b><span>per session</span></div><div class="next">Next available: 20th Oct 17:15</div></div>
      <button class="book" id="book">Book now</button></div>
    <p class="cancel">You can cancel up to 48 hours before the session.</p>
  </div>
  <section class="screen" id="booking" aria-label="Book a session" aria-hidden="true">
    <div class="bk-top"><div class="av"><img src="${IMG.chris}" alt=""></div><p><b>Therapy session</b>with ${T.name}</p></div>
    <div class="bk-body">
      <button class="bk-back" id="bkBack" aria-label="Back to profile">${ic('arrowLeft')}</button>
      <div class="bk-main">
        <h2 class="bk-title">Choose date and time</h2>
        <div class="cal">
          <p class="month">September 2025</p>
          <div class="rows">
            <div class="days" id="days"></div>
            <div class="slots"><div class="times" id="times"></div><p class="tz">All times listed are in your local timezone.</p></div>
          </div>
        </div>
        <div class="repeat">
          <button class="switch" id="repeat" role="switch" aria-checked="true" aria-label="Repeat session every week"><span class="knob"><svg class="ck" viewBox="0 0 16 16" fill="none"><path d="M13.3 4 6 11.3 2.7 8" stroke="#171717" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round"/></svg><svg class="xx" viewBox="0 0 16 16" fill="none"><path d="M12 4 4 12M4 4l8 8" stroke="#737373" stroke-width="1.33" stroke-linecap="round"/></svg></span></button>
          <div><b>Repeat session every week?</b><small id="repeatNote">Auto-charged until cancelled.</small></div>
        </div>
      </div>
    </div>
    <div class="bk-cta"><button class="btn-primary" id="confirm" aria-disabled="true">Confirm</button><p>You can cancel up to 48 hours before the call.</p></div>
  </section>
  <section class="screen" id="pay" aria-label="Confirm and pay" aria-hidden="true">
    <div class="bk-top"><div class="av"><img src="${IMG.chris}" alt=""></div><p><b>Therapy session</b>with ${T.name}</p></div>
    <div class="bk-body">
      <button class="bk-back" id="payBack" aria-label="Back to calendar">${ic('arrowLeft')}</button>
      <div class="bk-main">
        <h2 class="bk-title">Confirm and pay</h2>
        <div class="sum">
          <div class="sum-row"><span>Date:</span> <b id="sumDate"></b><br><span>Time:</span> <b id="sumTime"></b></div>
          <div class="sum-row"><span>Session type:</span> <b>video call</b><br><span>Repeats:</span> <b id="sumRepeat"></b></div>
          <div class="sum-row"><span>Cancellation:</span> <b>free up to 48 hours before</b></div>
          <div class="sum-row"><span>Total:</span> <b>£45</b></div>
        </div>
      </div>
    </div>
    <div class="bk-cta">
      <button class="btn-primary pay-go">Continue to checkout</button>
      <button class="btn-apple pay-go" aria-label="Pay with Apple Pay">${APPLE}</button>
    </div>
  </section>
  <section class="screen" id="success" aria-label="Session booked" aria-hidden="true">
    <div class="ok-card"><div class="ok-inner">
      <div class="ok-text">${SUCCESS}<h2>Your session is booked!</h2><p>Please complete a short pre-session form with your personal and emergency details at least one hour before your session.</p></div>
      <div class="ok-btns"><button class="btn-primary" data-toast="Opens the pre-session form.">Complete now</button><button class="btn-outline" id="later">I’ll do it later</button></div>
    </div></div>
  </section>
  <div class="tip" id="tip" role="tooltip"></div>
  <div class="toast" id="toast" role="status"></div>`;

const scroll=document.getElementById('scroll'),tabs=document.getElementById('tabs'),cta=document.getElementById('cta');
phone.style.setProperty('--cta-h',cta.offsetHeight+'px');
const header=scroll.querySelector('header');
function selectTab(i){
  tabs.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',+t.dataset.i===i));
  phone.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',+p.dataset.i===i));
  // keep the tab bar where it is if it's stuck, otherwise leave the page in place
  if(scroll.scrollTop>header.offsetHeight) scroll.scrollTop=header.offsetHeight;
}
tabs.querySelectorAll('.tab').forEach(t=>t.onclick=()=>selectTab(+t.dataset.i));
scroll.addEventListener('scroll',()=>{tabs.classList.toggle('stuck',scroll.scrollTop>=header.offsetHeight-1);hideTip()},{passive:true});

phone.querySelectorAll('.faq-q').forEach(q=>q.onclick=()=>{const f=q.parentElement;f.classList.toggle('open');q.setAttribute('aria-expanded',f.classList.contains('open'))});

const toastEl=document.getElementById('toast');
function toast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>toastEl.classList.remove('show'),2600)}
phone.querySelectorAll('[data-toast]').forEach(b=>b.addEventListener('click',()=>toast(b.dataset.toast)));

const tip=document.getElementById('tip');
function hideTip(){tip.classList.remove('show');tip.owner=null}
phone.querySelectorAll('[data-tip]').forEach(b=>b.addEventListener('click',e=>{
  e.stopPropagation();
  if(tip.owner===b){hideTip();return}
  tip.textContent=b.dataset.tip;tip.owner=b;
  const pr=phone.getBoundingClientRect(),r=b.getBoundingClientRect();
  tip.style.left='0px';tip.style.top='0px';tip.classList.add('show');
  const w=tip.offsetWidth,h=tip.offsetHeight;
  let x=r.left-pr.left+r.width/2-w/2;x=Math.max(12,Math.min(pr.width-w-12,x));
  let y=r.bottom-pr.top+8;if(y+h>pr.height-cta.offsetHeight-8)y=r.top-pr.top-h-8;
  tip.style.left=x+'px';tip.style.top=y+'px';
}));
phone.addEventListener('click',hideTip);


// ---- booking flow ----
const DAYS=[['Thu',20,['15:00','16:00']],['Fri',21,['09:00','12:30','17:15']],['Sat',22,null],['Sun',23,null],['Mon',24,['10:00','18:00']],['Tue',25,['15:00','16:00','19:00']],['Wed',26,['08:30','13:00']],['Thu',27,['15:00','16:00']],['Fri',28,['11:00']],['Sat',29,null],['Sun',30,null]];
const LONG={Mon:'Monday',Tue:'Tuesday',Wed:'Wednesday',Thu:'Thursday',Fri:'Friday',Sat:'Saturday',Sun:'Sunday'};
const ord=n=>n+(n%10===1&&n!==11?'st':n%10===2&&n!==12?'nd':n%10===3&&n!==13?'rd':'th');
const plus50=t=>{let[h,m]=t.split(':').map(Number);m+=50;h+=Math.floor(m/60);m%=60;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`};
const bk={day:0,time:null};
const daysEl=document.getElementById('days'),timesEl=document.getElementById('times'),confirmBtn=document.getElementById('confirm'),repeatBtn=document.getElementById('repeat');
daysEl.innerHTML=DAYS.map(([d,n,t],i)=>`<button class="day" data-i="${i}" ${t?`aria-pressed="${i===0}"`:'disabled aria-label="'+d+' '+n+', no times available"'}><small>${d}</small><b>${n}</b></button>`).join('');
function renderTimes(){
  timesEl.innerHTML=DAYS[bk.day][2].map(t=>`<button class="time" aria-pressed="${bk.time===t}">${t}</button>`).join('');
  timesEl.querySelectorAll('.time').forEach(b=>b.onclick=()=>{bk.time=b.textContent;renderTimes();confirmBtn.setAttribute('aria-disabled','false')});
}
daysEl.querySelectorAll('.day:not(:disabled)').forEach(b=>b.onclick=()=>{
  bk.day=+b.dataset.i;bk.time=null;confirmBtn.setAttribute('aria-disabled','true');
  daysEl.querySelectorAll('.day').forEach(x=>x.disabled||x.setAttribute('aria-pressed',x===b));
  renderTimes();
});
renderTimes();
repeatBtn.onclick=()=>{const on=repeatBtn.getAttribute('aria-checked')!=='true';repeatBtn.setAttribute('aria-checked',on);document.getElementById('repeatNote').textContent=on?'Auto-charged until cancelled.':'One session only.'};
const screens={booking:document.getElementById('booking'),pay:document.getElementById('pay'),success:document.getElementById('success')};
function show(id,on){const s=screens[id];s.classList.toggle('on',on);s.setAttribute('aria-hidden',!on)}
document.getElementById('book').onclick=()=>show('booking',true);
document.getElementById('bkBack').onclick=()=>show('booking',false);
confirmBtn.onclick=()=>{
  if(confirmBtn.getAttribute('aria-disabled')==='true'){toast('Choose a time to continue.');return}
  const [d,n]=DAYS[bk.day];
  document.getElementById('sumDate').textContent=`${LONG[d]}, ${ord(n)} September 2025`;
  document.getElementById('sumTime').textContent=`${bk.time}–${plus50(bk.time)}`;
  document.getElementById('sumRepeat').textContent=repeatBtn.getAttribute('aria-checked')==='true'?'every week':'one session only';
  show('pay',true);
};
document.getElementById('payBack').onclick=()=>show('pay',false);
phone.querySelectorAll('.pay-go').forEach(b=>b.onclick=()=>show('success',true));
function resetFlow(){['success','pay','booking'].forEach(id=>show(id,false))}
document.getElementById('later').onclick=resetFlow;

// intro video: no footage in the prototype, so the play button explains the feature
const vnote=document.getElementById('vnote');
document.getElementById('play').onclick=e=>{e.stopPropagation();vnote.classList.add('show');vnote.setAttribute('aria-hidden','false')};
document.getElementById('vclose').onclick=e=>{e.stopPropagation();vnote.classList.remove('show');vnote.setAttribute('aria-hidden','true')};
document.getElementById('restart').onclick=()=>{resetFlow();scroll.scrollTo({top:0,behavior:'smooth'});selectTab(0)};
</script>
</body>
</html>
