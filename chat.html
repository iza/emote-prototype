<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Money Bestie Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g500:#065d44;--g900:#031711;--chip:#168263;--grey:#fcf3f3;--bg:linear-gradient(175deg,#fef8f4 0%,#fcf1f1 50%,#f9ecf2 100%);--user:#f4dfdf;--page:#faf9f6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--page);font-family:Inter,system-ui,sans-serif;color:#000;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;gap:12px}
.phone{position:relative;width:390px;height:min(844px,100dvh);overflow:hidden;border-radius:28px;box-shadow:0 20px 60px rgba(23,23,23,.12),0 0 0 1px rgba(23,23,23,.06);background:#fff;user-select:none}
.replay{font-size:12px;line-height:20px;color:#525252;text-decoration:underline;text-underline-offset:3px;background:none;border:0;cursor:pointer;font-family:inherit}
@media (max-width:430px),(max-height:700px){body{gap:0}.phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}.replay{display:none}}
html.embed,html.embed body{background:transparent}
html.embed body{min-height:0;height:844px;gap:0}
html.embed .phone{height:800px;margin:4px 0 40px;border-radius:32px;box-shadow:0 0 0 1px rgba(23,23,23,.07),0 8px 22px rgba(23,23,23,.09)}
html.embed .replay{display:none}

/* header */
.nav{position:absolute;left:0;right:0;top:0;height:76px;background:#fff;z-index:6;display:flex;align-items:center;justify-content:space-between;padding:28px 16px 0;border-bottom:1px solid rgba(0,0,0,.05)}
.nav .back{width:32px;height:32px;display:flex;align-items:center}
.nav .back svg{width:8px;height:14px}
.nav h1{font-size:14px;line-height:20px;font-weight:600;letter-spacing:-.15px;color:#5c3a46}
.nav .me{width:32px;height:32px;border-radius:50%;overflow:hidden}
.nav .me img,.av img{width:100%;height:100%;object-fit:cover;display:block}

/* intro */
.icard{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;flex-shrink:0;padding:0 8px}
.icard .big{width:96px;height:96px;border-radius:50%;overflow:hidden;box-shadow:0 6px 20px rgba(3,23,17,.10)}
.icard .big img{width:100%;height:100%;object-fit:cover;display:block}
.icard h2{margin-top:28px;font-size:20px;line-height:26px;font-weight:600;color:#5c3a46;letter-spacing:-.2px}
.icard p{margin-top:12px;font-size:14px;line-height:20px;color:#8a6772}
.pick{position:absolute;left:16px;bottom:68px;font-size:13px;line-height:18px;font-weight:500;color:#3d4a47}
.starters{position:absolute;left:0;right:0;bottom:76px;padding:10px 0;overflow:hidden;z-index:4;transition:opacity .3s ease,transform .3s ease}
.starters.gone{opacity:0;transform:translateY(12px)}
.track{display:flex;gap:8px;padding:0 16px;width:max-content}
.starter{flex-shrink:0;padding:8px 12px;border-radius:14px;font-size:14px;line-height:20px;display:flex;align-items:center;white-space:nowrap;transition:transform .15s ease,filter .15s ease}
.starter.press{transform:scale(.97);filter:brightness(.95)}

/* chat */
.chat{position:absolute;left:0;right:0;top:76px;bottom:76px;background:var(--bg);overflow:hidden;z-index:1;transition:bottom .35s ease}
.msgs{position:absolute;left:0;right:0;bottom:0;padding:16px 12px 12px;display:flex;flex-direction:column;gap:12px;transition:transform .45s cubic-bezier(.3,.7,.2,1)}
.row{display:flex;gap:8px;align-items:flex-end}
.row.me{justify-content:flex-end}
.av{width:32px;height:32px;border-radius:50%;overflow:hidden;flex-shrink:0}
.stack{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.b{background:#fff;border:1px solid rgba(0,0,0,.06);border-radius:18px;padding:8px 12px;font-size:15px;line-height:20px;max-width:270px;white-space:pre-line}
.stack .b:last-child{border-bottom-left-radius:4px}
.b.small{border-color:transparent}
.b.wide{width:290px;max-width:290px;padding:12px}
.row.me .b{background:var(--user);border-color:transparent;padding:8px 12px;max-width:270px;border-bottom-right-radius:4px}
.in{animation:pop .38s cubic-bezier(.2,.8,.25,1.15) both}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.typing{display:flex;gap:4px;padding:14px 14px}
.typing i{width:7px;height:7px;border-radius:50%;background:#9aa5a1;animation:dot 1s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.b a{color:#e1349c;text-decoration:underline;text-underline-offset:2px}
.b strong{font-weight:600}
.vmsg{display:inline-flex;align-items:center;gap:6px}.vmsg svg{width:16px;height:16px;flex-shrink:0;opacity:.7}

/* ISA card */
.isa{width:100%;background:#fff;border-radius:32px;padding:8px 8px 16px;display:flex;flex-direction:column;align-items:center;gap:16px;margin:0 auto 12px}
.pill{width:100%;height:48px;border-radius:48px;background:#e4f7ff;display:flex;align-items:center;gap:12px;padding-left:4px}
.pill svg{width:40px;height:40px}
.pill span{font-size:14px;line-height:30px;font-weight:600;color:#1785a8}
.isa img{width:151px;height:123px;display:block}
.isa .grow{font-size:14px;line-height:24px}
.isa .grow b{font-weight:600}
.risk{display:flex;align-items:center;gap:22px;height:20px;padding:0 2px 0 8px;border-radius:28px;background:#ffe6c1;font-size:12px;line-height:16px;color:var(--g900)}
.risk svg{width:16px;height:16px}

/* goal card */
.goal{width:100%;margin-top:12px;border-radius:20px;padding:16px;background:radial-gradient(120% 90% at 100% 0%,#0d7a59 0%,rgba(13,122,89,0) 60%),#065d44;color:#fff;white-space:normal}
.gtop{display:flex;align-items:center;gap:12px}
.gic{width:44px;height:44px;border-radius:14px;background:rgba(255,239,97,.12);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.gic svg{width:30px;height:30px}
.gtx small{display:block;font-size:12px;line-height:16px;color:rgba(255,255,255,.72)}
.gtx b{display:block;font-size:26px;line-height:30px;font-weight:600;letter-spacing:-.5px;color:#ffef61}
.gtx b em{font-style:normal;font-size:14px;font-weight:500;letter-spacing:0;color:rgba(255,255,255,.72);margin-left:4px}
.goal .bar{margin-top:14px;height:6px;border-radius:6px;background:rgba(255,255,255,.14);overflow:hidden}
.goal .bar i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#f8a3bd,#f480a3);transition:width 1.4s cubic-bezier(.3,.7,.2,1) .3s}
.goal.run .bar i{width:80%}
.goal p{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.12);font-size:13px;line-height:18px;color:rgba(255,255,255,.85)}
.gbtn{display:block;margin-top:12px;height:40px;border-radius:20px;background:#ffef61;color:#031711;font-size:14px;line-height:40px;font-weight:600;text-align:center}

/* summary */
.sum{width:290px;max-width:290px;padding:12px 14px}
.sum .share{margin-top:12px;height:40px;border-radius:56px;background:#f1f1f1;display:flex;align-items:center;justify-content:center;gap:12px;font-size:14px}
.sum .share svg{width:14px;height:16px}
.sum .muted{color:#3d3d3d}

/* human */
.human{display:flex;flex-direction:column;gap:12px;align-items:stretch;margin-top:56px;padding:0 4px}
.human h3{font-size:20px;line-height:26px;font-weight:600;text-align:center;letter-spacing:-.2px}
.hcard{position:relative;height:232px;border-radius:12px;background:var(--g500);padding:24px}
.hcard .badge{position:absolute;right:16px;top:16px;height:25px;padding:0 12px;border-radius:32px;background:#144235;color:#b7d9cf;font-size:12px;line-height:25px;font-weight:500}
.hcard .ph{position:absolute;left:24px;top:49px;width:80px;height:80px;border-radius:50%;overflow:hidden}
.hcard .ph img{width:100%;height:100%;object-fit:cover;display:block}
.hcard .tx{position:absolute;left:24px;top:56px;right:24px}
.hcard h4{font-size:18px;line-height:26px;font-weight:600;color:#c6f54a}
.hcard p{margin-top:8px;font-size:14px;line-height:20px;color:#b7d9cf}
.hcard .cta{display:inline-block;margin-top:16px;height:32px;padding:0 15px;border:1px solid #fff;border-radius:56px;color:#fff;font-size:14px;line-height:30px;font-weight:500}
.wcard{position:relative;height:104px;border-radius:12px;background:#2a935a;overflow:hidden}
.wcard p{position:absolute;left:24px;top:20px;font-size:15px;line-height:22px;font-weight:500;color:#fff}
.wcard img{position:absolute;right:0;top:0;width:169px;height:104px}

/* options + feedback */
.opts{position:absolute;left:0;right:0;bottom:76px;background:#f9ecf2;padding:8px 12px 10px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;z-index:4;transform:translateY(100%);opacity:0;transition:transform .35s cubic-bezier(.3,.7,.2,1),opacity .25s ease}
.opts.on{transform:none;opacity:1}
.opt{height:36px;padding:0 16px;border-radius:18px;background:#fff;border:1px solid rgba(150,60,85,.22);color:#7a3550;font-size:14px;line-height:20px;font-weight:500;display:flex;align-items:center;justify-content:center;transition:background .2s ease,color .2s ease,border-color .2s ease}
.opt.sel{background:var(--user);border-color:var(--user);color:#000}
.opts.thumbs{flex-direction:row;justify-content:center;gap:24px;padding:20px 0 14px}
.thumb{width:48px;height:48px;border-radius:50%;background:#f4dfdf;display:flex;align-items:center;justify-content:center;transition:transform .2s ease,background .2s ease}
.thumb svg{width:22px;height:22px}
.thumb.down svg{transform:rotate(180deg)}
.thumb.sel{transform:scale(1.08);background:#ecc8d0}

/* input */
.input{position:absolute;left:0;right:0;bottom:0;height:76px;background:#fff;z-index:5;padding:8px 12px 0 16px;display:flex;gap:8px;align-items:flex-start}
.field{flex:1;height:40px;border-radius:20px;background:#f5f3f3;padding:0 16px;display:flex;align-items:center;font-size:15px}
.caret{width:1px;height:18px;background:#000;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.mic{position:relative;width:36px;height:36px;margin-top:2px;flex-shrink:0;border-radius:50%;background:#168263;display:flex;align-items:center;justify-content:center;transition:background .25s ease}
.mic>svg{width:19px;height:19px;transition:opacity .2s ease,transform .25s ease}
.mic>svg path{stroke:#fff;stroke-opacity:1}
.mic .send{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.5) rotate(-45deg);transition:opacity .2s ease,transform .3s cubic-bezier(.3,1.4,.5,1)}
.mic .send svg{width:16px;height:16px}
.mic.sending>svg{opacity:0;transform:scale(.5)}
.mic.sending .send{opacity:1;transform:none}
.typed{color:#000}

/* voice */
.voice{position:absolute;inset:0;z-index:8;background:var(--g500);opacity:0;pointer-events:none;transition:opacity .4s ease}
.voice.on{opacity:1}
.vav{position:absolute;left:135px;top:104px;width:120px;height:120px;border-radius:50%;overflow:hidden;transition:opacity .3s ease}
.vav img{width:100%;height:100%;object-fit:cover;display:block}
.vav.user{opacity:0}
.voice.userturn .vav.user{opacity:1}.voice.userturn .vav.bestie{opacity:0}
.vlabel{position:absolute;left:0;right:0;top:296px;text-align:center;color:#fff;font-size:15px;line-height:22px;opacity:0;transition:opacity .3s ease}
.voice.listen .vlabel{opacity:1}
.vis{position:absolute;left:0;right:0;top:318px;height:176px;display:flex;align-items:center;justify-content:center;gap:16px}
.vis i{width:26px;height:26px;border-radius:32px;background:#ffb1e2;transition:height .25s ease,opacity .25s ease}
.voice.dots .vis i{animation:vdot 1.2s infinite ease-in-out}
.voice.dots .vis i:nth-child(2){animation-delay:.15s}.voice.dots .vis i:nth-child(3){animation-delay:.3s}.voice.dots .vis i:nth-child(4){animation-delay:.45s}
@keyframes vdot{0%,100%{transform:scale(1)}40%{transform:scale(.7)}}
.voice.userturn .vis i{opacity:0}
.orb{position:absolute;left:50%;top:406px;width:192px;height:192px;margin:-96px 0 0 -96px;border-radius:50%;background:#b9eaff;transform:scale(.3);opacity:0;transition:opacity .3s ease}
.voice.userturn .orb{opacity:1;animation:orb 1.6s infinite ease-in-out}
@keyframes orb{0%,100%{transform:scale(.38)}25%{transform:scale(.82)}50%{transform:scale(.55)}75%{transform:scale(1)}}
.vtext{position:absolute;left:32px;right:32px;top:530px;text-align:center;color:#fff;font-size:22px;line-height:30px;font-weight:700;letter-spacing:-.4px;min-height:30px}
.vtext span{animation:wd .3s ease both}@keyframes wd{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.vtap{position:absolute;left:0;right:0;top:574px;text-align:center;color:#9fd3bf;font-size:14px;line-height:20px}
.vbtn{position:absolute;bottom:64px;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.vbtn.stop{left:64px;border:1px solid #b7d9cf}
.vbtn.stop i{width:18px;height:18px;border-radius:4px;background:#b7d9cf}
.vbtn.close{right:64px;background:#144235}
.vbtn.close svg{width:18px;height:18px}

/* tap indicator */
.tap{position:absolute;z-index:20;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(3,23,17,.18);border:2px solid rgba(255,255,255,.7);pointer-events:none;opacity:0;transform:scale(.6)}
.tap.go{animation:tap .6s ease-out both}
@keyframes tap{0%{opacity:0;transform:scale(1.3)}25%{opacity:1;transform:scale(.85)}60%{opacity:1;transform:scale(.9)}100%{opacity:0;transform:scale(1.15)}}
.fade{position:absolute;inset:0;background:#fff;z-index:30;opacity:0;pointer-events:none;transition:opacity .4s ease}
.fade.on{opacity:1}
@media (prefers-reduced-motion:reduce){.in{animation:none}.tap.go{animation-duration:.01s}}
</style>
</head>

const $=id=>document.getElementById(id);
const chat=$('chat'),msgs=$('msgs'),opts=$('opts'),voice=$('voice');
let RUN=0;
const sleep=ms=>new Promise((res,rej)=>{const r=RUN;setTimeout(()=>r===RUN?res():rej('stop'),ms)});
const readTime=t=>Math.min(4600,Math.max(1300,t.length*30));

function tapAt(el){
  const p=phone.getBoundingClientRect(),r=el.getBoundingClientRect(),t=$('tap');
  t.style.left=(r.left-p.left+r.width/2)+'px';t.style.top=(r.top-p.top+r.height/2)+'px';
  t.classList.remove('go');void t.offsetWidth;t.classList.add('go');
}
function add(html){
  const d=document.createElement('div');d.innerHTML=html.trim();const el=d.firstChild;msgs.appendChild(el);return el;
}
function bestieRow(){return add(`<div class="row in"><span class="av"><img src="${IMG.bestie}" alt=""></span><div class="stack"></div></div>`)}
async function bestie(parts,opts2={}){
  const row=bestieRow(),stack=row.querySelector('.stack');
  for(let i=0;i<parts.length;i++){
    const ty=document.createElement('div');ty.className='b typing in';ty.innerHTML='<i></i><i></i><i></i>';stack.appendChild(ty);
    await sleep(opts2.typing||1000);
    const b=document.createElement('div');b.className='b in '+(parts[i].cls||'');b.innerHTML=parts[i].html;
    stack.replaceChild(b,ty);
    if(parts[i].after)parts[i].after(b);
    await sleep(parts[i].wait||readTime(b.textContent));
  }
  return row;
}
function me(text){add(`<div class="row me in"><div class="b">${text}</div></div>`)}
async function choose(list,pick,kind){
  opts.className='opts'+(kind?' '+kind:'');
  opts.innerHTML=list.map(t=>kind==='thumbs'?t:`<div class="opt">${t}</div>`).join('');
  chat.style.bottom=(76+opts.offsetHeight)+'px';
  await sleep(30);opts.classList.add('on');
  await sleep(1500);
  const el=opts.children[pick];tapAt(el);await sleep(180);el.classList.add('sel');
  await sleep(550);opts.classList.remove('on');chat.style.bottom='76px';
  await sleep(300);
  return list[pick];
}
const T={
 hi:'Hi Joanna! <span style="font-size:18px">👋</span>\nIt’s great that you’re thinking about starting to invest at 20. Here are three personalised suggestions to help you get started. Choose the one you’d like to learn more about',
 isa:'Open a Stocks and Shares ISA.\nThis tax-efficient account allows you to maximize your yearly ISA allowance (£20,000) and enjoy tax-free growth while focusing on increasing your wealth.\n\nWould you like to find a Stocks and Shares ISA platform?',
 plat:'Choose a user-friendly platform like Vanguard or Trading 212. These platforms have low fees and offer a range of index funds and ETFs for diversified investments.\n\nAre you looking to invest in lump sum or monthly contribution?',
 auto:'Automating your investments ensures consistent contributions without needing to think about it each month.\n\nThis method, known as dollar-cost averaging, helps mitigate market volatility and keeps you on track with your financial goals.\n\nWhat amount would you be comfortable with?',
 next:'Now that you have decided on an amount you’re comfortable with, next step is to set up automatic transfers from your bank account to your Stocks and Shares ISA.\n\nThis builds the habit of regular investing while enjoying your social activities. Would you like to select index funds in the account?',
 index:'An index fund tracks a market index, typically made up of stocks or bonds. Think of it as a makeup palette with a combination of blush shades.\n\nAn ETF (Exchange-Traded Fund) is a bundled investment combining different stocks into one product, offering flexibility to trade like individual stocks.',
 invest:'Invest in low-cost, diversified index funds or ETFs. These provide broad market exposure with minimal effort and lower risk compared to individual stocks.\n\nLook for funds tracking well-known indices like the FTSE 100 or S&P 500 on platforms like <a>Vanguard</a> and <a>Nutmeg.</a>',
 done:'Well done Joanna! 🥳🤩✌️ How do You find my advice?\n\nHere’s the summary of your financial action that you need to take:',
 summary:'<strong>Summary:</strong>\n\n👉 <strong>Open a Stocks and Shares ISA</strong>\n<span class="muted">Enjoy tax-efficient growth and focus on increasing your wealth.</span>\n\n👉 <strong>Set up automatic monthly contributions</strong> <span class="muted">Ensure consistent investing without impacting your social lifestyle.</span>\n\n👉 <strong>Invest in low-cost, diversified index funds or ETFs:</strong>\n<span class="muted">A simple and effective way to start investing with lower risk.</span>',
 book:'Would you like to book a workshop/get a consultant to support you on taking the action together?'
};
const ISA=`<div class="isa"><div class="pill">${S.ticket}<span>Stocks and shares ISA</span></div><img src="${IMG.pig}" alt=""><p class="grow"><b>approx 8%</b> Growth per year</p><span class="risk">Moderate Risk${S.q}</span></div>`;
const GOAL=`<div class="goal"><div class="gtop"><span class="gic">${S.horse}</span><div class="gtx"><small>Progress to your goal</small><b>80%<em>there</em></b></div></div><div class="bar"><i></i></div><p>Let’s connect all of my accounts to gain full picture</p><span class="gbtn">Let’s Track My Wealth</span></div>`;
const HUMAN=`<div class="human in"><h3>Would you rather<br>talk to Human?</h3>
 <div class="wcard"><p>See our upcoming<br>workshops and Events</p><img src="${IMG.work}" alt=""></div></div>`;
const HERO=`<div class="icard hero"><div class="big"><img src="${IMG.bestie}" alt=""></div>
    <h2>I’m your Money Bestie.<br>Ask me anything.</h2>
    <p>I am trained with the knowledge<br>of Warren Buffet, combined with insights<br>from hundreds of other financial<br>education coaches.<br>Our conversations are private.</p></div>`;
const TH='<svg viewBox="0 0 24 24" fill="none"><path d="M7 10v11M7 10l4-7c1.3 0 2.5 1.1 2.2 2.5L12.7 9H18a2 2 0 0 1 2 2.3l-1.2 7A2 2 0 0 1 16.8 20H7" stroke="#7a3550" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="3.5" y="10" width="3.5" height="10.5" rx="1.2" stroke="#7a3550" stroke-width="1.6"/></svg>';
const THUMBS=[`<span class="thumb">${TH}</span>`,`<span class="thumb down">${TH}</span>`];


function reset(){
  RUN++;opts.className='opts';opts.innerHTML='';
  $('starters').classList.remove('gone');chat.style.transition='none';chat.style.bottom=(76+$('starters').offsetHeight)+'px';
  msgs.innerHTML=HERO;msgs.firstChild.style.height=(chat.clientHeight-28)+'px';void chat.offsetWidth;chat.style.transition='';
  const tr=$('track');tr.style.transition='none';tr.style.transform='';$('st1').classList.remove('press');
  voice.className='voice';$('typed').textContent='';$('mic').classList.remove('sending');$('fade').classList.remove('on');
}
async function typeIn(text){
  const ty=$('typed'),mic=$('mic');await sleep(900);
  let first=true;for(const ch of text){ty.textContent+=ch;if(first){mic.classList.add('sending');first=false}await sleep(55+Math.random()*60)}
  await sleep(500);
  tapAt(mic);await sleep(220);
  ty.textContent='';mic.classList.remove('sending');me(text);
}
async function speak(){
  tapAt($('mic'));await sleep(350);
  voice.classList.add('on','dots');await sleep(1200);
  voice.classList.remove('dots');voice.classList.add('listen');
  const bars=[...$('vis').children],H=[[52,102,176,90],[90,150,110,60],[40,120,160,130],[70,176,96,52],[110,80,140,100]];
  const words=['Around','£100','a','month'],vt=$('vtext');vt.innerHTML='';
  for(let k=0;k<10;k++){bars.forEach((b,i)=>b.style.height=H[k%H.length][i]+'px');if(k>=1&&k<=words.length)vt.insertAdjacentHTML('beforeend',(k>1?' ':'')+'<span>'+words[k-1]+'</span>');await sleep(360)}
  await sleep(400);
  tapAt(document.querySelector('.vbtn.stop'));await sleep(350);
  bars.forEach(b=>b.style.height='');voice.className='voice';await sleep(450);$('vtext').innerHTML='';
}
async function play(){
  reset();
  try{
    const track=$('track'),dist=track.scrollWidth-phone.clientWidth;
    await sleep(1600);
    await bestie([{html:'Hey :)',cls:'small',wait:400},{html:'So, where do we start ?',cls:'small',wait:900}],{typing:700});
    track.style.transition='transform 4.2s cubic-bezier(.45,0,.55,1)';track.style.transform=`translateX(${-dist}px)`;
    await sleep(5200);
    track.style.transition='transform 1.4s cubic-bezier(.45,0,.55,1)';track.style.transform='translateX(0)';
    await sleep(1900);
    tapAt($('st1'));$('st1').classList.add('press');await sleep(450);
    $('starters').classList.add('gone');chat.style.bottom='76px';await sleep(350);
    me('How can I start investing with<br>a small amount of money?');await sleep(900);
    await bestie([{html:T.hi}]);
    me(await choose(['Stocks and shares ISA','General Investment Account','Junior Stocks and Share ISA'],0));
    await sleep(700);
    await bestie([{html:ISA+'<div>'+T.isa+'</div>',cls:'wide',wait:4800}],{typing:1300});
    me(await choose(['Not for Now','Sure!'],1));await sleep(700);
    await bestie([{html:T.plat}]);
    me(await choose(['Lump sum','Monthly','I don’t know'],1));await sleep(700);
    await bestie([{html:T.auto}]);
    await speak();
    me(`<span class="vmsg">${S.mic}Around £100 a month</span>`);await sleep(700);
    await bestie([{html:T.next}]);
    await typeIn('What’s an index fund?');await sleep(700);
    await bestie([{html:T.index}]);
    me(await choose(['Let’s do it','Maybe some other time'],0));await sleep(700);
    await bestie([{html:T.invest+GOAL,cls:'wide',wait:4200,after:b=>setTimeout(()=>b.querySelector('.goal').classList.add('run'),200)}],{typing:1200});
    await bestie([{html:T.done,wait:1800},{html:T.summary+`<div class="share">${S.share}Share to...</div>`,cls:'sum',wait:4200}]);
    await choose(THUMBS,0,'thumbs');
    await bestie([{html:T.book,wait:900}]);
    add(HUMAN);await sleep(4200);
    $('fade').classList.add('on');await sleep(500);
    play();
  }catch(e){if(e!=='stop')console.error(e)}
}
// start when visible, so viewers see it from the beginning
let started=false;
const io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)&&!started){started=true;play()}},{threshold:.35});
io.observe(phone);
$('replay').onclick=()=>{started=true;play()};
</script>
