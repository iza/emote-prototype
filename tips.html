<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bestie's Top Tips</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#065d44;--ink:#031711;--muted:#6b7772;--page:#faf9f6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--page);font-family:Inter,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;gap:12px}
.phone{position:relative;width:390px;height:min(844px,100dvh);overflow:hidden;border-radius:28px;box-shadow:0 20px 60px rgba(23,23,23,.12),0 0 0 1px rgba(23,23,23,.06);background:#fff;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.phone *{-webkit-tap-highlight-color:transparent}
.restart{font-size:12px;line-height:20px;color:#525252;text-decoration:underline;text-underline-offset:3px;background:none;border:0;cursor:pointer;font-family:inherit}
@media (max-width:430px),(max-height:700px){body{gap:0}.phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}.restart{display:none}}
html.embed,html.embed body{background:transparent}
html.embed body{min-height:0;height:844px;gap:0;justify-content:flex-start}
html.embed .phone{height:800px;margin:4px 0 40px;border-radius:32px;box-shadow:0 0 0 1px rgba(23,23,23,.07),0 8px 22px rgba(23,23,23,.09)}
html.embed .restart{display:none}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus,button:focus-visible{outline:none}

.screen{position:absolute;inset:76px 0 78px 0;background:#fff;display:flex;flex-direction:column;transition:transform .45s cubic-bezier(.3,.7,.2,1),opacity .3s;z-index:1}
.screen.off-right{transform:translateX(100%)}
.screen.off-left{transform:translateX(-28%);opacity:.6}
.screen.hidden{visibility:hidden}
.top.fixed{position:absolute;left:0;right:0;top:0;z-index:6}
.top{height:76px;flex-shrink:0;padding:28px 16px 0;display:flex;align-items:center;justify-content:space-between;background:#fff}
.top .back{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:#5c3a46;width:72px}
.top .back svg{width:8px;height:14px}
.top h1{font-size:15px;line-height:20px;font-weight:600;color:#5c3a46;letter-spacing:-.2px}
.top .me{width:72px;display:flex;justify-content:flex-end}
.top .me img{width:32px;height:32px;border-radius:50%;object-fit:cover;display:block}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}
.eb{font-size:11px;line-height:14px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* grid */
.gh{padding:40px 20px 0}
.gh h2{margin-top:6px;font-size:30px;line-height:36px;font-weight:700;letter-spacing:-1.1px}
.gh p.s{margin-top:8px;font-size:14px;line-height:21px;color:#4a5450}
.grid{padding:28px 16px 36px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{position:relative;height:214px;border-radius:18px;overflow:hidden;cursor:pointer;text-align:left;display:block;transition:transform .2s}
.card:active,.card.press{transform:scale(.97)}
.card img{position:absolute;left:0;right:0;bottom:0;width:100%;height:118px;object-fit:cover;object-position:center 30%}
.card .q{position:absolute;top:0;left:0;right:0;z-index:1;padding:14px 14px 0;font-size:13px;line-height:18px;font-weight:600;letter-spacing:-.15px}
.card .n{position:absolute;z-index:1;right:10px;bottom:10px;font-size:11px;font-weight:600;padding:4px 8px;border-radius:10px;background:rgba(255,255,255,.88);color:var(--ink)}
.card::after{content:"";position:absolute;left:0;right:0;top:92px;height:30px;pointer-events:none}

/* tip */
.tipwrap{flex:1;padding:4px 16px 14px;display:flex}
.tip{position:relative;flex:1;border-radius:24px;overflow:hidden;display:flex;flex-direction:column;touch-action:pan-y}
.tip .hero{height:233px;flex-shrink:0;overflow:hidden;position:relative}
.tip .hero img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.08);transition:transform 6s ease-out}
.tip.in .hero img{transform:scale(1)}
.bars{position:absolute;left:14px;right:14px;top:12px;display:flex;gap:4px;z-index:3}
.bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.45);box-shadow:0 0 0 .5px rgba(3,23,17,.12);overflow:hidden;position:relative}
.bars i b{position:absolute;inset:0;width:0;background:#fff;border-radius:2px}
.bars i.done b{width:100%}
.bars i.cur b{width:100%;transition:width .4s ease}
.body{flex:1;position:relative;color:#fff;overflow:hidden}
.pg{position:absolute;inset:0;padding:32px 24px 0;transition:opacity .35s ease,transform .45s cubic-bezier(.3,.7,.2,1)}
.pg.r{opacity:0;transform:translateX(40px)}
.pg.l{opacity:0;transform:translateX(-40px)}
.pg .k{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.pg h3{margin-top:10px;font-size:23px;line-height:29px;font-weight:700;letter-spacing:-.6px}
.pg p{margin-top:12px;font-size:15px;line-height:23px;opacity:.94}
.foot{position:absolute;left:24px;right:24px;bottom:22px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.share{width:40px;height:40px;border-radius:50%;border:1px solid #fff;display:flex;align-items:center;justify-content:center}
.share svg{width:16px;height:18px}
.pill{height:32px;padding:0 14px;border-radius:16px;background:rgba(0,0,0,.2);display:flex;align-items:center;gap:6px}
.pill i{width:5px;height:5px;border-radius:4px;background:#fff;transition:all .35s}
.pill i.on{width:22px;background:#fff}
.zone{position:absolute;top:233px;bottom:70px;width:50%;z-index:1;cursor:pointer}
.zone.l{left:0}.zone.r{right:0}
.nx{width:36px;height:36px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;transition:transform .15s,background .3s}
.nx:active{transform:scale(.92)}
.nextb{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;background:#fff;color:var(--ink);font-size:13px;font-weight:600}

/* nav */
.nav{position:absolute;left:0;right:0;bottom:0;height:78px;background:#fff;border-top:1px solid #f0f1f0;display:flex;justify-content:space-around;align-items:flex-start;padding-top:12px;z-index:5}
.nav .it{width:60px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:500;color:var(--muted)}
.nav .it.on{color:var(--g);font-weight:600}
.nav .it svg{width:24px;height:24px}
.nav .chat{margin-top:-34px;width:64px;height:64px}
.nav .chat svg{width:64px;height:64px;filter:drop-shadow(0 4px 10px rgba(6,93,68,.25))}
.nav .it.on.learn svg path{fill:#065d44;stroke:#065d44}

.tap{position:absolute;z-index:20;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(3,23,17,.18);border:2px solid rgba(255,255,255,.75);pointer-events:none;opacity:0}
.tap.go{animation:tap .6s ease-out both}
@keyframes tap{0%{opacity:0;transform:scale(1.3)}25%{opacity:1;transform:scale(.85)}60%{opacity:1;transform:scale(.9)}100%{opacity:0;transform:scale(1.15)}}
.toast{position:absolute;left:50%;top:88px;transform:translate(-50%,-10px);background:var(--ink);color:#fff;font-size:13px;font-weight:500;padding:9px 14px;border-radius:18px;opacity:0;transition:all .35s;z-index:12;white-space:nowrap;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>

const TIPS=[
 {q:'How can I ensure long-term financial security?',bg:'#d8b972',fg:'#031711',body:'#91742f',pages:[
  ['What steps can I take to ensure long-term financial security?','Diversify your investments across different asset classes: stocks, bonds, real estate and maybe even some commodities. Make sure you have a well-funded emergency fund, and regularly review your portfolio so it stays aligned with your long-term goals.'],
  ['Consider rental property for passive income','It can add passive income and protect you against inflation. Stay disciplined with your savings and investment strategy, and avoid impulsive decisions based on market swings. Secure your future, darling, you deserve nothing but the best!']]},
 {q:'How can I negotiate a higher salary?',bg:'#975f2a',fg:'#fff2af',body:'#975f2a',pages:[
  ['Know when to negotiate','There are two good moments to negotiate your salary: when you’ve been in the same role for at least 6 months, or when you’re taking on a new role.'],
  ['Know when not to negotiate','Salary negotiation may not be possible in roles with clear salary bands, graduate schemes and many charity or government positions.'],
  ['Determine your worth','Understand your market value and decide on three numbers: the highest salary you’re aiming for, the salary you’d be satisfied with, and your absolute minimum.'],
  ['Know your “walk away” number','In a new job, wait until you have an offer before discussing salary, so your skills impress first. In an existing job, bring examples of your successes and quantify their impact. Approach it with an abundant mindset and preparation.']]},
 {q:'What are the best investment options for beginners?',bg:'#c5d3d4',fg:'#031711',body:'#00607e',pages:[
  ['What are the best investment options for beginners?','Start with low-cost index funds or ETFs for broad market exposure and lower risk. Vanguard Total Stock Market ETF (VTI) and Vanguard S&P 500 ETF (VOO) are popular choices.'],
  ['Consider robo-advisors','Robo-advisors like Nutmeg or Moneyfarm offer automated, diversified investing based on your risk tolerance and goals.'],
  ['Invest in established stocks as you gain experience','As you grow in confidence, start researching individual stocks of well-established companies. You’re off to a great start, superstar, keep shining!']]},

const phone=$('#phone');
phone.innerHTML=`
<section class="screen" id="grid">
 <div class="scroll" id="gscroll">
  <div class="gh"><p class="eb">Learn · 6 topics</p><h2>Bestie’s Top Tips</h2><p class="s">Your go-to guide for smart, savvy financial moves.</p></div>
  <div class="grid">${TIPS.map((t,i)=>`<button class="card" data-i="${i}" style="background:${t.bg};color:${t.fg}"><p class="q">${t.q}</p><img src="${PIC[i]}" alt=""><span class="n">${t.pages.length} tips</span></button>`).join('')}</div>
 </div>
</section>
<section class="screen off-right hidden" id="tipscr">
 <div class="tipwrap"><div class="tip" id="tip"></div></div>
</section>
<div class="top fixed"><button class="back" id="back">${BACK}Back</button><h1>Money Bestie</h1><span class="me"><img src="${IMG.user}" alt=""></span></div>
<nav class="nav"><span class="it">${NAV.home}Home</span><span class="it">${TRACK_OUT}Track</span><span class="it chat">${NAV.chat}</span><span class="it on learn">${NAV.learn}Learn</span><span class="it">${NAV.play}Play</span></nav>
<div class="toast" id="toast"></div>
<div class="tap" id="tap"></div>`;

let cur=null,page=0;
function openTip(i){
 cur=i;page=0;const T=TIPS[i];const tip=$('#tip');tip.classList.remove('in');tip.style.background=T.body;
 tip.innerHTML=`<div class="hero" style="background:${T.bg}"><img src="${PIC[i]}" alt=""></div>
 <div class="body">${T.pages.map((p,j)=>`<div class="pg ${j?'r':''}"><p class="k">Tip ${j+1} of ${T.pages.length}</p><h3>${p[0]}</h3><p>${p[1]}</p></div>`).join('')}</div>
 <div class="zone l" data-z="-1"></div><div class="zone r" data-z="1"></div>
 <div class="foot"><div class="pill">${T.pages.map((_,j)=>`<i class="${j?'':'on'}"></i>`).join('')}</div><button class="nx" id="next" aria-label="Next tip">${NEXT}</button></div>`;
 const g=$('#grid'),s=$('#tipscr');s.classList.remove('hidden');void s.offsetWidth;s.classList.remove('off-right');g.classList.add('off-left');
 setTimeout(()=>g.classList.add('hidden'),460);requestAnimationFrame(()=>tip.classList.add('in'));sync();
}
function closeTip(){
 const g=$('#grid'),s=$('#tipscr');g.classList.remove('hidden');void g.offsetWidth;g.classList.remove('off-left');s.classList.add('off-right');
 setTimeout(()=>s.classList.add('hidden'),460);cur=null;
}
function go(d){
 if(cur===null)return;const n=TIPS[cur].pages.length,np=page+d;
 if(np<0)return;if(np>=n){closeTip();return}
 page=np;sync();
}
function sync(){
 const n=TIPS[cur].pages.length;
 document.querySelectorAll('.pg').forEach((p,j)=>p.className='pg'+(j<page?' l':j>page?' r':''));
 document.querySelectorAll('.pill i').forEach((b,j)=>b.classList.toggle('on',j===page));
 const nx=$('#next');nx.innerHTML=page===n-1?DONE:NEXT;nx.style.color=TIPS[cur].body;nx.setAttribute('aria-label',page===n-1?'Back to all tips':'Next tip');
}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2400)}
function tapAt(el){const p=phone.getBoundingClientRect(),r=el.getBoundingClientRect(),t=$('#tap');t.style.left=(r.left-p.left+r.width/2)+'px';t.style.top=(r.top-p.top+r.height/2)+'px';t.classList.remove('go');void t.offsetWidth;t.classList.add('go')}

phone.addEventListener('click',e=>{
 const t=e.target;
 const c=t.closest('.card');if(c){openTip(+c.dataset.i);return}
 if(t.closest('#back')){if(cur!==null)closeTip();return}
 if(t.closest('#next')){go(1);return}
 const z=t.closest('.zone');if(z){go(+z.dataset.z);return}
});
// swipe on tip
let sx=null;phone.addEventListener('pointerdown',e=>{if(e.target.closest('.tip'))sx=e.clientX});
phone.addEventListener('pointerup',e=>{if(sx===null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)>40){go(dx<0?1:-1);e.preventDefault()}});

/* demo */
let RUN=0,demoOn=false,idleT;
const dsleep=ms=>new Promise((res,rej)=>{const r=RUN;setTimeout(()=>r===RUN&&demoOn?res():rej('stop'),ms)});
async function dtap(sel){const el=typeof sel==='string'?$(sel):sel;if(!el)return;tapAt(el);await dsleep(450);el.click()}
const readT=()=>{const p=TIPS[cur].pages[page];return 2600+(p[0].length+p[1].length)*30};
async function readTip(i,max){
 const c=$(`.card[data-i="${i}"]`);c.scrollIntoView({block:'nearest',behavior:'smooth'});await dsleep(900);
 await dtap(c);await dsleep(900+readT());
 const n=Math.min(max||99,TIPS[i].pages.length);
 for(let j=1;j<n;j++){await dtap('#next');await dsleep(500+readT())}
 await dtap(n===TIPS[i].pages.length?'#next':'#back');await dsleep(1600);
}
function reset(){
 RUN++;demoOn=false;cur=null;
 $('#grid').className='screen';$('#tipscr').className='screen off-right hidden';$('#gscroll').scrollTop=0;
}
async function demo(){
 reset();demoOn=true;
 try{
  await dsleep(2600);
  await readTip(1);
  await readTip(0);
  $('#gscroll').scrollTo({top:240,behavior:'smooth'});await dsleep(1400);
  await readTip(4,2);
  await readTip(5,1);
  $('#gscroll').scrollTo({top:0,behavior:'smooth'});await dsleep(2000);
  demo();
 }catch(e){}
}
function userAct(e){if(!e.isTrusted)return;if(demoOn){demoOn=false;RUN++;}clearTimeout(idleT);idleT=setTimeout(demo,12000)}
['pointerdown','wheel','touchstart'].forEach(ev=>phone.addEventListener(ev,userAct,{passive:true}));
$('#restart').onclick=()=>{clearTimeout(idleT);demo()};
let started=false;
new IntersectionObserver(es=>{if(es.some(x=>x.isIntersecting)&&!started){started=true;demo()}},{threshold:.35}).observe(phone);
reset();
</script>
</body>
</html>
